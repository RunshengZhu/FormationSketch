<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>舞阵 · 队形编排</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== 项目库视图 ===== -->
  <section id="library-view" class="view" hidden>
    <div id="offline-note" class="offline-note" hidden>
      <span>离线版：项目数据保存在本浏览器（配乐不保留）</span>
      <button id="offline-note-close" class="offline-note-x" aria-label="关闭提示" title="关闭提示">×</button>
    </div>
    <header class="lib-header">
      <div class="lib-brand">舞阵 <span class="lib-sub">WuZhen · 队形编排</span></div>
      <button id="btn-new-project" class="btn primary">＋ 新建项目</button>
    </header>
    <div id="library-grid" class="lib-grid"></div>
    <div id="library-empty" class="lib-empty" hidden>
      <div class="lib-empty-icon">💃</div>
      <p>还没有项目，点击右上角「新建项目」开始编排队形</p>
    </div>
  </section>

  <!-- ===== 编辑器视图 ===== -->
  <section id="editor-view" class="view" hidden>
    <header id="topbar">
      <button id="btn-back" class="btn ghost" title="返回项目库">‹ 项目库</button><span id="build-tag" class="build-tag"></span>
      <input id="proj-title" class="title-input" spellcheck="false" title="项目名称">
      <span class="spacer"></span>
      <button id="btn-theme" class="btn ghost" title="切换深色/浅色主题"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="moon" aria-hidden="true" style="vertical-align:-2px"><path d="M12 3a6.3 6.3 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
      <button id="btn-roster" class="btn ghost" title="舞者与编组名单">名册</button>
      <button id="btn-undo" class="btn ghost" title="撤销 (Ctrl+Z)"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="undo" aria-hidden="true" style="vertical-align:-2px"><path d="M8 5L4 9l4 4"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H9"/></svg></button>
      <button id="btn-redo" class="btn ghost" title="重做 (Ctrl+Shift+Z)"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="redo" aria-hidden="true" style="vertical-align:-2px"><path d="M16 5l4 4-4 4"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H15"/></svg></button>
      <div class="dropdown" id="export-dd">
        <button id="btn-export" class="btn ghost">导出 ▾</button>
        <div class="dd-menu" hidden>
          <button id="exp-png">当前队形 PNG</button>
          <button id="exp-print">打印 / PDF（全部队形）</button>
          <button id="exp-json-audio">导出项目文件（含音乐）</button>
          <button id="exp-json">导出项目文件（不含音乐）</button>
          <button id="imp-json">导入项目文件…</button>
        </div>
      </div>
      <!-- 双 UI 模式（round46 Lane A）：编舞=默认（舞台+队形块区，几何与既有版本零变化）；
           音乐=隐藏块区与块时长栏、专注音频剪辑，舞台保留画面但收窄。快捷键 M；
           播放/数拍中禁止切换（toast「暂停后可切换」）。说明书入口不动（manual 归并行线） -->
      <div class="seg" id="ui-mode-seg" role="group" aria-label="编辑器模式（编舞/音乐，快捷键 M）">
        <button id="ui-mode-stage" class="seg-btn active" aria-pressed="true"
          title="编舞模式（默认）：舞台编辑 + 队形块区/块时长栏齐全。按 M 切到音乐模式"><span class="seg-full">编舞</span><span class="seg-short">编</span></button>
        <button id="ui-mode-music" class="seg-btn" aria-pressed="false"
          title="音乐模式：隐藏队形块区与块时长栏，专注音频剪辑；舞台保留画面但收窄，tag/尺规/播放头保留。按 M 切回；播放中暂停后可切换"><span class="seg-full">音乐</span><span class="seg-short">乐</span></button>
      </div>
    </header>

    <div id="editor-main">
      <!-- 左：队形列表 -->
      <aside id="left-panel">
        <div class="panel-head">队形 <span id="formation-count" class="dim"></span></div>
        <div id="formation-list"></div>
        <div class="panel-foot">
          <button id="btn-add-formation" class="btn primary small">＋ 新队形</button>
          <button id="btn-del-formation" class="btn small">删除</button>
        </div>
      </aside>

      <!-- 中：舞台 -->
      <div id="stage-col">
        <div id="stage-tools">
          <button id="btn-edit-mode" class="btn small toggled-on" title="开启：舞台可拖动编辑；关闭：查看模式（舞台随时间轴播放头联动）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="pencil" aria-hidden="true" style="vertical-align:-2px"><path d="M4 20l1.2-4.2L16.6 4.4a2 2 0 0 1 2.9 2.9L8.2 18.7 4 20z"/><path d="M13.6 7.4l3 3"/></svg> 编辑</button>
          <button id="btn-multi" class="btn small" title="多选模式（触摸端多选入口）：开启后点按舞者=追加选择"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="menu" aria-hidden="true" style="vertical-align:-2px"><path d="M4 7h16M4 12h16M4 17h16"/></svg> 多选</button>
          <span class="vsep"></span>
          <select id="gen-kind" title="队形生成器">
            <option value="">生成队形…</option>
            <option value="rows">多横排</option>
            <option value="line">一字横排</option>
            <option value="columns">纵列</option>
            <option value="circle">圆形</option>
            <option value="arc">弧形</option>
            <option value="v">V 形</option>
            <option value="diagonal">斜线</option>
            <option value="diamond">菱形</option>
          </select>
          <select id="gen-unit" title="编队粒度">
            <option value="dancer">单人</option>
            <option value="men">仅男士</option>
            <option value="women">仅女士</option>
          </select>
          <span class="vsep"></span>
          <button id="btn-mirror-h" class="btn small ghost" title="水平镜像"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="flip-h" aria-hidden="true" style="vertical-align:-2px"><path d="M12 3v18M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></button>
          <button id="btn-mirror-v" class="btn small ghost" title="垂直镜像"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="flip-v" aria-hidden="true" style="vertical-align:-2px"><path d="M3 12h18M8 8l4-4 4 4M8 16l4 4 4-4"/></svg></button>
          <label class="rot-ctl" title="整体旋转"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="rotate" aria-hidden="true" style="vertical-align:-2px"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg><input id="rot-slider" type="range" min="-180" max="180" value="0"><span id="rot-val">0°</span></label>
          <button id="btn-distribute" class="btn small ghost" title="所选舞者等间距(竖排间距)">均布</button>
          <button id="btn-swap" class="btn small ghost" title="单元换位（需恰好选中 2 个单元：合并单元或单人）">换位</button>
          <span class="vsep"></span>
          <button id="btn-merge-create" class="btn small ghost" title="将所选两名舞者合并为一个呈示单元（需选中2人）">合并为单元</button>
          <button id="btn-merge-cancel" class="btn small ghost" title="取消所选舞者所在合并单元（两人原地保留）">取消合并</button>
          <span class="vsep"></span>
          <select id="face-target" title="统一朝向">
            <option value="">朝向…</option>
            <option value="audience">面向观众</option>
            <option value="center">面向圆心</option>
          </select>
          <span class="spacer"></span>
          <button id="btn-ghost" class="btn small ghost toggled-on" title="显示前后队形 Ghost">幽灵</button>
          <button id="btn-paths" class="btn small ghost toggled-on" title="显示移动路径">路径</button>
          <button id="btn-switch-anim" class="btn small ghost toggled-on" title="切换队形帧时播放约0.7秒的快速过渡动画（纯界面效果，与时间轴时长无关）">切帧预览</button>
          <button id="btn-fit" class="btn small ghost" title="视图复位">⤢</button>
        </div>
        <div id="formation-index"></div>
        <div id="stage-wrap">
          <canvas id="stage-canvas" title="空白拖动=框选 ｜ 中键拖动或空格+左键拖动=平移（触控板/无中键鼠标无法产生中键时，请用空格+拖动） ｜ 触屏·笔长按空白=框选 ｜ 横向滚轮/触控板横滑=水平平移 ｜ Safari 提示：Cmd+1..9 编组快捷键被浏览器保留，请用右侧编组选项卡"></canvas>
          <div id="countin-overlay" hidden></div>
        </div>
      </div>

      <!-- 右：属性 -->
      <aside id="right-panel">
        <button id="btn-manual-open" class="manual-entry" title="打开使用说明书（全屏阅读）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="book" aria-hidden="true" style="vertical-align:-2px"><path d="M2.5 5H8a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2.5zM21.5 5H16a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h6.5z"/></svg> 使用说明书</button>
        <div class="panel-tabs">
          <button class="ptab active" data-tab="formation">队形</button>
          <button class="ptab" data-tab="stage">舞台</button>
          <button class="ptab" data-tab="style">样式</button>
          <button class="ptab" data-tab="groups">编组</button>
          <button class="mtab" data-tab="manual" title="使用说明书：典型使用动线 / 手势与快捷键速查 / 数据与限制"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="book" aria-hidden="true" style="vertical-align:-2px"><path d="M2.5 5H8a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2.5zM21.5 5H16a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h6.5z"/></svg> 说明书</button>
        </div>
        <div id="props-formation" class="props-page"></div>
        <div id="props-stage" class="props-page" hidden></div>
        <div id="props-style" class="props-page" hidden></div>
        <div id="props-groups" class="props-page" hidden></div>
        <div id="props-manual" class="props-page" hidden></div>
      </aside>
    </div>

    <!-- 底部：播放条 + 时间线 -->
    <div id="bottom-area">
      <div id="playbar">
        <button id="pb-prev" class="btn ghost" title="上一队形"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="skip-back" aria-hidden="true" style="vertical-align:-2px"><path d="M7 5v14"/><path d="M19 6.5v11L10 12z"/></svg></button>
        <button id="pb-play" class="btn primary round" title="播放/暂停（空格）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="play" aria-hidden="true" style="vertical-align:-2px"><path d="M8 5.5v13l11-6.5z"/></svg></button>
        <button id="pb-stop" class="btn ghost round" title="停止"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="stop" aria-hidden="true" style="vertical-align:-2px"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></button>
        <button id="pb-next" class="btn ghost" title="下一队形"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="skip-fwd" aria-hidden="true" style="vertical-align:-2px"><path d="M17 5v14"/><path d="M5 6.5v11L14 12z"/></svg></button>
        <span id="pb-pos" class="mono">1.1</span>
        <span id="pb-formation" class="dim"></span>
        <span class="spacer"></span>
        <label class="ctl" title="播放速度">速度
          <select id="pb-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        </label>
        <label class="ctl" title="循环当前队形段"><input type="checkbox" id="pb-loop">循环</label>
        <!-- 节拍器已移至「🎵 音乐与节拍」主行（id=pb-metro 不变，接线与仪器兼容） -->
      </div>
      <div id="timeline-area">
        <div id="block-ctl">
          <span class="bc-label">块时长</span>
          <span id="bc-name" class="bc-name dim">—</span>
          <span class="vsep"></span>
          <span class="ctl">保持
            <button id="bc-hold-minus" class="btn small step" title="−1拍">−</button>
            <span id="bc-hold" class="mono bc-val">16拍</span>
            <button id="bc-hold-plus" class="btn small step" title="＋1拍">＋</button>
          </span>
          <span class="ctl" id="bc-travel-wrap">过渡
            <button id="bc-travel-minus" class="btn small step" title="−1拍">−</button>
            <span id="bc-travel" class="mono bc-val">8拍</span>
            <button id="bc-travel-plus" class="btn small step" title="＋1拍">＋</button>
          </span>
          <button id="btn-tag-drop" class="btn small" title="在当前播放头位置打一个音乐标记（主歌/副歌/间奏…）；时间轴 tag 道双击空白也可打点"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="flag" aria-hidden="true" style="vertical-align:-2px"><path d="M6 21V4"/><path d="M6 5c2-1.3 4-1.3 6 0s4 1.3 6 0v8c-2 1.3-4 1.3-6 0s-4-1.3-6 0"/></svg><span class="hide-mobile"> 打点</span></button>
          <span id="bc-sec" class="dim hide-mobile"></span>
          <span class="spacer"></span>
          <span class="dim hide-mobile">拖动块边缘可连续调节（自动吸附节拍）</span>
        </div>
        <div id="music-strip">
          <details id="audio-disc" open>
            <summary title="展开/收起音乐设置"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="music" aria-hidden="true" style="vertical-align:-2px"><path d="M9 18V5.5L20 3.5V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg> 音乐与节拍</summary>
            <div id="audio-panel">
              <!-- 主行（常驻，服务对齐编辑）：载入/更换音乐、BPM、首拍+对齐、节拍器；缩放服务时间线查看 -->
              <button id="btn-load-audio" class="btn small">载入音乐…</button>
              <input type="file" id="audio-file" accept="audio/*" hidden>
              <input type="file" id="media-files" accept="audio/*" multiple hidden>
              <span id="audio-name" class="dim">未载入音乐</span>
              <button id="btn-media-library" class="btn small" title="媒体库：导入/管理音乐资产（多文件），指定配乐"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="library" aria-hidden="true" style="vertical-align:-2px"><path d="M5 4v16M9 4v16"/><path d="M12.5 4.2l4.4-1.2 3.8 14.4-4.4 1.2z"/></svg><span class="hide-mobile"> 媒体库</span></button>
              <button id="btn-auto-split" class="btn small" title="按队形段自动切：块边界→分割点，段间自动交叉淡化（时长=过渡拍）；结果为一组自由 clip，可继续逐个微调"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="razor" aria-hidden="true" style="vertical-align:-2px"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.3 7.8L20 19.5M8.3 16.2L20 4.5"/></svg><span class="hide-mobile"> 按队形段自动切</span></button>
              <span class="vsep"></span>
              <label class="ctl">BPM <input id="bpm-input" type="number" min="30" max="300" step="1" style="width:56px"></label>
              <label class="ctl">首拍 <input id="offset-input" type="number" min="0" step="0.01" style="width:64px">s</label>
              <button id="btn-align-playhead" class="btn small" title="把当前队形块的起点对齐到播放头所在时间戳（自动调整前一段过渡时长）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="align-left" aria-hidden="true" style="vertical-align:-2px"><path d="M5 4v16M20 12H9M12.5 8.5L9 12l3.5 3.5"/></svg> 对齐到播放头</button>
              <label class="ctl" title="节拍器（播放时每拍一声，小节首拍高音）"><input type="checkbox" id="pb-metro">节拍器</label>
              <span class="spacer"></span>
              <!-- 尺规刻度切换（round46 Lane A·决策⑥）：拍=小节/8拍（恒定 BPM 口径，默认）；
                   秒=变速曲/无节拍音乐的降级对齐刻度。选择 localStorage 记忆 -->
              <button id="tl-scale-toggle" class="btn small" title="尺规刻度：拍（小节/8 拍，恒定 BPM 口径）与秒（变速曲或无节拍音乐的降级对齐）切换。选择会记住">拍刻度</button>
              <button id="tl-zoom-out" class="btn small" title="缩小时间线">－</button>
              <button id="tl-zoom-in" class="btn small" title="放大时间线">＋</button>
              <button id="tl-zoom-fit" class="btn small" title="适应宽度">⤢</button>
              <!-- 校准子行（默认收起）：低频校准工具收进折叠，主行保持对齐编辑动线最短 -->
              <details id="calib-disc">
                <summary title="展开/收起校准工具（点拍 / 小节 / 数拍入场 / 试听 / 连续时长）">校准</summary>
                <div id="calib-panel">
                  <button id="btn-tap" class="btn small" title="连点 3 次起算，取最近 8 次平均（停 2.5s 重新起算）">点拍</button>
                  <label class="ctl">小节 <select id="bpb-select"><option value="4">4拍</option><option value="3">3拍</option><option value="2">2拍</option><option value="6">6拍</option></select></label>
                  <label class="ctl">数拍入场 <input id="countin-input" type="number" min="0" max="32" style="width:44px"></label>
                  <button id="btn-offset-test" class="btn small" title="从首拍前2秒播放，检查对齐">试听</button>
                  <label class="ctl" title="开：改某块保持时长后续块顺延；关：压缩自身过渡、后续块不动"><input type="checkbox" id="ripple-check" checked>连续时长</label>
                </div>
              </details>
            </div>
          </details>
          <div id="tl-body">
            <!-- 音轨附属 DOM 层（v3）：轨左端展开/收起钮、展开态表头（120px）、空态入口 -->
            <button id="tl-audio-toggle" title="展开音频轨（Audition Lite 剪辑）" aria-label="展开音频轨"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="chevron-down" aria-hidden="true" style="vertical-align:-2px"><path d="M6 10l6 6 6-6"/></svg></button>
            <div id="tl-head" hidden title="音轨表头（展开态）"></div>
            <!-- 多轨轨头（汇合轮，音乐模式）：每轨 轨名/音量/静音/删轨 + 底部加轨条，内容由 main.js 按项目轨态渲染 -->
            <div id="tl-tracks-head" hidden></div>
            <div id="tl-audio-empty" hidden>
              <button id="tl-empty-load" class="btn small" title="载入音乐文件（mp3/wav/m4a…）">＋ 载入音乐</button>
              <button id="tl-empty-library" class="btn small" title="打开媒体库（多文件导入 / 指定配乐）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="library" aria-hidden="true" style="vertical-align:-2px"><path d="M5 4v16M9 4v16"/><path d="M12.5 4.2l4.4-1.2 3.8 14.4-4.4 1.2z"/></svg> 媒体库</button>
            </div>
            <div id="tl-scroll"><div id="tl-inner">
              <canvas id="tl-canvas"></canvas>
              <canvas id="tl-overlay"></canvas>
            </div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 移动端底部 Tab -->
    <nav id="mobile-tabs">
      <button data-mtab="formations">队形</button>
      <button data-mtab="stage" class="active">舞台</button>
      <button data-mtab="more">更多</button>
    </nav>
  </section>

  <!-- 说明书全屏覆盖层（移动端「更多」入口打开；桌面与页签复用同一 renderManual 内容） -->
  <div id="manual-overlay" hidden>
    <header class="manual-ov-head">
      <span class="manual-ov-title"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="book" aria-hidden="true" style="vertical-align:-2px"><path d="M2.5 5H8a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2.5zM21.5 5H16a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h6.5z"/></svg> 使用说明书</span>
      <button id="btn-manual-close" class="btn small">完成 <svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="close" aria-hidden="true" style="vertical-align:-2px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div id="manual-overlay-body" class="manual-ov-body"></div>
  </div>

  <!-- 弹窗与提示 -->
  <div id="modal-root" hidden></div>
  <div id="toasts"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
