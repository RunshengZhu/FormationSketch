<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>舞阵 · 队形编排</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== 项目库视图 ===== -->
  <section id="library-view" class="view" hidden>
    <div id="offline-note" class="offline-note" hidden>
      <span>离线版：项目数据保存在本浏览器（配乐不保留）</span>
      <button id="offline-note-close" class="offline-note-x" aria-label="关闭提示" title="关闭提示">×</button>
    </div>
    <header class="lib-header">
      <div class="lib-brand">舞阵 <span class="lib-sub hide-mobile">WuZhen · 队形编排</span></div>
      <!-- build-58-manual3 F2：项目库首页显著说明书入口（文字+book 图标，accent 边框；首次访问脉冲高亮
           wuzhen:manualSeen，见 main.js wireManualFirstRun）。与编辑器顶栏钮共用 #manual-overlay，打开即回开场 -->
      <div class="lib-actions">
        <!-- build-71-iomenu F1：项目库同款「导入/导出」入口——与编辑器顶栏 #btn-export 共用
             #app 级 #io-menu（单组件，非复制菜单）；项目库无保存覆盖语境（无打开项目），
             保存覆盖条目由 main.js syncSaveBackItem 自然隐藏 -->
        <button id="btn-lib-io" class="btn ghost">导入/导出 ▾</button>
        <!-- build-72-checkupdate F1：项目库同款「检查更新」入口（首页随时可见）——与编辑器顶栏
             #btn-check-update 同走 main.js forceReloadToLatest（单实现非复制）；移动端收纯图标
             （标签 hide-mobile，title 兜底语义），.lib-header 本就 flex-wrap 兜底不横溢 -->
        <button id="btn-lib-check-update" class="btn ghost" title="强制刷新页面到最新版本"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="rotate" aria-hidden="true" style="vertical-align:-2px"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg><span class="hide-mobile"> 检查更新</span></button>
        <button id="btn-library-manual" class="btn lib-manual" title="使用说明书（图文逐步：五幕工作流 / 附录 A·功能模块详解 / 附录 B·手势与快捷键速查 / 数据与限制）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="book" aria-hidden="true" style="vertical-align:-2px"><path d="M2.5 5H8a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2.5zM21.5 5H16a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h6.5z"/></svg> 使用说明书</button>
        <button id="btn-new-project" class="btn primary">＋ 新建项目</button>
      </div>
    </header>
    <div id="library-grid" class="lib-grid"></div>
    <div id="library-empty" class="lib-empty" hidden>
      <div class="lib-empty-icon">💃</div>
      <p>还没有项目，点击右上角「新建项目」开始编排队形</p>
    </div>
  </section>

  <!-- ===== 编辑器视图 ===== -->
  <section id="editor-view" class="view" hidden>
    <header id="topbar">
      <!-- build-66-mobileux F2：顶栏两段结构——固定段 #ui-mode-seg（编舞/音乐切换）flex:none
           恒可见（不再被 ≤1023.5px 顶栏横滚挤出首屏，375 不滚动即可点）；滚动段 #topbar-scroll
           包住其余工具（overflow-x:auto 只挂滚动段，C-09a 口径照旧；#export-dd 入口（菜单本体
           build-71 起为 #app 级共享 #io-menu）的 fixed 摆位/横滚收起监听随容器搬家）。桌面 ≥1024 无 overflow，内部布局与旧直挂同构单行 -->
      <div id="topbar-scroll">
      <button id="btn-back" class="btn ghost" title="返回项目库">‹ 项目库</button><span id="build-tag" class="build-tag"></span>
      <input id="proj-title" class="title-input" spellcheck="false" title="项目名称">
      <span class="spacer"></span>
      <button id="btn-theme" class="btn ghost" title="切换深色/浅色主题"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="moon" aria-hidden="true" style="vertical-align:-2px"><path d="M12 3a6.3 6.3 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
      <!-- build-72-checkupdate F1：「检查更新」钮（随时可见，名册旁）——一键强制刷新到最新版，
           克服浏览器缓存滞留。语义极简（无网络探测/版本比对）：SW（HTTPS）场景先注销全部
           Service Worker + 删尽 Cache Storage 壳再 location.reload()；HTTP no-cache+etag 下
           reload 即拉最新。实现与项目库 #btn-lib-check-update 同走 main.js forceReloadToLatest。
           移动端收纯图标（标签 hide-mobile，title 兜底语义，C-09a；刷新图标=图标库 rotate ⟳） -->
      <button id="btn-check-update" class="btn ghost" title="强制刷新页面到最新版本"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="rotate" aria-hidden="true" style="vertical-align:-2px"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg><span class="hide-mobile"> 检查更新</span></button>
      <button id="btn-roster" class="btn ghost" title="舞者与编组名单">名册</button>
      <!-- build-55-uiclean P2：说明书入口自右面板页签迁顶栏（名册旁）——打开 #manual-overlay 全屏浮层，
           内容仍走 renderManual；id=btn-manual-open 不变（wireManual 接线/仪器兼容）。
           build-58-manual3 F3：两模式（编舞/音乐）恒显「图标+文字」并强化样式（accent 描边）；
           移动端用短字「说明」（.only-mobile），不再收成纯图标。取舍：编舞右面板页签区（.panel-tabs）
           与音乐模式 rsb 区（#right-sidebar）不加说明书入口——顶栏入口两模式恒在，重复入口徒增拥挤 -->
      <button id="btn-manual-open" class="btn ghost" title="使用说明书（全屏阅读：典型使用动线 / 附录 A·功能模块详解 / 附录 B·手势与快捷键速查 / 数据与限制）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="book" aria-hidden="true" style="vertical-align:-2px"><path d="M2.5 5H8a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2.5zM21.5 5H16a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h6.5z"/></svg><span class="man-lbl-full"> 说明书</span><span class="man-lbl-short only-mobile"> 说明</span></button>
      <button id="btn-undo" class="btn ghost" title="撤销 (Ctrl+Z)"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="undo" aria-hidden="true" style="vertical-align:-2px"><path d="M8 5L4 9l4 4"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H9"/></svg></button>
      <button id="btn-redo" class="btn ghost" title="重做 (Ctrl+Shift+Z)"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="redo" aria-hidden="true" style="vertical-align:-2px"><path d="M16 5l4 4-4 4"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H15"/></svg></button>
      <!-- build-71-iomenu F1：「导出 ▾」改名「导入/导出 ▾」——项目文件交互统一入口。
           菜单本体迁出为 #app 级共享 #io-menu（两视图共用，见页尾）；
           旧 #export-dd/#btn-export id 与接线保留（改名文案即可，减少接线搬迁） -->
      <div class="dropdown" id="export-dd">
        <button id="btn-export" class="btn ghost">导入/导出 ▾</button>
      </div>
      </div><!-- /#topbar-scroll -->
      <!-- 双 UI 模式（round46 Lane A）：编舞=默认（舞台+队形块区，几何与既有版本零变化）；
           音乐=隐藏块区与块时长栏、专注音频剪辑，舞台保留画面但收窄。快捷键 M；
           播放中禁止切换（toast「暂停后可切换」）。说明书入口在顶栏（build-55-uiclean P2 迁入）。
           build-66-mobileux F2：本段自滚动流移出为固定段（flex:none），移动端首屏恒可见 -->
      <div class="seg" id="ui-mode-seg" role="group" aria-label="编辑器模式（编舞/音乐，快捷键 M）">
        <button id="ui-mode-stage" class="seg-btn active" aria-pressed="true"
          title="编舞模式（默认）：舞台编辑 + 队形块区/块时长栏齐全。按 M 切到音乐模式"><span class="seg-full">编舞</span><span class="seg-short">编</span></button>
        <button id="ui-mode-music" class="seg-btn" aria-pressed="false"
          title="音乐模式：隐藏队形块区与块时长栏，专注音频剪辑；舞台保留画面但收窄，tag/尺规/播放头保留。按 M 切回；播放中暂停后可切换"><span class="seg-full">音乐</span><span class="seg-short">乐</span></button>
      </div>
    </header>

    <div id="editor-main">
      <!-- 左：队形列表 -->
      <aside id="left-panel">
        <div class="panel-head">队形 <span id="formation-count" class="dim"></span>
          <!-- build-51-stageux F3：列头折叠钮（桌面编舞模式呈示；⇄ 38px 竖排细条，记忆 wuzhen:stageLeft） -->
          <button id="lp-collapse" class="col-fold" aria-expanded="true" title="收起队形列表（记忆）">«</button>
        </div>
        <div id="formation-list"></div>
        <div class="panel-foot">
          <button id="btn-add-formation" class="btn primary small">＋ 新队形</button>
          <button id="btn-del-formation" class="btn small">删除</button>
        </div>
        <button id="lp-strip" class="col-strip" title="展开队形列表（记忆）" aria-label="展开队形列表"><svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>队形</button>
        <!-- build-73-syncui F2：左列内缘拖宽 grip（桌面编舞模式呈示；宽 [120,400]，记忆
             wuzhen:stageLeftW，双击复位；折叠/移动端自动失效——折叠逻辑不变） -->
        <div id="lp-grip" class="stage-grip grip-v" title="拖动调宽（双击复位）" aria-hidden="true"></div>
      </aside>

      <!-- 中：舞台 -->
      <div id="stage-col">
        <div id="stage-tools">
          <button id="btn-edit-mode" class="btn small toggled-on" title="开启：舞台可拖动编辑；关闭：查看模式（舞台随时间轴播放头联动）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="pencil" aria-hidden="true" style="vertical-align:-2px"><path d="M4 20l1.2-4.2L16.6 4.4a2 2 0 0 1 2.9 2.9L8.2 18.7 4 20z"/><path d="M13.6 7.4l3 3"/></svg> 编辑</button>
          <button id="btn-multi" class="btn small" title="多选模式（触摸端多选入口）：开启后点按舞者=追加选择"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="menu" aria-hidden="true" style="vertical-align:-2px"><path d="M4 7h16M4 12h16M4 17h16"/></svg> 多选</button>
          <!-- build-62-formations2 F3：观众方向快捷钮（bottom↔top 一键切换，单条「观众方向」历史；
               文字随状态由 main.js render 同步；四向微调仍在舞台页签 select） -->
          <button id="btn-audience-dir" class="btn small ghost" title="观众显示方向：观众在下（正面视角）/观众在上（背面镜像视角）一键切换，可撤销"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="flip-v" aria-hidden="true" style="vertical-align:-2px"><path d="M3 12h18M8 8l4-4 4 4M8 16l4 4 4-4"/></svg> <span id="audience-dir-label">观众在下</span></button>
          <span class="vsep"></span>
          <!-- build-62-formations2 F1：生成器按「基础/几何/线条」分组（optgroup），+13 种常用队形；
               旧 8 种 value 不变（兼容既有测试/用户习惯） -->
          <select id="gen-kind" title="队形生成器">
            <option value="">生成队形…</option>
            <optgroup label="基础">
              <option value="rows">多横排</option>
              <option value="line">一字横排</option>
              <option value="columns">纵列</option>
              <option value="grid">方阵网格</option>
            </optgroup>
            <optgroup label="几何">
              <option value="circle">圆形</option>
              <option value="arc">弧形</option>
              <option value="halfcircle">反半圆</option>
              <option value="diamond">菱形</option>
              <option value="triangle">三角形</option>
              <option value="parallelogram">平行四边形</option>
              <option value="chevron">楔形</option>
              <option value="star">五角星</option>
              <option value="xpattern">X 形</option>
              <option value="center-surround">众星捧月</option>
              <option value="doublecircle">双圆</option>
            </optgroup>
            <optgroup label="线条">
              <option value="v">V 形</option>
              <option value="diagonal">斜线</option>
              <option value="diagonal2">双斜线</option>
              <option value="staggered">交错横排</option>
              <option value="sline">蛇形</option>
              <option value="heart">心形</option>
            </optgroup>
          </select>
          <select id="gen-unit" title="编队粒度">
            <option value="dancer">单人</option>
            <option value="men">仅男士</option>
            <option value="women">仅女士</option>
          </select>
          <span class="vsep"></span>
          <button id="btn-mirror-h" class="btn small ghost" title="水平镜像"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="flip-h" aria-hidden="true" style="vertical-align:-2px"><path d="M12 3v18M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></button>
          <button id="btn-mirror-v" class="btn small ghost" title="垂直镜像"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="flip-v" aria-hidden="true" style="vertical-align:-2px"><path d="M3 12h18M8 8l4-4 4 4M8 16l4 4 4-4"/></svg></button>
          <label class="rot-ctl" title="整体旋转"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="rotate" aria-hidden="true" style="vertical-align:-2px"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg><input id="rot-slider" type="range" min="-180" max="180" value="0"><span id="rot-val">0°</span></label>
          <button id="btn-distribute" class="btn small ghost" title="所选舞者等间距(竖排间距)">均布</button>
          <button id="btn-swap" class="btn small ghost" title="单元换位（需恰好选中 2 个单元：合并单元或单人）">换位</button>
          <span class="vsep"></span>
          <button id="btn-merge-create" class="btn small ghost" title="将所选两名舞者合并为一个呈示单元（需选中2人）">合并为单元</button>
          <button id="btn-merge-cancel" class="btn small ghost" title="取消所选舞者所在合并单元（两人原地保留）">取消合并</button>
          <span class="vsep"></span>
          <select id="face-target" title="统一朝向">
            <option value="">朝向…</option>
            <option value="audience">面向观众</option>
            <option value="center">面向圆心</option>
          </select>
          <span class="spacer"></span>
          <!-- build-55-uiclean P3：幽灵/路径/切帧预览三状态开关收纳为「显示…」下拉（与导出菜单同款
               dropdown 结构；菜单 fixed 摆位同 #io-menu（build-71 起原 #export-dd 菜单迁此）方案）。三项勾选态由 main.js render
               按 store（showGhost/showPaths/previewOnSwitch）同步，store 字段不变 -->
          <div class="dropdown" id="view-dd">
            <button id="btn-view-dd" class="btn small ghost" title="显示开关：幽灵（前后队形虚影）/ 路径（移动轨迹）/ 切帧预览（换帧过渡动画）">显示…</button>
            <div class="dd-menu" hidden>
              <button id="vw-ghost" role="menuitemcheckbox" aria-checked="true" title="显示前后队形 Ghost">幽灵（前后队形虚影）</button>
              <button id="vw-paths" role="menuitemcheckbox" aria-checked="true" title="显示移动路径">路径（移动轨迹虚线）</button>
              <button id="vw-anim" role="menuitemcheckbox" aria-checked="true" title="切换队形帧时播放约0.7秒的快速过渡动画（纯界面效果，与时间轴时长无关）">切帧预览（换帧过渡动画）</button>
            </div>
          </div>
          <button id="btn-fit" class="btn small ghost" title="视图复位">⤢</button>
        </div>
        <div id="formation-index"></div>
        <div id="stage-wrap">
          <canvas id="stage-canvas" title="空白拖动=框选 ｜ 中键拖动或空格+左键拖动=平移（触控板/无中键鼠标无法产生中键时，请用空格+拖动） ｜ 触屏·笔长按空白=框选 ｜ 横向滚轮/触控板横滑=水平平移 ｜ Safari 提示：Cmd+1..9 编组快捷键被浏览器保留，请用右侧编组选项卡"></canvas>
        </div>
      </div>

      <!-- 右：属性 -->
      <aside id="right-panel">
        <!-- build-51-stageux F3：属性列折叠钮（桌面编舞模式呈示；⇄ 38px 竖排细条，记忆 wuzhen:stageRight） -->
        <button id="rp-collapse" class="col-fold" aria-expanded="true" title="收起属性列（记忆）">»</button>
        <!-- build-55-uiclean P2：说明书页签与页容器退役，入口迁顶栏「说明书」钮；
             build-56-indextab：索引入栏为第 5 页签（data-tab="index" → #props-index），
             切换机制（data-tab → 页容器显隐）不变，显隐收口 activatePropsTab 单入口 -->
        <div class="panel-tabs">
          <button class="ptab active" data-tab="formation">队形</button>
          <button class="ptab" data-tab="stage">舞台</button>
          <button class="ptab" data-tab="style">样式</button>
          <button class="ptab" data-tab="groups">编组</button>
          <button class="ptab" data-tab="index">索引</button>
        </div>
        <div id="props-formation" class="props-page"></div>
        <div id="props-stage" class="props-page" hidden></div>
        <div id="props-style" class="props-page" hidden></div>
        <div id="props-groups" class="props-page" hidden></div>
        <!-- build-56-indextab F2：乐段索引页容器——播放头行 + si-list 由 main.js siMount 单挂载
             （#si-playhead/#si-list 全文档唯一），内容高度 flex 撑满右面板 -->
        <div id="props-index" class="props-page si-page" hidden></div>
        <button id="rp-strip" class="col-strip" title="展开属性列（记忆）" aria-label="展开属性列"><svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>属性</button>
        <!-- build-73-syncui F2：右列内缘拖宽 grip（桌面编舞模式呈示；宽 [200,400]，记忆
             wuzhen:stageRightW，双击复位；折叠/移动端自动失效——折叠逻辑不变） -->

          <input type="file" id="media-files" accept=".mp3,.wav,.m4a,.aac,.flac,.ogg,audio/*" multiple hidden>
          <div id="tl-body">
            <!-- C12 空态合并（W2）：旧「＋载入音乐/媒体库」双钮退役（音乐模式空态由工具条资产组承接）；
                 编舞简单道无音乐时呈一行灰字，点击跳音乐模式 -->
            <div id="tl-audio-empty" hidden title="到音乐模式载入（M 或点击本行）">未载入音乐 · 到音乐模式载入</div>
            <!-- M2 轨头 container 化：#tl-tracks-head 从 #tl-body 绝对定位浮层改为 #tl-scroll 内
                 sticky flex 左缘固定列（.tl-grid 行容器 = 轨头列 + lane 区兄弟），行高同变量对齐
                 按构造成立、遮挡与错位按构造消失；内容由 main.js syncTracksHead 按轨态+laneH 重建 -->
            <div id="tl-scroll"><div class="tl-grid">
              <div id="tl-tracks-head" hidden></div>
              <div id="tl-inner">
                <canvas id="tl-canvas"></canvas>
                <canvas id="tl-overlay"></canvas>
              </div>
            </div></div>
            <!-- build-51-stageux F4：时间轴底部导航滑块（视口概览条，两模式恒显）——
                 拇指=当前可视窗口占全时域比例，拖动=平移，点空白=视口中心跳转；
                 内容不溢出=满宽禁用态。原生细滚条保留（概览导航不替代）。 -->
            <div id="tl-nav" aria-label="时间轴概览导航条"><div id="tl-nav-thumb"></div></div>
          </div>
        </div>
        <!-- ===== 右侧合并侧边栏（build-46-layout：队形预览上 + 媒体库下）=====
             两段各自可纵向收起（段头箭头，记忆 wuzhen:rsbPreview / wuzhen:rsbLib；一侧收起
             另一侧吃余量）；整栏可收起成细条（wuzhen:rsbClosed）+ 左缘 grip 拖宽
             （180–480px=max(480, 容器40%)，记忆 wuzhen:rsbW）。桌面=右侧纵栏与多轨区 flex 并排；
             移动端=底部抽屉（默认收成 88px 迷你预览条，上滑/呼出钮展开 ≤50vh，多轨区始终可见）。
             #music-preview / #media-sidebar 元素 id 原样保留（main.js/timeline.js 按 id 取用）。
             编舞模式整体不可见（CSS 默认 display:none，E-12 作用域）。 -->
        <aside id="right-sidebar">
          <div id="rsb-grip" title="拖拽调整侧边栏宽度（180–480px，记忆）"></div>
          <button id="rsb-collapse" title="收起侧边栏（记忆）">»</button>
          <div id="rsb-body">
            <section id="rsb-preview-seg" class="rsb-seg">
              <header class="rsb-seg-head">
                <button id="rsb-preview-toggle" class="rsb-seg-toggle" aria-expanded="true" title="折叠/展开队形预览（记忆）">▾</button>
                <span class="rsb-seg-title">队形预览</span>
              </header>
              <div id="music-preview" class="rsb-seg-body" title="当前队形预览（随播放头同步；只读——舞台编辑请切回编舞模式）">
                <canvas id="mp-canvas"></canvas>
                <div id="mp-name" class="mp-name">—</div>
                <div class="mp-block">
                  <!-- build-79-tlui（需求 3）：± 钮 title 与块时长条同口径——±0.1s 是时长不是缩放
                       （原 −1拍/＋1拍 语义随 build-78 ±0.1s 步进已过期，一并校正） -->
                  <span class="ctl">保持 <span id="mp-hold" class="mono">—</span>
                    <button id="mp-hold-minus" class="btn small step" title="保持时长 −0.1s（±0.1s 调整的是队形时长，不是时间轴视图缩放——缩放用尺规 －/＋ 或滚轮）">−</button>
                    <button id="mp-hold-plus" class="btn small step" title="保持时长 ＋0.1s（±0.1s 调整的是队形时长，不是时间轴视图缩放——缩放用尺规 －/＋ 或滚轮）">＋</button>
                  </span>
                  <span class="ctl">过渡 <span id="mp-travel" class="mono">—</span>
                    <button id="mp-travel-minus" class="btn small step" title="过渡时长 −0.1s（±0.1s 调整的是队形时长，不是时间轴视图缩放——缩放用尺规 －/＋ 或滚轮）">−</button>
                    <button id="mp-travel-plus" class="btn small step" title="过渡时长 ＋0.1s（±0.1s 调整的是队形时长，不是时间轴视图缩放——缩放用尺规 －/＋ 或滚轮）">＋</button>
                  </span>
                </div>
                <button id="mp-align" class="btn small" title="把当前队形 clip 的起点对齐到播放头所在时间戳（整段平移，钳制不越相邻队形）">对齐到播放头</button>
              </div>
            </section>
            <section id="rsb-lib-seg" class="rsb-seg rsb-grow">
              <header class="rsb-seg-head">
                <button id="rsb-lib-toggle" class="rsb-seg-toggle" aria-expanded="true" title="折叠/展开媒体库（记忆）">▾</button>
                <!-- build-56-indextab F2：段头 tab 条 [媒体库|索引]——两 pane 互斥显隐（既有媒体库内容
                     pane ⇄ 索引 pane=播放头行+si-list，由 main.js siMount 单挂载）。
                     类名用 .rsb-tabs/.rtab（不入 .panel-tabs——那是 stage 右面板页签组，全局选择器互不串场） -->
                <nav class="rsb-tabs" aria-label="媒体库段视图切换">
                  <button class="rtab active" data-pane="lib" aria-selected="true">媒体库</button>
                  <button class="rtab" data-pane="index" aria-selected="false">索引</button>
                </nav>
              </header>
              <div id="media-sidebar" class="rsb-seg-body" aria-label="媒体库 · 音乐资产">
                <div id="msb-body"></div>
              </div>
              <!-- 索引 pane：折叠态随 .rsb-folded 整段收起（rsb-seg-body 类共用折叠规则）；
                   播放头行 + si-list 由 siMount 挂入，内容高度吃 rsb 余量 -->
              <div id="rsb-index-pane" class="rsb-seg-body rsb-index-pane" hidden></div>
            </section>
          </div>
        </aside>
      </div>
    </div>

    <!-- build-51-stageux F3：底部折叠细条（stage 模式 + #bottom-area.ba-collapsed 时呈示）——
         28px「时间轴」细条，整条点击=展开（记忆 wuzhen:stageBottom）；CSS stage 作用域，
         音乐模式恒隐藏（#bottom-area 折叠类不串场） -->
    <button id="bottom-strip" title="展开底部时间轴区（记忆）" aria-label="展开底部时间轴区"><svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>时间轴</button>

    <!-- 移动端底部 Tab -->
    <nav id="mobile-tabs">
      <button data-mtab="formations">队形</button>
      <button data-mtab="stage" class="active">舞台</button>
      <button data-mtab="more">更多</button>
    </nav>
  </section>

  <!-- 说明书全屏覆盖层（build-55-uiclean P2：顶栏「说明书」钮打开；Esc/「完成」关闭。
       桌面与移动共用同一 renderManual 内容） -->
  <div id="manual-overlay" hidden>
    <header class="manual-ov-head">
      <span class="manual-ov-title"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="book" aria-hidden="true" style="vertical-align:-2px"><path d="M2.5 5H8a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2.5zM21.5 5H16a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h6.5z"/></svg> 使用说明书</span>
      <button id="btn-manual-close" class="btn small">完成 <svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="close" aria-hidden="true" style="vertical-align:-2px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div id="manual-overlay-body" class="manual-ov-body"></div>
  </div>

  <!-- build-71-iomenu F1：导入/导出统一菜单（#app 级共享，两视图可见）。
       原 #export-dd 内联 .dd-menu 迁出：顶栏在 #editor-view 内、项目库（.lib-header）无顶栏，
       hidden 祖先会连 fixed 后代一起隐藏——菜单必须放视图节区之外才能两视图共用同一组件。
       摆位仍是 fixed（打开时按触发钮视口坐标放置，main.js openIoMenu）。
       root 结构：保存覆盖（F2 条目，仅会话内从文件导入且已修改时可见）→ 从项目文件导入…
       → 导出 ▸ 二级子菜单（原五项全部保留迁移，id 不变：exp-png/exp-video/exp-print/
       exp-json-audio/exp-json；点击/悬停展开，触屏以点击为准） -->
  <div class="dd-menu" id="io-menu" hidden>
    <button id="save-back" hidden title="把当前修改写回导入时的原文件（本会话从文件导入后才可用）">保存覆盖到原文件…</button>
    <button id="imp-json">从项目文件导入…</button>
    <button id="exp-sub-toggle" aria-expanded="false" aria-controls="exp-submenu">导出</button>
    <div id="exp-submenu" hidden>
      <button id="exp-png">当前队形 PNG</button>
      <button id="exp-video">导出视频（编排播放）</button>
      <button id="exp-audio">仅导出音频</button>
      <button id="exp-print">打印 / PDF（全部队形）</button>
      <button id="exp-json-audio">导出项目文件（含音乐）</button>
      <button id="exp-json">导出项目文件（不含音乐）</button>
    </div>
  </div>

  <!-- 弹窗与提示 -->
  <div id="modal-root" hidden></div>
  <div id="toasts"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
