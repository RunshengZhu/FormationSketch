<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>舞阵 · 队形编排</title>
<style>
/* Formation Studio · 移动优先 + 桌面断点 · 深浅双主题 */
:root{ /* 浅色（默认） */
  --bg:#f1f5f9; --bg2:#ffffff; --bg3:#e2e8f0; --line:#cbd5e1;
  --fg:#1e293b; --dim:#64748b; --acc:#0284c7; --acc2:#0284c7;
  --m:#3b82f6; --f:#ec4899; --x:#10b981; --danger:#dc2626;
  --toast-bg:#ffffffd9; --stage-chrome:#dfe6ee;
  --rad:8px; --tb-h:48px; --pb-h:44px;
}
[data-theme="dark"]{
  --bg:#0f172a; --bg2:#1e293b; --bg3:#273449; --line:#334155;
  --fg:#e2e8f0; --dim:#94a3b8; --acc:#38bdf8; --acc2:#0ea5e9;
  --danger:#ef4444;
  --toast-bg:#0b1220ee; --stage-chrome:#0b1220;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;overflow:hidden}
#app,.view{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input:focus,select:focus{outline:1px solid var(--acc)}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.dim{color:var(--dim);font-size:12px}
.spacer{flex:1}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
[hidden]{display:none !important}

/* ---- 通用控件 ---- */
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:var(--rad);padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.round{border-radius:50%;width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn.toggled-on{background:var(--bg3);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.ctl{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;white-space:nowrap}
.rot-ctl{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px}
.rot-ctl input[type=range]{width:90px;padding:0}
.dropdown{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad);min-width:200px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:4px}
.dd-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px}
.dd-menu button:hover{background:var(--bg3)}

/* ---- 项目库 ---- */
#library-view{display:flex;flex-direction:column;overflow:auto}
.lib-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;background:var(--bg);z-index:5}
.lib-brand{font-size:20px;font-weight:700}
.lib-sub{font-size:13px;color:var(--dim);font-weight:400;margin-left:6px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:6px 20px 30px}
.lib-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.lib-card:hover{border-color:var(--acc)}
.lib-card canvas{display:block;width:100%;background:#f8fafc}
.lib-card .lc-body{padding:10px 12px}
.lib-card .lc-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-card .lc-meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px}
.lib-card .lc-del{background:none;border:0;color:var(--dim);padding:2px 4px}
.lib-card .lc-del:hover{color:var(--danger)}
.lib-empty{padding:80px 20px;text-align:center;color:var(--dim)}
.lib-empty-icon{font-size:44px;margin-bottom:8px}

/* ---- 编辑器布局（移动优先） ---- */
#editor-view{display:flex;flex-direction:column}
#topbar{height:var(--tb-h);display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.title-input{background:transparent;border:1px solid transparent;font-weight:600;max-width:280px;min-width:60px}
.title-input:hover,.title-input:focus{background:var(--bg3);border-color:var(--line)}
#editor-main{flex:1;display:flex;min-height:0;position:relative}
#left-panel{display:none;flex-direction:column;width:180px;border-right:1px solid var(--line);background:var(--bg2);flex:none;min-height:0}
.panel-head{padding:10px 12px 6px;font-weight:600;font-size:13px}
.panel-foot{padding:8px;border-top:1px solid var(--line);display:flex;gap:6px}
#formation-list{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:6px}
.f-chip{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px;cursor:pointer;position:relative}
.f-chip.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.f-chip canvas{display:block;width:100%;border-radius:4px;background:#f8fafc}
.f-chip .fc-name{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:12px}
.f-chip .fc-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-chip .fc-bar{color:var(--dim);font-size:11px}
.f-chip .fc-drag{cursor:grab;color:var(--dim)}

#stage-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage-tools{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;flex:none}
#stage-wrap{flex:1;position:relative;min-height:0;overflow:hidden;background:#0b1220}
#stage-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#countin-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:var(--acc);text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}

#right-panel{display:none;flex-direction:column;width:250px;border-left:1px solid var(--line);background:var(--bg2);flex:none;min-height:0}
.panel-tabs{display:flex;border-bottom:1px solid var(--line)}
.ptab{flex:1;background:none;border:0;padding:9px;color:var(--dim);border-bottom:2px solid transparent}
.ptab.active{color:var(--fg);border-bottom-color:var(--acc)}
.props-page{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.prop-group{border:1px solid var(--line);border-radius:var(--rad);padding:10px;display:flex;flex-direction:column;gap:8px}
.prop-group>.pg-title{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.prop-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.prop-row label{color:var(--dim);font-size:13px;flex:none}
.prop-row input[type=number]{width:70px}
.prop-row input[type=text]{width:100%}
.prop-row input[type=color]{padding:0;width:34px;height:26px}
textarea.note{width:100%;min-height:54px;resize:vertical;background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px}

/* ---- 底部播放条/时间线 ---- */
#bottom-area{border-top:1px solid var(--line);background:var(--bg2);flex:none}
#playbar{height:var(--pb-h);display:flex;align-items:center;gap:8px;padding:0 10px}
#pb-pos{min-width:52px;text-align:center}
#timeline-area{border-top:1px solid var(--line)}
.es-chip{flex:none;width:86px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px;cursor:pointer;position:relative}
.es-chip.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.es-chip canvas{display:block;width:100%;border-radius:4px;background:#f8fafc}
.es-chip .es-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
#block-ctl{display:flex;align-items:center;gap:10px;padding:4px 10px;border-bottom:1px dashed var(--bg3);flex-wrap:wrap}
#block-ctl .bc-label{font-size:12px;color:var(--acc);font-weight:600}
#block-ctl .bc-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#block-ctl .bc-val{min-width:70px;text-align:center;display:inline-block;background:var(--bg3);border-radius:6px;padding:2px 6px}
#block-ctl .btn.step{padding:0 9px;line-height:20px;font-size:14px}
#music-strip{display:flex;flex-direction:column}
#audio-disc{border-bottom:1px solid var(--line)}
#audio-disc summary{cursor:pointer;list-style:none;padding:6px 10px;color:var(--dim);font-size:12px;user-select:none}
#audio-disc summary::-webkit-details-marker{display:none}
#audio-disc summary::before{content:'▸ ';}
#audio-disc[open] summary::before{content:'▾ ';}
#audio-panel{display:flex;align-items:center;gap:8px;padding:7px 10px;flex-wrap:wrap}
#tl-scroll{overflow-x:auto;height:150px;position:relative}
#tl-inner{position:relative;height:100%}
#tl-canvas,#tl-overlay{position:absolute;top:0;left:0;height:100%}
#tl-overlay{pointer-events:none}

/* ---- 移动端队形索引条 ---- */
#formation-index{display:none}
@media (max-width:1023.5px){
  #formation-index{display:flex;gap:4px;overflow-x:auto;padding:4px 6px;border-bottom:1px dashed var(--bg3);scrollbar-width:none}
  #formation-index::-webkit-scrollbar{display:none}
  .fi-chip{flex:none;width:66px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;display:flex;flex-direction:column}
  .fi-chip canvas{display:block;width:100%;border-radius:4px;background:#f8fafc}
  .fi-label{font-size:10px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .fi-chip.active{border-color:var(--acc);background:var(--bg3)}
  .fi-chip.active .fi-label{color:var(--acc)}
}
body[data-mtab="formations"] #formation-index{display:none}
/* 移动端工具收纳：次级工具默认隐藏，点 ⋯ 展开 */
@media (max-width:1023.5px){
  #stage-tools{flex-wrap:nowrap;overflow-x:auto}
}

/* ---- 移动端 Tab ---- */
#mobile-tabs{display:flex;border-top:1px solid var(--line);background:var(--bg2);flex:none}
#mobile-tabs button{flex:1;background:none;border:0;padding:11px 0;color:var(--dim);font-size:13px}
#mobile-tabs button.active{color:var(--acc);font-weight:600}
body[data-mtab="formations"] #left-panel,
body[data-mtab="more"] #right-panel{display:flex;position:absolute;inset:var(--tb-h) 0 0 0;z-index:40;background:var(--bg);width:auto}
body[data-mtab="formations"] #tl-scroll{display:none}

/* ---- 桌面 ---- */
@media (min-width:1024px){
  #mobile-tabs{display:none}
  #left-panel,#right-panel{display:flex !important;position:static;width:180px}
  #right-panel{width:250px}
  #left-panel{width:180px}
  #stage-tools{flex-wrap:nowrap;overflow-x:auto}
}

/* ---- 名册弹窗 ---- */
.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.66);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 12px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.roster-table{width:100%;border-collapse:collapse;font-size:13px}
.roster-table th{color:var(--dim);text-align:left;font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
.roster-table td{padding:3px 6px;border-bottom:1px solid var(--bg3)}
.roster-table input[type=text]{width:100%}
.roster-table select{padding:2px 4px}
.pair-row{display:flex;align-items:center;gap:6px;padding:4px 0}
.pair-row select{max-width:130px}

/* ---- Toast ---- */
#toasts{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--toast-bg);border:1px solid var(--line);border-radius:10px;padding:9px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:toast-in .18s ease-out}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- 移动端紧凑化 ---- */
@media (max-width:1023.5px){
  .hide-mobile{display:none !important}
}
@media (max-width:1023.5px){
  #topbar{gap:4px;padding:0 6px}
  .title-input{flex:1 1 40px;min-width:0;width:0;text-align:center;font-size:13px}
  .btn.small{padding:6px 10px} /* 触摸目标 */
  #playbar{gap:5px;padding:0 6px}
  #pb-formation{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stage-tools{gap:4px;padding:4px 6px;flex-wrap:nowrap;overflow-x:auto}
  .rot-ctl input[type=range]{width:64px}
  .lc-del{padding:8px}
  #tl-scroll{height:120px}
}

/* ---- 打印页 ---- */
@media print{
  body>*{display:none !important}
}
.print-page{page-break-after:always;text-align:center}
.print-page img{max-width:100%}
.print-page h2{margin:6px 0}
.print-page .p-meta{color:#334155;font-size:13px;margin-bottom:8px;white-space:pre-line}

/* ---- 单元浮窗（合并确认/单元操作） ---- */
.unit-menu{position:absolute;z-index:50;background:var(--bg2);border:1px solid var(--acc);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:150px}
.unit-menu .um-title{font-size:12px;color:var(--dim);font-weight:600}
.unit-menu .um-row{display:flex;gap:4px}
.unit-menu .um-btn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--fg);white-space:nowrap}
.unit-menu .um-btn:hover{border-color:var(--acc);color:var(--acc)}
.unit-menu .um-btn.um-cur{border-color:var(--acc);color:var(--acc);font-weight:600}
.unit-menu .um-btn.um-cancel{border-color:var(--line);color:var(--dim)}

</style>
</head>
<body>
<div id="app">

  <!-- ===== 项目库视图 ===== -->
  <section id="library-view" class="view" hidden>
    <header class="lib-header">
      <div class="lib-brand">舞阵 <span class="lib-sub">WuZhen · 队形编排</span></div>
      <button id="btn-new-project" class="btn primary">＋ 新建项目</button>
    </header>
    <div id="library-grid" class="lib-grid"></div>
    <div id="library-empty" class="lib-empty" hidden>
      <div class="lib-empty-icon">💃</div>
      <p>还没有项目，点击右上角「新建项目」开始编排队形</p>
    </div>
  </section>

  <!-- ===== 编辑器视图 ===== -->
  <section id="editor-view" class="view" hidden>
    <header id="topbar">
      <button id="btn-back" class="btn ghost" title="返回项目库">‹ 项目库</button>
      <input id="proj-title" class="title-input" spellcheck="false" title="项目名称">
      <span class="spacer"></span>
      <button id="btn-theme" class="btn ghost" title="切换深色/浅色主题">🌙</button>
      <button id="btn-roster" class="btn ghost" title="舞者与舞伴名单">名册</button>
      <button id="btn-undo" class="btn ghost" title="撤销 (Ctrl+Z)">↺</button>
      <button id="btn-redo" class="btn ghost" title="重做 (Ctrl+Shift+Z)">↻</button>
      <div class="dropdown" id="export-dd">
        <button id="btn-export" class="btn ghost">导出 ▾</button>
        <div class="dd-menu" hidden>
          <button id="exp-png">当前队形 PNG</button>
          <button id="exp-print">打印 / PDF（全部队形）</button>
          <button id="exp-json-audio">项目文件 · 含音乐 (.formation.json)</button>
          <button id="exp-json">项目文件 · 不含音乐 (.formation.json)</button>
          <button id="imp-json">导入项目文件…</button>
        </div>
      </div>
    </header>

    <div id="editor-main">
      <!-- 左：队形列表 -->
      <aside id="left-panel">
        <div class="panel-head">队形 <span id="formation-count" class="dim"></span></div>
        <div id="formation-list"></div>
        <div class="panel-foot">
          <button id="btn-add-formation" class="btn primary small">＋ 新队形</button>
          <button id="btn-del-formation" class="btn small">删除</button>
        </div>
      </aside>

      <!-- 中：舞台 -->
      <div id="stage-col">
        <div id="stage-tools">
          <button id="btn-edit-mode" class="btn small toggled-on" title="开启：舞台可拖动编辑；关闭：查看模式（舞台随时间轴播放头联动）">✏ 编辑</button>
          <button id="btn-combined" class="btn small toggled-on" title="当前队形的舞对呈示：组队=菱形单元；拆开=两人独立圆点。帧间切换时自动产生拆队/组队过渡动画">⛓ 组队</button>
          <span class="vsep"></span>
          <select id="gen-kind" title="队形生成器">
            <option value="">生成队形…</option>
            <option value="rows">多横排</option>
            <option value="line">一字横排</option>
            <option value="columns">纵列</option>
            <option value="circle">圆形</option>
            <option value="arc">弧形</option>
            <option value="v">V 形</option>
            <option value="diagonal">斜线</option>
            <option value="diamond">菱形</option>
          </select>
          <select id="gen-unit" title="编队粒度">
            <option value="pair">以舞对为单位</option>
            <option value="dancer">以单人（拆对）</option>
            <option value="men">仅男士</option>
            <option value="women">仅女士</option>
          </select>
          <span class="vsep"></span>
          <button id="btn-mirror-h" class="btn small ghost" title="水平镜像">⇋</button>
          <button id="btn-mirror-v" class="btn small ghost" title="垂直镜像">⇅</button>
          <label class="rot-ctl" title="整体旋转">⟳<input id="rot-slider" type="range" min="-180" max="180" value="0"><span id="rot-val">0°</span></label>
          <button id="btn-distribute" class="btn small ghost" title="所选舞者等间距(竖排间距)">均布</button>
          <button id="btn-swap" class="btn small ghost" title="两人换位（需选中2人）">换位</button>
          <span class="vsep"></span>
          <button id="btn-pair-create" class="btn small ghost" title="将所选两名舞者组成舞伴（需选中2人）">⛓ 组对</button>
          <button id="btn-pair-split" class="btn small ghost" title="拆开所选舞者的舞伴绑定">✂ 拆对</button>
          <span class="vsep"></span>
          <select id="face-target" title="统一朝向">
            <option value="">朝向…</option>
            <option value="audience">面向观众</option>
            <option value="center">面向圆心</option>
            <option value="partner">面向舞伴</option>
          </select>
          <span class="spacer"></span>
          <button id="btn-ghost" class="btn small ghost toggled-on" title="显示前后队形 Ghost">幽灵</button>
          <button id="btn-paths" class="btn small ghost toggled-on" title="显示移动路径">路径</button>
          <button id="btn-switch-anim" class="btn small ghost toggled-on" title="切换队形帧时播放约0.7秒的快速过渡动画（纯界面效果，与时间轴时长无关）">切帧预览</button>
          <button id="btn-fit" class="btn small ghost" title="视图复位">⤢</button>
        </div>
        <div id="formation-index"></div>
        <div id="stage-wrap">
          <canvas id="stage-canvas"></canvas>
          <div id="countin-overlay" hidden></div>
        </div>
      </div>

      <!-- 右：属性 -->
      <aside id="right-panel">
        <div class="panel-tabs">
          <button class="ptab active" data-tab="formation">队形</button>
          <button class="ptab" data-tab="stage">舞台</button>
          <button class="ptab" data-tab="style">样式</button>
        </div>
        <div id="props-formation" class="props-page"></div>
        <div id="props-stage" class="props-page" hidden></div>
        <div id="props-style" class="props-page" hidden></div>
      </aside>
    </div>

    <!-- 底部：播放条 + 时间线 -->
    <div id="bottom-area">
      <div id="playbar">
        <button id="pb-prev" class="btn ghost" title="上一队形">⏮</button>
        <button id="pb-play" class="btn primary round" title="播放/暂停（空格）">▶</button>
        <button id="pb-stop" class="btn ghost round" title="停止">⏹</button>

    p.formations.forEach((f, i) => {
      const chip = document.createElement('div');
      chip.className = 'es-chip' + (i === this.hooks.getIndex() ? ' active' : '');
      chip.draggable = true;
      const cv = document.createElement('canvas');
      cv.width = 120; cv.height = 68;
      const nm = document.createElement('div');
      nm.className = 'es-name';
      nm.textContent = `${i + 1}. ${f.name}`;
      nm.title = f.name;
      chip.append(cv, nm);
      chip.addEventListener('click', () => this.hooks.select(i));
      chip.addEventListener('dragstart', e => { this._dragFrom = i; e.dataTransfer.effectAllowed = 'move'; });
      chip.addEventListener('dragover', e => { e.preventDefault(); });
      chip.addEventListener('drop', e => { e.preventDefault(); if (this._dragFrom != null && this._dragFrom !== i) this.hooks.move(this._dragFrom, i); this._dragFrom = null; });
      this.el.append(chip);
    });
    const add = document.createElement('button');
    add.className = 'btn small'; add.textContent = '＋';
    add.title = '新队形（复制当前）';
    add.addEventListener('click', () => this.hooks.add());
    this.el.append(add);
    this.drawThumbs();
  }
  drawThumbs() {
    const p = this.hooks.getProject();
    if (!p) return;
    [...this.el.querySelectorAll('.es-chip')].forEach((chip, i) => {
      const f = p.formations[i];
      const cv = chip.querySelector('canvas');
      const ctx = cv.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      if (cv.width !== 120 * dpr) { cv.width = 120 * dpr; cv.height = 68 * dpr; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (f) drawScene(ctx, { x: 0, y: 0, w: 120, h: 68 }, p, f.positions, { minimal: true, pad: 4, pairLines: false });
    });
  }
}

// ---------- 音乐模式：波形时间线 ----------
class MusicTimeline {
  constructor({ canvas, overlay, scroll, hooks }) {
    this.cv = canvas; this.ov = overlay; this.scroll = scroll;
    this.hooks = hooks; // {getProject(), getPlayer(), onSelectFormation(i), mutate(fn,label), seekBeat(b), audio}
    this.secPerPx = 0;  // 0 = 自适应
    this.drag = null;
    this._bind();
  }
  pxPerSec() { return this.secPerPx ? 1 / this.secPerPx : 0; }
  layoutWidth(p) {
    const { totalBeats } = computeSegments(p);
    const totalSec = beatToSec(p, totalBeats) || 10;
    const w0 = this.scroll.clientWidth || 600;
    return Math.max(w0, this.secPerPx ? totalSec / this.secPerPx : totalSec * Math.max(8, w0 / Math.max(totalSec, 30)));
  }
  render() {
    const p = this.hooks.getProject();
    if (!p) return;
    const dpr = window.devicePixelRatio || 1;
    const h = this.scroll.clientHeight || 120;
    const W = this.layoutWidth(p);
    for (const c of [this.cv, this.ov]) {
      c.width = Math.round(W * dpr); c.height = Math.round(h * dpr);
      c.style.width = W + 'px'; c.style.height = h + 'px';
    }
    this.W = W; this.H = h;
    const ctx = this.cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, h);
    this.drawRuler(ctx, p, h);
    this.drawWave(ctx, p, h);
    this.drawBlocks(ctx, p, h);
    this.drawPlayhead();
  }

  drawRuler(ctx, p, h) {
    const pps = this.ppsOf(p);
    const rulerH = 22;
    ctx.save();
    ctx.fillStyle = '#131c31';
    ctx.fillRect(0, 0, this.W, rulerH);
    ctx.strokeStyle = '#243049'; ctx.fillStyle = '#8ea2bd';
    ctx.font = '10px sans-serif'; ctx.textBaseline = 'middle';
    const bpb = p.audio.beatsPerBar || 4;
    const spbV = spb(p);
    const pxPerBar = bpb * spbV * pps;
    const barStep = pxPerBar < 26 ? 8 : pxPerBar < 60 ? 4 : 1;
    const { totalBeats } = computeSegments(p);
    const totalBars = Math.ceil(beatToSec(p, totalBeats) / spbV / bpb) + 2;
    ctx.beginPath();
    for (let bar = 0; bar <= totalBars; bar += barStep) {
      const x = beatToSec(p, bar * bpb) * pps;
      ctx.moveTo(x, rulerH - 8); ctx.lineTo(x, h);
      if (pxPerBar * barStep > 30) ctx.fillText(String(bar + 1), x + 3, rulerH / 2);
    }
    // 8拍刻度（舞蹈计数）
    const pxPer8 = 8 * spbV * pps;
    if (pxPer8 > 44) {
      ctx.strokeStyle = 'rgba(56,189,248,.35)';
      ctx.beginPath();
      for (let c8 = 0; ; c8++) {
        const x = beatToSec(p, c8 * 8) * pps;
        if (x > this.W) break;
        ctx.moveTo(x, rulerH); ctx.lineTo(x, h);
        if (pxPer8 > 70) ctx.fillText(`${c8 + 1}个8拍`, x + 3, h - 8);
      }
      ctx.stroke();
    }
    ctx.stroke();
    ctx.restore();
    this.rulerH = rulerH;
  }
  drawWave(ctx, p, h) {
    const audio = this.hooks.audio;
    const pps = this.ppsOf(p);
    if (!audio?.peaks) {
      if (audio?.ready) { // 无波形：画时长条
        ctx.save();
        ctx.fillStyle = 'rgba(56,189,248,.15)';
        ctx.fillRect(0, this.rulerH, (audio.duration || 0) * pps, h - this.rulerH);
        ctx.restore();
      }
      return;
    }
    const peaks = audio.peaks;
    const mid = this.rulerH + (h - this.rulerH) * 0.42;
    const amp = (h - this.rulerH) * 0.34;
    ctx.save();
    ctx.fillStyle = 'rgba(56,189,248,.5)';
    const step = Math.max(1, Math.floor(this.W / 2000)); // 大宽度下抽稀绘制
    for (let x = 0; x < this.W; x += step) {
      const sec = x / pps;
      const i = Math.floor(sec / (audio.duration || 1) * peaks.length);
      const v = peaks[Math.max(0, Math.min(peaks.length - 1, i))] || 0;
      ctx.fillRect(x, mid - v * amp, step, Math.max(1, v * amp * 2));
    }
    ctx.restore();
  }
  drawBlocks(ctx, p, h) {
    const { segments } = computeSegments(p);
    const pps = this.ppsOf(p);
    const spbV = spb(p);
    const top = h - 44, bh = 36;
    const selIdx = this.hooks.getIndex();
    ctx.save();
    ctx.font = '10px sans-serif'; ctx.textBaseline = 'middle';
    for (const s of segments) {
      const f = p.formations[s.i];
      if (!f) continue;
      const x0 = beatToSec(p, s.holdStart) * pps;
      const x1 = beatToSec(p, s.holdEnd) * pps;
      const selected = s.i === selIdx;
      const hovered = this.hoverSeg === s.i;
      const holdSec = ((s.holdEnd - s.holdStart) * spbV).toFixed(1).replace(/\.0$/, '');
      // 保持块
      ctx.fillStyle = (f.color || '#64748b') + (hovered ? '77' : '55');
      ctx.fillRect(x0, top, Math.max(2, x1 - x0), bh);
      ctx.lineWidth = selected ? 2 : 1;
      ctx.strokeStyle = selected ? '#38bdf8' : (f.color || '#64748b');
      ctx.strokeRect(x0, top, x1 - x0, bh);
      if (x1 - x0 > 34) {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(f.name.slice(0, Math.floor((x1 - x0) / 7)), x0 + 4, top + 9);
      }
      // 保持时长徽标（拍 + 秒）
      if (x1 - x0 > 40) {
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(`${Math.round(s.holdEnd - s.holdStart)}拍·${holdSec}s`, x0 + 4, top + bh - 9);
        ctx.font = '10px sans-serif';
      } else if (x1 - x0 > 8) {
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.fillText(`${Math.round(s.holdEnd - s.holdStart)}`, x0 + 2, top + bh - 9);
      }
      // 过渡块
      if (s.hasTravel) {
        const tx1 = beatToSec(p, s.travelEnd) * pps;
        const tw = Math.max(1, tx1 - x1);
        ctx.fillStyle = hovered ? 'rgba(56,189,248,.30)' : 'rgba(148,163,184,.25)';
        ctx.fillRect(x1, top, tw, bh);
        ctx.strokeStyle = 'rgba(148,163,184,.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x1, top, tw, bh);
        // 斜线纹理
        if (tw > 6 && bh > 10) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(x1, top, tw, bh); ctx.clip();
          ctx.strokeStyle = 'rgba(148,163,184,.28)';
          for (let gx = x1 - bh; gx < x1 + tw; gx += 7) {
            ctx.moveTo(gx, top + bh); ctx.lineTo(gx + bh, top);
          }
          ctx.stroke();
          ctx.restore();
        }
        const travelBeats = Math.round((s.travelEnd - s.holdEnd) * 10) / 10;
        const travelSec = ((s.travelEnd - s.holdEnd) * spbV).toFixed(1).replace(/\.0$/, '');
        const label = `↷过渡${travelBeats}拍·${travelSec}s`;
        if (tw > label.length * 6 + 6) {
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText(label, x1 + 4, top + bh / 2);
        } else if (tw > 14) {
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText('↷' + travelBeats + '拍', x1 + 3, top + bh / 2);
        } else {
          // 太窄：标到块右侧外
          ctx.fillStyle = '#8ea2bd';
          ctx.fillText('↷' + travelBeats + '拍', tx1 + 3, top + bh / 2);
        }
        // 边缘把手（选中块或悬停时显示）
        if (selected || hovered) {
          this._drawGrip(ctx, x1, top, bh, 'hold');
          this._drawGrip(ctx, tx1, top, bh, 'travel');
        }
      }
      // 悬停高亮描边
      if (hovered && !selected) {
        ctx.strokeStyle = 'rgba(56,189,248,.8)';
        ctx.lineWidth = 1.5;
        const hx1 = s.hasTravel ? beatToSec(p, s.travelEnd) * pps : x1;
        ctx.strokeRect(x0, top, hx1 - x0, bh);
      }
    }
    ctx.restore();
    this.blocksTop = top; this.blocksH = bh;
  }
  _drawGrip(ctx, x, top, bh, kind) {
    ctx.save();
    ctx.fillStyle = kind === 'hold' ? '#38bdf8' : '#a78bfa';
    ctx.fillRect(x - 2, top - 2, 4, bh + 4);
    // 把手抓点
    ctx.fillRect(x - 5, top + bh / 2 - 7, 10, 14);
    ctx.restore();
  }
  drawPlayhead() {
    const p = this.hooks.getProject();
    if (!p) return;
    const dpr = window.devicePixelRatio || 1;
    const ctx = this.ov.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, this.W, this.H);
    const player = this.hooks.getPlayer();
    const pps = this.ppsOf(p);
    const x = beatToSec(p, Math.max(0, player.beat)) * pps;
    ctx.save();
    ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.H); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 5, 0); ctx.lineTo(x + 5, 0); ctx.lineTo(x, 8); ctx.closePath();
    ctx.fillStyle = '#f43f5e'; ctx.fill();
    ctx.restore();
  }
  ppsOf(p) {
    if (this.secPerPx) return 1 / this.secPerPx;
    const { totalBeats } = computeSegments(p);
    const totalSec = Math.max(beatToSec(p, totalBeats), 5);
    return this.W / (totalSec + 1);
  }
  secToX(sec) { return sec * this.ppsOf(this.hooks.getProject()); }
  xToBeat(x) {
    const p = this.hooks.getProject();
    const sec = x / this.ppsOf(p);
    return secToBeat(p, sec);
  }
  zoom(factor) {
    const p = this.hooks.getProject();
    const cur = this.ppsOf(p);
    const { totalBeats } = computeSegments(p);
    const totalSec = Math.max(beatToSec(p, totalBeats), 1);
    const maxPps = 4096 / totalSec; // 画布宽度上限，防止超出浏览器 canvas 尺寸限制
    this.secPerPx = 1 / Math.min(Math.max(cur * factor, 0.5), maxPps);
    this.render();
  }
  zoomFit() { this.secPerPx = 0; this.render(); }

  _bind() {
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => this._down(e));
    cv.addEventListener('pointermove', e => this._move(e));
    window.addEventListener('pointerup', e => this._up(e), { passive: true });
    this.scroll.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        this.zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2);
      }
    }, { passive: false });
  }
  edgeHits(x) {
    const p = this.hooks.getProject();
    const { segments } = computeSegments(p);
    const pps = this.ppsOf(p);
    const tol = 10;
    const hits = [];
    for (const s of segments) {
      const hx = beatToSec(p, s.holdEnd) * pps;
      const tx = beatToSec(p, s.travelEnd) * pps;
      if (s.hasTravel && Math.abs(x - hx) < tol) hits.push({ kind: 'hold', seg: s });
      if (s.hasTravel && Math.abs(x - tx) < tol) hits.push({ kind: 'travel', seg: s });
    }
    return hits;
  }
  _down(e) {
    const p = this.hooks.getProject();
    if (!p) return;
    const r = this.cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const edges = this.edgeHits(x);
    if (edges.length && y > this.rulerH) {
      try { this.cv.setPointerCapture(e.pointerId); } catch {}
      this.drag = { ...edges[0], startX: x };
      return;
    }
    if (y <= this.rulerH) {
      // 尺规：点击/拖动定位
      try { this.cv.setPointerCapture(e.pointerId); } catch {}
      this.drag = { kind: 'scrub' };
      this.hooks.seekBeat(this.xToBeat(x));
      return;
    }
    if (y >= this.blocksTop && y <= this.blocksTop + this.blocksH) {
      const { segments } = computeSegments(p);
      const beat = this.xToBeat(x);
      for (const s of segments) {
        if (beat >= s.holdStart && beat < s.travelEnd) { this.hooks.onSelectFormation(s.i); return; }
      }
    }
  }
  _move(e) {
    const drag = this.drag;
    if (!drag) {
      // 悬停反馈：边缘光标 + 块高亮
      const r = this.cv.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const edges = this.edgeHits(x);
      this.cv.style.cursor = edges.length ? 'ew-resize' : 'default';
      let hoverSeg = null;
      for (const hit of edges) hoverSeg = hit.seg.i;
      if (hoverSeg === null && y >= (this.blocksTop ?? 0) && y <= (this.blocksTop ?? 0) + (this.blocksH ?? 0)) {
        const p = this.hooks.getProject();
        if (p) {
          const beat = this.xToBeat(x);
          for (const s of computeSegments(p).segments) {
            if (beat >= s.holdStart && beat < s.travelEnd) { hoverSeg = s.i; break; }
          }
        }
      }
      if (this.hoverSeg !== hoverSeg) { this.hoverSeg = hoverSeg; this.render(); }
      return;
    }
    const p = this.hooks.getProject();
    const r = this.cv.getBoundingClientRect();
    const x = e.clientX - r.left;
    const spbV = spb(p);
    const minBeats = 0.5;
    if (drag.kind === 'scrub') {
      this.hooks.seekBeat(this.xToBeat(x));
      return;
    }
    let beat = this.xToBeat(x);
    // 吸附到整拍
    beat = Math.round(beat);
    this.hooks.mutate(proj => {
      const blk = proj.timeline.blocks[drag.seg.i];
      const next = proj.timeline.blocks[drag.seg.i + 1];
      if (drag.kind === 'hold') {
        const newHold = Math.max(minBeats, beat - drag.seg.holdStart);
        if (this.hooks.ripple()) {
          blk.holdBeats = newHold;
        } else {
          const d = newHold - (drag.seg.holdEnd - drag.seg.holdStart);
          blk.holdBeats = newHold;
          blk.travelBeats = Math.max(0, blk.travelBeats - d); // 压缩自身过渡，后续块不动
        }
      } else if (drag.kind === 'travel' && next) {
        blk.travelBeats = Math.max(minBeats, beat - drag.seg.holdEnd);
      }
    });
    // 更新缓存的 seg 边界，避免累积误差
    const { segments } = computeSegments(p);
    drag.seg = segments[drag.seg.i];
  }
  _up() {
    if (this.drag && (this.drag.kind === 'hold' || this.drag.kind === 'travel')) {
      this.hooks.commitEdit?.('调整时长');
    }
    this.drag = null;
  }
}

async function shareOrDownload(blob, filename) {
  try {
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });

    rd.onload = () => resolve(String(rd.result).split(',')[1] || '');

  const bin = atob(b64);

  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

function centroid(positions, ids) {
  let x = 0, y = 0, n = 0;
  for (const id of ids) { const p = positions[id]; if (p) { x += p.x; y += p.y; n++; } }
  return n ? { x: x / n, y: y / n } : { x: 0, y: 0 };
}
function applyGenerator(kind) {
  const s = store.getState();
  const unit = $('gen-unit').value;
  const rows = Number($('gen-rows')?.value) || undefined;
  store.mutate(p => {
    const f = p.formations[s.formationIndex];
    let ids;
    if (unit === 'men') ids = p.dancers.filter(d => d.role === 'M').map(d => d.id);
    else if (unit === 'women') ids = p.dancers.filter(d => d.role === 'F').map(d => d.id);
    else ids = M.orderedDancers(p, unit);
    const slots = shapes.genSlots(kind, ids.length, p.stage, { rows, unit });
    shapes.applySlots(f, ids, slots, { current: f.positions });
    M.applyFormationLayout(p, s.formationIndex); // 顺延缺席舞者 + 按组队/拆开呈示收拢或拆开
  }, `生成队形(${kind})`);
}

// ---------- 播放条 ----------
function wirePlaybar() {
  $('pb-play').addEventListener('click', () => togglePlay());
  $('pb-stop').addEventListener('click', () => { player.stop(); store.setUI({}); });
  $('pb-prev').addEventListener('click', () => stepFormation(-1));
  $('pb-next').addEventListener('click', () => stepFormation(1));
  $('pb-speed').addEventListener('change', () => player.setSpeed(+$('pb-speed').value));
  $('pb-loop').addEventListener('change', () => updateLoop());
  $('pb-metro').addEventListener('change', () => store.mutate(p => { p.timeline.metronome = $('pb-metro').checked; }, null));
}
function updateLoop() {
  const on = $('pb-loop').checked;
  const s = store.getState();
  const { segments } = M.computeSegments(s.project);
  const seg = segments[s.formationIndex];
  player.setLoop(!!(on && seg), seg ? seg.holdStart : 0, seg ? seg.travelEnd : 0);
  if (on && seg && player.beat < seg.holdStart) player.seekBeat(seg.holdStart);
}
function togglePlay() {
  if (player.playing) { player.pause(); return; }
  const s = store.getState();
  const { segments } = M.computeSegments(s.project);
  const seg = segments[s.formationIndex];
  if (player.beat > 0.001 && !playerAtEnd()) {
    player.play(null, { countIn: false }); // 暂停后续播
  } else if (audio.ready) {
    player.play(seg ? seg.holdStart : 0); // 有音乐：按音乐时钟从当前队形播
  } else {
    // 无音乐：虚拟时钟，预览当前队形的保持+过渡
    player.play(seg ? seg.holdStart : 0, { previewStop: seg && seg.hasTravel ? seg.travelEnd : (seg ? seg.holdEnd : 0), countIn: false, forceVirtual: true });
  }
  updateLoop();
}
function playerAtEnd() {
  const { totalBeats } = M.computeSegments(store.getState().project);
  return player.beat >= totalBeats - 0.001;
}
function stepFormation(d) {
  const s = store.getState();
  const ni = Math.max(0, Math.min(s.formationIndex + d, s.project.formations.length - 1));
  switchFormation(ni);
  if (player.beat > 0.001 && !player.playing) player.seekFormation(ni);
  if ($('pb-loop').checked) updateLoop(); // 循环区间跟随队形切换
}

let tapTimes = [];
function wireAudioPanel() {
  audioPanelBuilt = true;
  // 移动端默认收起音乐设置面板，节省纵向空间
  if (window.matchMedia('(max-width: 1023.5px)').matches) $('audio-disc').open = false;

  });
  $('bpm-input').addEventListener('change', () => store.mutate(p => { p.audio.bpm = Math.max(30, Math.min(300, +$('bpm-input').value || 120)); }, null));
  $('btn-tap').addEventListener('click', () => {
    const now = performance.now();
    if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2500) tapTimes = [];
    tapTimes.push(now);
    if (tapTimes.length >= 3) {
      const win = tapTimes.slice(-8);
      const ivals = [];
      for (let i = 1; i < win.length; i++) ivals.push(win[i] - win[i - 1]);
      const avg = ivals.reduce((a, b) => a + b, 0) / ivals.length;
      const bpm = Math.round(60000 / avg);
      $('bpm-input').value = bpm;
      store.mutate(p => { p.audio.bpm = bpm; }, null);
    }
    if (tapTimes.length > 10) tapTimes = tapTimes.slice(-8);
  });
  $('offset-input').addEventListener('change', () => store.mutate(p => { p.audio.firstBeatSec = Math.max(0, +$('offset-input').value || 0); }, null));
  $('btn-offset-test').addEventListener('click', () => {
    if (!audio.ready) { toast('请先载入音乐'); return; }
    player.pause();
    const p = store.getState().project;
    const from = Math.max(0, (p.audio.firstBeatSec || 0) - 2);
    audio.play(from, 1);
    setTimeout(() => { if (!player.playing) audio.pause(); }, 4500);
  });
  $('bpb-select').addEventListener('change', () => store.mutate(p => { p.audio.beatsPerBar = +$('bpb-select').value; }, null));
  $('countin-input').addEventListener('change', () => store.mutate(p => { p.timeline.countInBeats = Math.max(0, Math.min(32, +$('countin-input').value || 0)); }, null));
  // 把当前队形块的起点对齐到播放头时间戳（调整前一段过渡时长）
  $('btn-align-playhead').addEventListener('click', () => {
    const s = store.getState();
    if (s.formationIndex === 0) { toast('第一个队形从 0 拍开始，无需对齐'); return; }
    const target = player.beat;
    store.mutate(p => { M.alignBlockStart(p, s.formationIndex, target); }, '对齐到播放头');
    const actual = M.computeSegments(s.project).segments[s.formationIndex].holdStart;
    if (Math.abs(actual - target) > 0.5) {
      toast(`目标不可达：起点已尽量前移到 ${M.beatLabel(s.project, actual)}（${actual.toFixed(1)} 拍）`);
    } else {
      toast(`队形 ${s.formationIndex + 1} 起点已对齐到 ${M.beatLabel(s.project, actual)}（${actual.toFixed(1)} 拍）`);
    }
  });
  $('ripple-check').addEventListener('change', () => store.setUI({ ripple: $('ripple-check').checked }));
  // 块时长快捷步进（±1拍，钳制 0.5–999）
  const stepBlock = (key, delta) => {
    const s = store.getState();
    if (key === 'travelBeats' && s.formationIndex >= s.project.formations.length - 1) return;
    store.mutate(p => {
      const b = p.timeline.blocks[s.formationIndex];
      if (!b) return;
      b[key] = Math.max(0.5, Math.min(999, (b[key] || 0) + delta));
    }, key === 'holdBeats' ? '调整保持时长' : '调整过渡时长');
  };
  $('bc-hold-minus').addEventListener('click', () => stepBlock('holdBeats', -1));
  $('bc-hold-plus').addEventListener('click', () => stepBlock('holdBeats', 1));
  $('bc-travel-minus').addEventListener('click', () => stepBlock('travelBeats', -1));
  $('bc-travel-plus').addEventListener('click', () => stepBlock('travelBeats', 1));
  $('tl-zoom-in').addEventListener('click', () => musicTl.zoom(1.3));
  $('tl-zoom-out').addEventListener('click', () => musicTl.zoom(1 / 1.3));
  $('tl-zoom-fit').addEventListener('click', () => musicTl.zoomFit());
  window.addEventListener('resize', () => { stageView?.requestDraw(); musicTl?.render(); });
}

    const dur = audio.duration;
    store.mutate(p => { p.audio.name = file.name; p.audio.durationSec = dur; }, '载入音乐');
    await store.storage.putAudio(store.getState().projectId, file);
    toast(`音乐已载入：${file.name}`);
  } catch (e) {
    toast('音乐载入失败：' + e.message);
  }
}

      h('div', { class: 'prop-row' },
        h('button', { class: 'btn small', onclick: () => moveFormationRel(-1), disabled: s.formationIndex === 0 }, '↑ 上移'),
        h('button', { class: 'btn small', onclick: () => moveFormationRel(1), disabled: s.formationIndex === s.project.formations.length - 1 }, '↓ 下移')),
      h('div', { class: 'prop-row' }, h('label', {}, '备注'), ),
      h('textarea', { class: 'note', placeholder: '这一段的动作要点…', onchange: e => store.mutate(p => { p.formations[s.formationIndex].note = e.target.value; }, '队形备注') }, f.note || '')),
    selectionProps(f, s));
  // 舞台页
  const st = s.project.stage;
  const sp = $('props-stage');
  sp.innerHTML = '';
  sp.append(
    h('div', { class: 'prop-group' },
      h('div', { class: 'pg-title' }, '舞台尺寸（米）'),
      h('div', { class: 'prop-row' }, h('label', {}, '宽'), h('input', { type: 'number', min: '4', max: '50', step: '0.5', value: st.widthM, onchange: e => stageChange('widthM', e.target.value) })),
      h('div', { class: 'prop-row' }, h('label', {}, '深'), h('input', { type: 'number', min: '4', max: '50', step: '0.5', value: st.depthM, onchange: e => stageChange('depthM', e.target.value) })),
      h('div', { class: 'prop-row' }, h('label', {}, '后台区'), h('input', { type: 'number', min: '0', max: '10', step: '0.5', value: st.backstageM, onchange: e => stageChange('backstageM', e.target.value) })),
      h('div', { class: 'prop-row' }, h('label', {}, '观众方向'),
        h('select', { onchange: e => stageChange('audience', e.target.value) },
          ...['bottom', 'top', 'left', 'right'].map(v => h('option', { value: v, ...(st.audience === v ? { selected: true } : {}) }, { bottom: '下方', top: '上方', left: '左侧', right: '右侧' }[v]))))),
    h('div', { class: 'prop-group' },
      h('div', { class: 'pg-title' }, '网格'),
      h('div', { class: 'prop-row' }, h('label', {}, '网格间距'), h('input', { type: 'number', min: '0.1', max: '2', step: '0.1', value: st.gridM, onchange: e => stageChange('gridM', e.target.value) })),
      h('div', { class: 'prop-row' }, h('label', {}, '拖动吸附'), h('input', { type: 'checkbox', ...(st.snap ? { checked: true } : {}), onchange: e => stageChange('snap', e.target.checked) }))),
    h('div', { class: 'prop-group' },
      h('div', { class: 'pg-title' }, '背景图'),
      h('div', { class: 'prop-row' },
        h('button', { class: 'btn small', onclick: () => {
          const inp = h('input', { type: 'file', accept: 'image/*' });
          inp.addEventListener('change', () => {
            const file = inp.files[0]; if (!file) return;
            const rd = new FileReader();
            rd.onload = () => stageChange('bgImage', { src: rd.result });
            rd.readAsDataURL(file);
          });
          inp.click();
        } }, '上传背景…'),
        st.bgImage ? h('button', { class: 'btn small', onclick: () => stageChange('bgImage', null) }, '清除') : null)));
}
const STAGE_NUMERIC_KEYS = new Set(['widthM', 'depthM', 'backstageM', 'gridM']);
function stageChange(k, v) {
  // number input 的 value 是字符串：必须转数值，否则坐标拼接/钳制/网格全部损坏
  stageView.view = null; // 先复位视图，再触发重绘
  store.mutate(p => {
    p.stage[k] = STAGE_NUMERIC_KEYS.has(k) ? (Number(v) || p.stage[k]) : v;
  }, '舞台设置');
}
function moveFormationRel(d) {
  const s = store.getState();
  const to = s.formationIndex + d;
  if (to < 0 || to >= s.project.formations.length) return;
  store.mutate(p => { M.moveFormation(p, s.formationIndex, to); }, '调整队形顺序');
  store.setUI({ formationIndex: to, selection: [] });
}
function selectionProps(f, s) {
  const sel = s.selection;
  const group = h('div', { class: 'prop-group' });
  group.append(h('div', { class: 'pg-title' }, `选中 ${sel.length} 人`));
  if (!sel.length) {
    group.append(h('div', { class: 'dim' }, '点击/框选舞者进行编辑；舞对锁定时自动带上舞伴。'));
    return group;
  }
  for (const id of sel.slice(0, 8)) {
    const d = M.dancerById(s.project, id);
    const p = f.positions[id];
    if (!d || !p) continue;
    group.append(h('div', { class: 'prop-row' },
      h('label', { style: `color:${d.color};font-weight:600` }, `${d.short} ${d.name}`),
      h('span', { class: 'ctl' }, '朝向',
        h('input', { type: 'number', min: '0', max: '359', value: Math.round(p.facing), style: 'width:56px', onchange: e => store.mutate(pr => { const ff = pr.formations[s.formationIndex]; if (ff.positions[id]) ff.positions[id].facing = +e.target.value || 0; }, '调整朝向') }))));
  }
  if (sel.length > 8) group.append(h('div', { class: 'dim' }, `…等 ${sel.length} 人`));
  return group;
}

// ---------- 样式面板 ----------
let stylePanelBuilt = false;
const styleRefs = {};
function buildStylePanel() {
  if (stylePanelBuilt) return;
  stylePanelBuilt = true;
  const host = $('props-style');
  host.append(
    h('div', { class: 'prop-group' },
      h('div', { class: 'pg-title' }, '选中与把手'),
      h('div', { class: 'prop-row' }, h('label', {}, '朝向把手（选中单人时显示，拖动调整朝向）'),
        h('input', { type: 'checkbox', id: 'sty-facing', onchange: e => store.setUI({ showFacingHandle: e.target.checked }) }))),
    h('div', { class: 'prop-group' },
      h('div', { class: 'pg-title' }, '舞台显示'),
      h('div', { class: 'prop-row' }, h('label', {}, 'Ghost 虚影（前后队形）'),
        h('input', { type: 'checkbox', id: 'sty-ghost', onchange: e => store.setUI({ showGhost: e.target.checked }) })),
      h('div', { class: 'prop-row' }, h('label', {}, '移动路径（虚线）'),
        h('input', { type: 'checkbox', id: 'sty-paths', onchange: e => store.setUI({ showPaths: e.target.checked }) })),
      h('div', { class: 'prop-row' }, h('label', {}, '网格'),
        h('input', { type: 'checkbox', id: 'sty-grid', onchange: e => store.setUI({ showGrid: e.target.checked }) }))),
    h('div', { class: 'dim' }, '提示：以上均为显示样式，不影响队形数据。工具栏的「幽灵 / 路径」按钮与本面板同步。'));
  styleRefs.facing = $('sty-facing');
  styleRefs.ghost = $('sty-ghost');
  styleRefs.paths = $('sty-paths');
  styleRefs.grid = $('sty-grid');
}

// ---------- 快捷键 ----------
function wireKeyboard() {
  document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (store.getState().view !== 'editor') return;
    const s = store.getState();
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) store.redo(); else store.undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); store.redo(); return; }
    if (e.key === 'Escape') { store.setUI({ selection: [] }); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return; // 其余单键快捷键不与浏览器/系统修饰键冲突
    if (e.key.toLowerCase() === 'e') { store.setUI({ editMode: !s.editMode }); return; } // 编辑开关
    if (!s.editMode) return; // 查看模式下禁用编辑类快捷键
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (s.selection.length) {
        e.preventDefault();
        store.mutate(p => {
          const f = p.formations[s.formationIndex];
          for (const id of s.selection) delete f.positions[id];
        }, '移出队形');
        store.setUI({ selection: [] });
      }
      return;
    }
    if (e.key.toLowerCase() === 'd') { addFormation(); return; }
    if (e.key.toLowerCase() === 'g') { store.mutate(p => { p.stage.snap = !p.stage.snap; }, '切换吸附'); return; }
    if (e.key.toLowerCase() === 'f') {
      const ids = s.selection.length ? expandedSelection() : [...currentFormation().positions.keys()];
      store.mutate(p => {
        shapes.faceAll(p.formations[s.formationIndex].positions, ids, 'audience', { stage: p.stage, project: p });
      }, '面向观众');
      return;
    }
    if (e.key.startsWith('Arrow') && s.selection.length) {
      e.preventDefault();
      const step = e.shiftKey ? 1 : (s.project.stage.snap ? s.project.stage.gridM : 0.1);
      const dx = e.key === 'ArrowRight' ? step : e.key === 'ArrowLeft' ? -step : 0;
      const dy = e.key === 'ArrowDown' ? step : e.key === 'ArrowUp' ? -step : 0;
      const bs = s.project.stage.backstageM ?? 0;
      store.mutate(p => {
        const f = p.formations[s.formationIndex];
        for (const id of expandedSelection()) {
          const q = f.positions[id];
          if (q) {
            q.x = Math.min(p.stage.widthM + bs, Math.max(-bs, q.x + dx));
            q.y = Math.min(p.stage.depthM + bs, Math.max(-bs, q.y + dy));
          }
        }
      }, '微调位置');
    }
  });
}

// ---------- 移动端队形索引条 ----------
function fitThumbView(w, h, stage) {
  const b = { x0: -(stage.backstageM ?? 0), y0: -(stage.backstageM ?? 0), x1: stage.widthM + (stage.backstageM ?? 0), y1: stage.depthM + (stage.backstageM ?? 0) };
  const scale = Math.min((w - 8) / (b.x1 - b.x0), (h - 8) / (b.y1 - b.y0));
  return { scale, ox: (w - (b.x1 - b.x0) * scale) / 2 - b.x0 * scale, oy: (h - (b.y1 - b.y0) * scale) / 2 - b.y0 * scale };
}
let indexKey = '';
function renderFormationIndex(state) {
  const host = document.getElementById('formation-index');
  if (!host) return;
  const p = state.project;
  if (!p) { host.innerHTML = ''; return; }
  const key = p.formations.map(f => f.id).join(',') + '|' + state.formationIndex;
  if (key !== indexKey) {
    indexKey = key;
    host.innerHTML = '';
    p.formations.forEach((f, i) => {
      const chip = document.createElement('button');
      chip.className = 'fi-chip' + (i === state.formationIndex ? ' active' : '');
      chip.title = (i + 1) + ' ' + f.name;
      // 迷你缩略图（形状是最强的视觉记忆点）
      const cv = document.createElement('canvas');
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = 128 * dpr; cv.height = 72 * dpr;
      cv.style.width = '64px'; cv.style.height = '36px';
      drawScene(cv.getContext('2d'), { x: 0, y: 0, w: 128 * dpr, h: 72 * dpr }, p, f.positions, { minimal: true, pad: 4, pairLines: false, view: fitThumbView(128 * dpr, 72 * dpr, p.stage) });
      const label = document.createElement('span');
      label.className = 'fi-label';
      label.textContent = (i + 1) + ' ' + f.name;
      chip.append(cv, label);
      chip.addEventListener('click', () => switchFormation(i));
      host.append(chip);
    });
  }
  // 当前帧滚入可视区
  const active = host.children[state.formationIndex];
  if (active) {
    const hr = host.getBoundingClientRect();
    const ar = active.getBoundingClientRect();
    if (ar.left < hr.left || ar.right > hr.right) {
      host.scrollLeft += ar.left - (hr.left + hr.width / 2) + ar.width / 2;
    }
  }
}

// ---------- 总渲染 ----------
let audioVals = {};
function render(state) {
  const isLib = state.view === 'library';
  $('library-view').hidden = isLib ? false : true;
  $('editor-view').hidden = isLib ? true : false;
  if (isLib) { renderLibraryView(); return; }
  const p = state.project;
  if (!p) return;
  // 顶栏
  if (document.activeElement !== $('proj-title')) $('proj-title').value = p.meta.title;
  renderUndoButtons();
  // 工具按钮状态
  $('btn-edit-mode').classList.toggle('toggled-on', state.editMode);
  $('btn-ghost').classList.toggle('toggled-on', state.showGhost);
  $('btn-paths').classList.toggle('toggled-on', state.showPaths);
  $('btn-switch-anim').classList.toggle('toggled-on', state.previewOnSwitch);
  $('btn-theme').textContent = state.theme === 'light' ? '☀️' : '🌙';
  buildStylePanel();
  styleRefs.facing.checked = state.showFacingHandle;
  styleRefs.ghost.checked = state.showGhost;
  styleRefs.paths.checked = state.showPaths;
  styleRefs.grid.checked = state.showGrid;
  const curF = state.project?.formations[state.formationIndex];
  const combinedNow = curF ? curF.combined !== false : true;
  $('btn-combined').classList.toggle('toggled-on', combinedNow);
  $('btn-combined').textContent = combinedNow ? '⛓ 组队' : '⇱ 拆开';
  // 组对/拆对按钮可用性（按原始选择）
  $('btn-pair-create').disabled = state.selection.length !== 2;
  $('btn-pair-split').disabled = !state.selection.some(id => M.pairOf(p, id));
  $('formation-count').textContent = `${p.formations.length}`;
  renderFormationIndex(state);
  // 面板（统一时间线：编队条 + 波形时间线常驻）
  leftStrip.render();
  buildProps();
  musicTl.render();
  // 音频面板
  if (document.activeElement !== $('bpm-input')) $('bpm-input').value = Math.round(p.audio.bpm);
  if (document.activeElement !== $('offset-input')) $('offset-input').value = p.audio.firstBeatSec || 0;
  $('bpb-select').value = String(p.audio.beatsPerBar || 4);
  if (document.activeElement !== $('countin-input')) $('countin-input').value = p.timeline.countInBeats ?? 8;
  $('ripple-check').checked = state.ripple;
  $('pb-metro').checked = !!p.timeline.metronome;
  // 块时长快捷栏
  const blk = p.timeline.blocks[state.formationIndex];
  if (blk) {
    const fmtB = v => String(Math.round(v * 10) / 10);
    const spbv = M.spb(p);
    const fmtS = v => (v * spbv).toFixed(1).replace(/\.0$/, '');
    const isLast = state.formationIndex >= p.formations.length - 1;
    $('bc-name').textContent = `${state.formationIndex + 1}. ${currentFormation()?.name || ''}`;
    $('bc-hold').textContent = `${fmtB(blk.holdBeats)}拍·${fmtS(blk.holdBeats)}s`;
    $('bc-travel').textContent = `${fmtB(blk.travelBeats)}拍·${fmtS(blk.travelBeats)}s`;
    $('bc-travel-wrap').style.display = isLast ? 'none' : '';
    $('bc-hold-minus').disabled = blk.holdBeats <= 0.5;
    $('bc-travel-minus').disabled = !isLast && blk.travelBeats <= 0.5;
    $('bc-travel-plus').disabled = isLast;
    $('bc-sec').textContent = `（${M.beatLabel(p, 0)} 起 · 共 ${M.totalDurationSec(p).toFixed(1)}s）`;
  }
  $('audio-name').textContent = audio.ready ? `${p.audio.name} (${(p.audio.durationSec || 0).toFixed(1)}s)` : (p.audio.name ? `${p.audio.name}（重新选择文件）` : '未载入音乐');
  $('pb-formation').textContent = currentFormation() ? `${state.formationIndex + 1}. ${currentFormation().name}` : '';
  // 播放暂停后按钮态
  $('pb-play').textContent = player.playing ? '⏸' : '▶';
  stageView.requestDraw();
}

boot();

// 自动化测试钩子（不影响正常使用）：注入音频、读取状态
window.__fs = {
  store, player: () => player, audio, M, shapes, exp,
  stageView: () => stageView,
  musicTl: () => musicTl,
  async loadAudioUrl(url, name = 'test.wav') {
    const r = await fetch(url);
    const b = await r.blob();
    await loadAudioFile(new File([b], name, { type: b.type || 'audio/wav' }));
    return audio.ready;
  },
  drawScene: (ctx, rect, project, positions, opts) => drawScene(ctx, rect, project, positions, opts || {}),
  snapshot() {
    const s = store.getState();
    return {
      view: s.view, formationIndex: s.formationIndex,
      selection: s.selection,
      dancers: s.project?.dancers.length, pairs: s.project?.pairs.length,
      formations: s.project?.formations.map(f => ({ name: f.name, n: Object.keys(f.positions).length })),
      positions: currentFormation()?.positions,
      blocks: s.project?.timeline.blocks,
      audio: { name: s.project?.audio.name, bpm: s.project?.audio.bpm, ready: audio.ready, duration: audio.duration },
      beat: player?.beat, playing: player?.playing,
    };
  },
};


})();
