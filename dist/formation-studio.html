/* Formation Studio · 移动优先 + 桌面断点 · 深浅双主题 */
:root{ /* 浅色（默认） */
  --bg:#f1f5f9; --bg2:#ffffff; --bg3:#e2e8f0; --line:#cbd5e1;
  --fg:#1e293b; --dim:#64748b; --acc:#0284c7; --acc2:#0284c7;
  --m:#3b82f6; --f:#ec4899; --x:#10b981; --danger:#dc2626;
  --toast-bg:#ffffffd9; --stage-chrome:#dfe6ee;
  --rad:8px; --tb-h:48px; --pb-h:44px;
}
[data-theme="dark"]{
  --bg:#0f172a; --bg2:#1e293b; --bg3:#273449; --line:#334155;
  --fg:#e2e8f0; --dim:#94a3b8; --acc:#38bdf8; --acc2:#0ea5e9;
  --danger:#ef4444;
  --toast-bg:#0b1220ee; --stage-chrome:#0b1220;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* F-03（UX-03）：根滚动器禁用 overscroll 效应——y 向堵 Chrome Android 顶部下拉刷新（PTR=整页重载），
   x 向连带堵触控板/边缘横滑到底的历史导航（M-4）。应用无页面级滚动需求，内部滚容器
   （#formation-list/#props-page/#tl-scroll/弹窗）的自身滚动不受影响。 */
html{overscroll-behavior:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;overflow:hidden}
#app,.view{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
/* F-06（UX-06）：按钮/chip/tab 类禁用浏览器双击缩放（manipulation 保留平移/双指缩放 a11y），
   快速连点 ＋/−、移动 Tab、fi-chip 等不再有双击缩放误触面 */
button,.btn,.ptab,#mobile-tabs button,.fi-chip,.es-chip,.um-btn{touch-action:manipulation}
input,select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input:focus,select:focus{outline:1px solid var(--acc)}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.dim{color:var(--dim);font-size:12px}
.spacer{flex:1}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
[hidden]{display:none !important}

/* ---- 通用控件 ---- */
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:var(--rad);padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.round{border-radius:50%;width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn.toggled-on{background:var(--bg3);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.ctl{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;white-space:nowrap}
.rot-ctl{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px}
.rot-ctl input[type=range]{width:90px;padding:0}
.dropdown{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad);min-width:200px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:4px}
.dd-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px}
.dd-menu button:hover{background:var(--bg3)}

/* ---- 双 UI 模式（round46 Lane A；W1 音乐模式主区化）----
   编舞模式（默认）= 既有布局零变化；音乐模式 = #editor-view[data-uimode="music"]：
   舞台三栏（#editor-main）与移动端 Tab 整体隐藏，底部区反转为垂直主体——
   时间轴多轨区 flex 撑满（≥60% 视口），右侧 280px 队形 mini-preview 栏；
   「音乐与节拍」行（#audio-disc）在该模式由 #music-toolbar 替代（C1/C2/C3/C5/C9 的 W1 侧）。
   断言口径：切换往返两侧状态零丢失（选择/tag/播放位置/循环/时间轴缩放）。 */
.seg{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;flex:none}
.seg .seg-btn{background:transparent;border:0;border-radius:0;padding:5px 12px;color:var(--dim);font-size:13px;line-height:1.4}
.seg .seg-btn + .seg-btn{border-left:1px solid var(--line)}
.seg .seg-btn:hover:not(.active){color:var(--fg);background:var(--bg3)}
.seg .seg-btn.active{background:var(--bg3);color:var(--acc);font-weight:600}
.seg-short{display:none}
/* W1 空间反转：音乐模式主区=多轨时间轴（bottom-area flex:1 吃掉 #editor-main 让出的空间）；
   行序按 §2.2：工具条 → 多轨区+preview → playbar 沉底（CSS order，DOM 不搬家）。
   W2：编舞摘要条（#music-summary）只属编舞，音乐模式隐藏（工具条承接）；移动端 #mobile-tabs
   同步隐藏（DEFECT-W1-R1：音乐模式三键死栏，§2.2 隐藏清单口径） */
#editor-view[data-uimode="music"] #editor-main{display:none}
#editor-view[data-uimode="music"] #bottom-area{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#editor-view[data-uimode="music"] #music-toolbar{order:1}
#editor-view[data-uimode="music"] #timeline-area{order:2;flex:1 1 auto;min-height:0;display:flex;flex-direction:row}
#editor-view[data-uimode="music"] #playbar{order:3}
#editor-view[data-uimode="music"] #music-strip{flex:1 1 auto;min-width:0;min-height:0}
#editor-view[data-uimode="music"] #music-summary{display:none} /* 音乐模式职责已由 #music-toolbar 承接 */
#editor-view[data-uimode="music"] #mobile-tabs{display:none}
#editor-view[data-uimode="music"] #tl-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
#editor-view[data-uimode="music"] #tl-scroll{height:100%} /* 容器 flex 撑满；画布高由 render 实测推导 */
#music-toolbar{display:none}
#editor-view[data-uimode="music"] #music-toolbar{display:flex}
#music-preview{display:none}
#editor-view[data-uimode="music"] #music-preview{display:flex}
@media (max-width:1023.5px){
  /* 移动端顶栏紧凑：模式开关呈单字（编/乐）；顶栏过挤时内部横滚（同 #stage-tools 既有模式，
     scrollWidth 仍 ≤375，L2 C-09a 口径不破） */
  .seg-full{display:none}
  .seg-short{display:inline}
  #ui-mode-seg .seg-btn{padding:5px 8px}
  #topbar{overflow-x:auto;scrollbar-width:none}
  #topbar::-webkit-scrollbar{display:none}
  /* W1 移动端音乐模式：三栏隐藏已由上方通用规则覆盖（修复 E-09 的 58% 空白）；
     W3 §2.3：preview 条改移动形态（88px 底部横条，见下方专段），不再整体隐藏 */
  #editor-view[data-uimode="music"] #music-toolbar{overflow-x:auto;scrollbar-width:none}
  #editor-view[data-uimode="music"] #music-toolbar::-webkit-scrollbar{display:none}
  /* 编舞模式 data-mtab 残留不串场：音乐模式时间轴恒可见 */
  #editor-view[data-uimode="music"] #tl-scroll{display:block}
  /* ---- W3 §2.3 移动端音乐模式重排 ----
     纵序：音乐工具条 40（横滚）→ 尺规/tag/lanes（flex:1；>2 轨/内容超出时 #tl-body 纵滚，
     laneH 上限 64 由 timeline.musicLaneH maxH 参数承担）→ preview 条 88px → playbar 44。
     #timeline-area 转 column（桌面为 row 双栏），#music-strip 吃满余量，preview 条沉底。 */
  #editor-view[data-uimode="music"] #timeline-area{flex-direction:column}
  #editor-view[data-uimode="music"] #music-strip{flex:1 1 auto}
  #editor-view[data-uimode="music"] #music-preview{
    display:grid;grid-template-columns:88px minmax(0,1fr);grid-template-rows:auto auto;
    gap:3px 10px;align-items:center;flex:none;height:88px;min-height:0;padding:8px 10px;
    border-left:none;border-top:1px solid var(--line);overflow:hidden}
  #editor-view[data-uimode="music"] #mp-canvas{grid-row:1/3;width:88px;height:60px}
  #editor-view[data-uimode="music"] #music-preview .mp-name{grid-column:2;grid-row:1;min-width:0}
  #editor-view[data-uimode="music"] #music-preview .mp-block{grid-column:2;grid-row:2;flex-direction:row;gap:10px;flex-wrap:nowrap;min-width:0}
  #editor-view[data-uimode="music"] #music-preview .mp-block .ctl{font-size:11px;gap:3px}
  #editor-view[data-uimode="music"] #music-preview .btn.step{padding:0 7px;line-height:18px;font-size:13px}
  /* 值里的「·秒」段移动端隐藏（防 375 横溢；拍数与 ± 步进保留——§2.3「当前块名/拍步进」） */
  #editor-view[data-uimode="music"] #music-preview .mp-s{display:none}
  /* 对齐到播放头为桌面纵栏能力；移动横条 375 内放不下（无横溢红线 C-09a），收纳隐藏 */
  #editor-view[data-uimode="music"] #mp-align{display:none}
}

/* ---- 音乐工具条 40px（W1 新增）---- */
#music-toolbar{align-items:center;gap:8px;padding:0 10px;height:40px;flex:none;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
#music-toolbar .ctl input[type=number]{padding:2px 5px}
#mtb-audio-name{max-width:220px;overflow:hidden;text-overflow:ellipsis}

/* ---- 队形 mini-preview 栏 280px（W1 C15 新增；音乐模式只读对齐参照）----
   W3：#music-preview 需作 #mp-countin（数拍大字）的定位上下文 */
#music-preview{flex:0 0 280px;flex-direction:column;gap:8px;padding:10px;border-left:1px solid var(--line);background:var(--bg2);min-height:0;overflow-y:auto;position:relative}
#mp-canvas{display:block;width:100%;height:170px;flex:none;background:#f8fafc;border:1px solid var(--line);border-radius:8px}
[data-theme="dark"] #mp-canvas{background:#0b1220}
#music-preview .mp-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#music-preview .mp-block{display:flex;flex-direction:column;gap:6px}
#music-preview .ctl{white-space:nowrap}
#music-preview .btn.step{padding:0 9px;line-height:20px;font-size:14px}
/* W3 C17（修 P12）：音乐模式数拍入场大字——盖在 preview 条上（桌面=280 纵栏、移动=88 横条皆居中）。
   编舞模式走 #stage-wrap>#countin-overlay 既有路径（该元素随 #editor-main 隐藏，无干扰） */
#mp-countin{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:800;color:var(--acc);pointer-events:none;
  text-shadow:0 4px 30px rgba(0,0,0,.55);background:rgba(2,6,23,.18);border-radius:inherit}
#mp-countin[hidden]{display:none}

/* ---- 项目库 ---- */
#library-view{display:flex;flex-direction:column;overflow:auto}
.offline-note{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 16px;font-size:12.5px;color:var(--dim);background:var(--bg3);border-bottom:1px solid var(--line)}
.offline-note-x{border:0;background:none;color:var(--dim);font-size:16px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.offline-note-x:hover{color:var(--fg);background:var(--bg2)}
.lib-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;background:var(--bg);z-index:5}
.lib-brand{font-size:20px;font-weight:700}
.lib-sub{font-size:13px;color:var(--dim);font-weight:400;margin-left:6px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:6px 20px 30px}
.lib-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.lib-card:hover{border-color:var(--acc)}
.lib-card canvas{display:block;width:100%;background:#f8fafc}
.lib-card .lc-body{padding:10px 12px}
.lib-card .lc-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-card .lc-meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px}
.lib-card .lc-del{background:none;border:0;color:var(--dim);padding:2px 4px}
.lib-card .lc-del:hover{color:var(--danger)}
.lib-empty{padding:80px 20px;text-align:center;color:var(--dim)}
.lib-empty-icon{font-size:44px;margin-bottom:8px}

/* ---- 编辑器布局（移动优先） ---- */
#editor-view{display:flex;flex-direction:column}
#topbar{height:var(--tb-h);display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.title-input{background:transparent;border:1px solid transparent;font-weight:600;max-width:280px;min-width:60px}
.title-input:hover,.title-input:focus{background:var(--bg3);border-color:var(--line)}
#editor-main{flex:1;display:flex;min-height:0;position:relative}
#left-panel{display:none;flex-direction:column;width:180px;border-right:1px solid var(--line);background:var(--bg2);flex:none;min-height:0}
.panel-head{padding:10px 12px 6px;font-weight:600;font-size:13px}
.panel-foot{padding:8px;border-top:1px solid var(--line);display:flex;gap:6px}
#formation-list{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:6px}
.f-chip{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px;cursor:pointer;position:relative}
.f-chip.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.f-chip canvas{display:block;width:100%;border-radius:4px;background:#f8fafc}
.f-chip .fc-name{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:12px}
.f-chip .fc-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-chip .fc-bar{color:var(--dim);font-size:11px}
.f-chip .fc-drag{cursor:grab;color:var(--dim)}

/* round23 需求 3：桌面队形列表放大版——chip 铺满 180px 面板，层次（选中/悬停/拖拽把手中态）与主题一致 */
.es-chip{flex:none;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px;cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s}
.es-chip:hover{border-color:var(--acc)}
.es-chip:active{cursor:grabbing}
.es-chip.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 2px 8px rgba(56,189,248,.18)}
.es-chip.active .es-name{color:var(--acc);font-weight:600}
.es-chip.dragging{opacity:.45;border-style:dashed}
/* F-10（UX-10）：触摸长按拖拽排序——lift=拿起态（抬升投影），tshift=让位预览的平移过渡
   （位移本体由 JS 内联 transform 写入；被拿起的 chip 不加 tshift，跟随手指零延迟） */
.es-chip.lift{z-index:6;opacity:.95;border-color:var(--acc);box-shadow:0 10px 24px rgba(0,0,0,.5);cursor:grabbing}
.es-chip.tshift{transition:transform .13s ease-out}
.es-chip canvas{display:block;margin:0 auto;border-radius:4px;background:#f8fafc}
.es-chip .es-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;color:var(--fg)}

#stage-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage-tools{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;flex:none}
#stage-wrap{flex:1;position:relative;min-height:0;overflow:hidden;background:#0b1220}
#stage-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#countin-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:var(--acc);text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}

/* F-11（UX-11/16）：iOS 长按 loupe/文本放大镜与 Android 长按呼出显式抑制；
   编辑面禁文本选择（拖拽跨面零泄露、双击面板不再误选文字），输入控件显式豁免（保留拖选/复制） */
#stage-canvas,#stage-wrap{-webkit-touch-callout:none}
#editor-view{user-select:none;-webkit-user-select:none}
#editor-view input,#editor-view textarea,#editor-view select{user-select:text;-webkit-user-select:text}

#right-panel{display:none;flex-direction:column;width:250px;border-left:1px solid var(--line);background:var(--bg2);flex:none;min-height:0}
.panel-tabs{display:flex;border-bottom:1px solid var(--line)}
.ptab{flex:1;background:none;border:0;padding:9px;color:var(--dim);border-bottom:2px solid transparent}
.ptab.active{color:var(--fg);border-bottom-color:var(--acc)}
.props-page{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.prop-group{border:1px solid var(--line);border-radius:var(--rad);padding:10px;display:flex;flex-direction:column;gap:8px}
.prop-group>.pg-title{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.prop-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.prop-row label{color:var(--dim);font-size:13px;flex:none}
.prop-row input[type=number]{width:70px}
.prop-row input[type=text]{width:100%}
.prop-row input[type=color]{padding:0;width:34px;height:26px}
textarea.note{width:100%;min-height:54px;resize:vertical;background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px}

/* ---- 底部播放条/时间线 ---- */
#bottom-area{border-top:1px solid var(--line);background:var(--bg2);flex:none}
#playbar{height:var(--pb-h);display:flex;align-items:center;gap:8px;padding:0 10px}
#pb-pos{min-width:52px;text-align:center}
#timeline-area{border-top:1px solid var(--line)}
#block-ctl{display:flex;align-items:center;gap:10px;padding:4px 10px;border-bottom:1px dashed var(--bg3);flex-wrap:wrap}
#block-ctl .bc-label{font-size:12px;color:var(--acc);font-weight:600}
#block-ctl .bc-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#block-ctl .bc-val{min-width:70px;text-align:center;display:inline-block;background:var(--bg3);border-radius:6px;padding:2px 6px}
#block-ctl .btn.step{padding:0 9px;line-height:20px;font-size:14px}
/* ⚑ 打点与 ± 步进同高（避免行高变化挤压舞台几何——D-08 类像素仪器对布局位移敏感） */
#block-ctl #btn-tag-drop{padding:0 9px;line-height:20px;font-size:14px}
/* 对齐到播放头（W2 自摘要条迁入块栏）：与打点/步进同高，同口径防行高位移 */
#block-ctl #btn-align-playhead{padding:0 9px;line-height:20px;font-size:14px}
/* 图标化几何补偿（汇合轮）：⚑→SVG 后按钮宽 +7.6px，375px 视口 #block-ctl 行内放不下 flex
   spacer → spacer 独占一行令整条高 10px（舞台画布随之变矮，L2 移动端几何/半径基线依赖旧值）。
   移动端 spacer 本为 0.7px 视觉空隙，隐藏之恢复单行布局（与图标化前逐像素一致）。 */
@media (max-width:1023.5px){#block-ctl .spacer{display:none}}
#music-strip{display:flex;flex-direction:column}
/* ---- W2 C14 编舞模式音乐摘要条（30px 单行）----
   替代「🎵 音乐与节拍」折叠面板（C1 退役，原 summary 25px + audio-panel 78px）：
   单行 30px 摘要 + 校准浮层（details 打开为绝对定位浮层，不撑高条身）。
   高度红线：条身高 30±4px（IR-W2-1）； freed 高度返还舞台（编舞主区）。 */
#music-summary{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:0 10px;min-height:30px;flex:none;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
#music-summary .ms-note{color:var(--acc);font-size:14px;flex:none}
#music-summary .ms-name{color:var(--dim);font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;flex:none;min-width:0}
#music-summary .ms-meta{color:var(--dim);font-size:12px;flex:none}
#music-summary .btn.small{flex:none}
#music-summary .spacer{flex:1}
/* 校准展开（编舞摘要条内的 details）：收起=条上 30px 单行之一；展开=整条折行到第二行
   （同旧「音乐与节拍」面板的校准子行语义——不悬浮、不遮挡时间轴画布，仪器与直点动线不受遮拦）。
   IR-W2-1b 的 30±4px 锚定收起态（默认）。 */
#music-summary #calib-disc{position:relative;display:inline-flex;align-items:center;flex:none}
#music-summary #calib-disc summary{cursor:pointer;list-style:none;color:var(--dim);font-size:13px;user-select:none;white-space:nowrap}
#music-summary #calib-disc summary::-webkit-details-marker{display:none}
#music-summary #calib-disc summary::before{content:'▸ ';}
#music-summary #calib-disc[open] summary::before{content:'▾ ';}
#music-summary #calib-disc[open] summary{color:var(--acc)}
#music-summary #calib-disc[open]{flex-basis:100%;order:9} /* 折行独占第二行 */
#music-summary #calib-panel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 6px;min-width:0}
#music-summary #calib-panel input[type=number][readonly]{color:var(--dim);background:transparent;border-style:dashed}
#music-summary #calib-panel input[type=number][readonly]{color:var(--dim);background:transparent;border-style:dashed}
/* 移动端摘要条：单行横滚（同 #music-toolbar 既有模式），scrollWidth≤375 口径不破（L2 C-09a）；
   nowrap 覆盖桌面的 flex-wrap（校准展开折行为桌面形态，移动端 W3 再定） */
@media (max-width:1023.5px){
  #music-summary{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #music-summary::-webkit-scrollbar{display:none}
  #music-summary .ms-name{max-width:150px}
}
/* C12 空态（W2 合并）：一行灰字浮于音频简单道上，点击跳音乐模式；旧双钮已退役 */
#tl-audio-empty{position:absolute;left:10px;z-index:7;display:flex;align-items:center;color:var(--dim);font-size:12px;cursor:pointer;user-select:none}
#tl-audio-empty:hover{color:var(--acc)}
#tl-scroll{overflow-x:auto;height:150px;position:relative} /* 实际高度由 timeline.render 按 简单150/移动120/展开160 写入 */
#tl-inner{position:relative;height:100%}
#tl-canvas,#tl-overlay{position:absolute;top:0;left:0;height:100%}
/* ---- v3 音频轨附属 DOM 层 ----
   #tl-body 定位上下文：多轨轨头/空态入口绝对定位其上，top 由 timeline.render 按几何写入。
   W1 退役：#tl-audio-toggle 展开钮与 #tl-head 展开态表头样式随 DOM 一并删除（C6/C7）。 */
#tl-body{position:relative}
/* ---- v3 音频轨附属 DOM 层 ----
   #tl-body 定位上下文：多轨轨头/空态入口绝对定位其上，top 由 timeline.render 按几何写入。
   W1 退役：#tl-audio-toggle 展开钮与 #tl-head 展开态表头样式随 DOM 一并删除（C6/C7）。
   W2（C12）：#tl-audio-empty 由「＋载入/媒体库」双钮改为一行灰字（样式见 #music-summary 区块）。 */
#tl-tracks-head{position:absolute;left:0;z-index:7;width:140px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;row-gap:12px;font-size:11px;overflow:hidden}
#tl-tracks-head .tl-track{border-top:1px solid var(--line);padding:2px 6px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;overflow:hidden}
#tl-tracks-head .tl-track:first-child{border-top:none}
#tl-tracks-head .tlt-row{display:flex;align-items:center;gap:3px;min-width:0}
#tl-tracks-head .tlt-name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
#tl-tracks-head .tlt-row input[type=range]{width:46px;padding:0;height:14px;flex:1}
#tl-tracks-head .btn{padding:0 5px;line-height:16px;font-size:11px}
#tl-tracks-head .btn:disabled{opacity:.35}
#tl-tracks-head .tlt-mut.toggled-on{color:var(--acc)}
#tl-tracks-head .tl-tracks-ops{height:26px;display:flex;align-items:center;gap:4px;padding:0 6px;border-top:1px solid var(--line)}
/* 音频剪辑右键菜单（与 .unit-menu 同风格，固定定位跟光标） */
#clip-ctx-menu .um-btn{display:block;width:100%;text-align:left}
#clip-ctx-menu .ctx-swatches{display:flex;gap:4px;padding:4px 6px}
#clip-ctx-menu .ctx-sw{width:18px;height:18px;border-radius:4px;border:1px solid var(--line)}
/* F-02（UX-02）：时间轴画布禁浏览器手势接管——pan-x 会让块边缘横向拖拽仍被滚动接管
   （横拖主导轴判定），none 才能让 scrub/块拖在触摸端可用；容器横滚改由滚轮/按钮/缩放承担 */
#tl-canvas{touch-action:none}
#tl-overlay{pointer-events:none}
/* 时间轴 tag 道内联命名输入（打点/重命名）：钉在 tag 道（尺规 22px 之下），随 #tl-inner 横向滚动 */
.tl-tag-input{position:absolute;top:23px;left:0;z-index:6;width:110px;font-size:12px;line-height:1.4;padding:1px 5px;border-radius:5px;background:var(--bg2)}

/* ---- 移动端队形索引条 ---- */
#formation-index{display:none}
@media (max-width:1023.5px){
  /* round23 需求 3：索引条重设计——当前帧高亮强化、缩略图按 dpr 清晰呈示、＋/－ 直达；
     水平滚动保留原生惯性（容器未设 touch-action 约束，fi-chip 的 manipulation 亦不阻断 pan-x） */
  #formation-index{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #formation-index::-webkit-scrollbar{display:none}
  .fi-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 5px;transition:border-color .12s,background .12s,box-shadow .12s}
  .fi-chip canvas{display:block;border-radius:5px;background:#f8fafc}
  .fi-num{font-size:11px;font-weight:700;line-height:1;color:var(--dim);font-variant-numeric:tabular-nums}
  .fi-label{max-width:72px;font-size:10px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fi-chip.active{border-color:var(--acc);background:var(--bg3);box-shadow:0 0 0 2px var(--acc),0 2px 10px rgba(56,189,248,.35)}
  .fi-chip.active .fi-num,.fi-chip.active .fi-label{color:var(--acc)}
  .fi-btn{flex:none;width:40px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--acc);font-size:18px;font-weight:600}
  .fi-btn:active{background:var(--bg3)}
  .fi-btn.fi-danger{color:var(--danger)}
}
body[data-mtab="formations"] #formation-index{display:none}
/* 移动端工具收纳：次级工具默认隐藏，点 ⋯ 展开 */
@media (max-width:1023.5px){
  #stage-tools{flex-wrap:nowrap;overflow-x:auto}
}

/* ---- 移动端 Tab ---- */
#mobile-tabs{display:flex;border-top:1px solid var(--line);background:var(--bg2);flex:none}
#mobile-tabs button{flex:1;background:none;border:0;padding:11px 0;color:var(--dim);font-size:13px}
#mobile-tabs button.active{color:var(--acc);font-weight:600}
body[data-mtab="formations"] #left-panel,
body[data-mtab="more"] #right-panel{display:flex;position:absolute;inset:var(--tb-h) 0 0 0;z-index:40;background:var(--bg);width:auto}
body[data-mtab="formations"] #tl-scroll{display:none}

/* ---- 桌面 ---- */
@media (min-width:1024px){
  #mobile-tabs{display:none}
  #left-panel,#right-panel{display:flex !important;position:static;width:180px}
  #right-panel{width:250px}
  #left-panel{width:180px}
  #stage-tools{flex-wrap:nowrap;overflow-x:auto}
}

/* ---- 名册弹窗 ---- */
.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.66);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 12px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.roster-table{width:100%;border-collapse:collapse;font-size:13px}
.roster-table th{color:var(--dim);text-align:left;font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
.roster-table td{padding:3px 6px;border-bottom:1px solid var(--bg3)}
.roster-table input[type=text]{width:100%}
.roster-table select{padding:2px 4px}

/* ---- 编组（RTS 式选择辅助） ---- */
.grp-row{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.grp-row:hover{border-color:var(--acc)}
.grp-row .grp-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.grp-row .grp-ops{display:flex;gap:4px;flex:none}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--dim);white-space:nowrap}
.chip:hover{border-color:var(--acc)}
.chip.chip-on{border-color:var(--acc);color:var(--acc);font-weight:600}
.roster-groups{max-width:190px}
.roster-groups .chip{margin:1px 2px 1px 0}

/* ---- 说明书（manual 页签 + 移动端全屏覆盖层） ---- */
/* 页签：独立 .mtab（不计入 .ptab——E2E 仪器断言既有四页签数量），视觉与 .ptab 平齐；
   5 个页签挤 250px 面板：收窄横向内边距 + .mtab 缩字号防换行裁切 */
.panel-tabs .ptab{padding:9px 0}
.mtab{flex:1.35;background:none;border:0;padding:9px 0;color:var(--dim);border-bottom:2px solid transparent;font-size:11.5px;white-space:nowrap}
.mtab.active{color:var(--fg);border-bottom-color:var(--acc)}
.manual{display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.55}
.manual .man-head .man-ver{display:inline-block;font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.manual .man-head .man-intro{margin:0;color:var(--fg)}
.manual .man-scene{border:1px solid var(--line);border-radius:var(--rad);padding:10px;display:flex;flex-direction:column;gap:6px}
.manual h3{margin:0;font-size:13.5px;color:var(--acc)}
.manual .man-role{margin:0;color:var(--dim);font-size:12px}
.manual .man-steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.manual .man-steps li::marker{color:var(--acc);font-weight:600}
.manual .man-figs{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.manual .man-fig{flex:1 1 110px;min-width:100px;max-width:100%;margin:0}
.manual .man-fig img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg3)}
.manual .man-fig figcaption{font-size:11px;color:var(--dim);margin-top:3px}
.manual .man-table{width:100%;border-collapse:collapse;font-size:11.5px}
.manual .man-table th{color:var(--dim);text-align:left;font-weight:600;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.manual .man-table td{padding:4px;border-bottom:1px solid var(--bg3);vertical-align:top}
.manual .man-table td:first-child{white-space:nowrap;color:var(--dim)}
.manual .man-keys td:first-child{font-variant-numeric:tabular-nums}
.manual .man-note{margin:0;color:var(--dim);font-size:11.5px}
.manual .man-limits{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.manual .man-limits li::marker{color:var(--danger)}
/* 移动端「更多」入口 + 全屏覆盖层 */
.manual-entry{display:none}
#manual-overlay{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column}
.manual-ov-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
.manual-ov-title{font-weight:700}
.manual-ov-body{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
@media (max-width:1023.5px){
  body[data-mtab="more"] .manual-entry{display:block;width:100%;padding:11px 12px;background:var(--bg2);border:0;border-bottom:1px solid var(--line);color:var(--acc);font-weight:600;text-align:left}
}

/* ---- Toast ---- */
#toasts{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--toast-bg);border:1px solid var(--line);border-radius:10px;padding:9px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:toast-in .18s ease-out}
/* W3：toast 动作钮（变速提示「切秒刻度」）——条内小钮，主题色描边。
   #toasts 容器 pointer-events:none（防整条挡交互），动作钮显式恢复可点（修复烟测实测缺陷：
   音乐模式 toast 悬于时间轴画布上，无 auto 则画布拦截点击，钮永不可点） */
.toast .toast-act{pointer-events:auto;margin-left:12px;padding:2px 10px;font-size:12.5px;line-height:1.5;border-color:var(--acc);color:var(--acc);background:transparent;border-radius:7px;cursor:pointer}
.toast .toast-act:hover{background:var(--bg3)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- 移动端紧凑化 ---- */
@media (max-width:1023.5px){
  .hide-mobile{display:none !important}
}
@media (max-width:1023.5px){
  #topbar{gap:4px;padding:0 6px}
  /* DEFECT-L2-3：375px 顶栏放不下版本徽标（~90px），是页面级横向溢出的根源
     （#btn-export right=405>375）；移动端隐藏后其余控件可全部收入视口。
     桌面端（≥1024px）不受影响，G1 门禁的可见版本徽标断言在 1280 宽下照常通过。 */
  #build-tag{display:none}
  .title-input{flex:1 1 40px;min-width:0;width:0;text-align:center;font-size:13px}
  .btn.small{padding:6px 10px} /* 触摸目标 */
  #playbar{gap:5px;padding:0 6px;overflow-x:auto} /* DEFECT-L2-3：375px 下播放条固定内容右缘超宽（节拍器已移出至音乐面板，规则保留防回归），收敛为内部滚动（同 #stage-tools 模式） */
  #pb-formation{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stage-tools{gap:4px;padding:4px 6px;flex-wrap:nowrap;overflow-x:auto}
  .rot-ctl input[type=range]{width:64px}
  .lc-del{padding:8px}
}

/* ---- 打印页 ---- */
@media print{
  body>*{display:none !important}
}
.print-page{page-break-after:always;text-align:center}
.print-page img{max-width:100%}
.print-page h2{margin:6px 0}
.print-page .p-meta{color:#334155;font-size:13px;margin-bottom:8px;white-space:pre-line}

/* ---- 单元浮窗（合并确认/单元操作） ---- */
.unit-menu{position:absolute;z-index:50;background:var(--bg2);border:1px solid var(--acc);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:150px}
.unit-menu .um-title{font-size:12px;color:var(--dim);font-weight:600}
.unit-menu .um-row{display:flex;gap:4px}
.unit-menu .um-lab{font-size:12px;color:var(--dim);align-self:center;white-space:nowrap}
.unit-menu .um-btn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--fg);white-space:nowrap}
.unit-menu .um-btn:hover{border-color:var(--acc);color:var(--acc)}
.unit-menu .um-btn.um-cur{border-color:var(--acc);color:var(--acc);font-weight:600}
.unit-menu .um-btn.um-cancel{border-color:var(--line);color:var(--dim)}

.build-tag{font-size:10px;color:var(--dim);opacity:.7;margin-left:8px;user-select:none}

</style>
</head>
<body>
<div id="app">

  <!-- ===== 项目库视图 ===== -->
  <section id="library-view" class="view" hidden>
    <div id="offline-note" class="offline-note" hidden>
      <span>离线版：项目数据保存在本浏览器（配乐不保留）</span>
      <button id="offline-note-close" class="offline-note-x" aria-label="关闭提示" title="关闭提示">×</button>
    </div>
    <header class="lib-header">
      <div class="lib-brand">舞阵 <span class="lib-sub">WuZhen · 队形编排</span></div>
      <button id="btn-new-project" class="btn primary">＋ 新建项目</button>
    </header>
    <div id="library-grid" class="lib-grid"></div>
    <div id="library-empty" class="lib-empty" hidden>
      <div class="lib-empty-icon">💃</div>
      <p>还没有项目，点击右上角「新建项目」开始编排队形</p>
    </div>
  </section>

  <!-- ===== 编辑器视图 ===== -->
  <section id="editor-view" class="view" hidden>
    <header id="topbar">
      <button id="btn-back" class="btn ghost" title="返回项目库">‹ 项目库</button><span id="build-tag" class="build-tag"></span>
      <input id="proj-title" class="title-input" spellcheck="false" title="项目名称">
      <span class="spacer"></span>
      <button id="btn-theme" class="btn ghost" title="切换深色/浅色主题"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="moon" aria-hidden="true" style="vertical-align:-2px"><path d="M12 3a6.3 6.3 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
      <button id="btn-roster" class="btn ghost" title="舞者与编组名单">名册</button>
      <button id="btn-undo" class="btn ghost" title="撤销 (Ctrl+Z)"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="undo" aria-hidden="true" style="vertical-align:-2px"><path d="M8 5L4 9l4 4"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H9"/></svg></button>
      <button id="btn-redo" class="btn ghost" title="重做 (Ctrl+Shift+Z)"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="redo" aria-hidden="true" style="vertical-align:-2px"><path d="M16 5l4 4-4 4"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H15"/></svg></button>
      <div class="dropdown" id="export-dd">
        <button id="btn-export" class="btn ghost">导出 ▾</button>
        <div class="dd-menu" hidden>
          <button id="exp-png">当前队形 PNG</button>
          <button id="exp-print">打印 / PDF（全部队形）</button>
          <button id="exp-json-audio">导出项目文件（含音乐）</button>
          <button id="exp-json">导出项目文件（不含音乐）</button>
          <button id="imp-json">导入项目文件…</button>
        </div>
      </div>
      <!-- 双 UI 模式（round46 Lane A）：编舞=默认（舞台+队形块区，几何与既有版本零变化）；
           音乐=隐藏块区与块时长栏、专注音频剪辑，舞台保留画面但收窄。快捷键 M；
           播放/数拍中禁止切换（toast「暂停后可切换」）。说明书入口不动（manual 归并行线） -->
      <div class="seg" id="ui-mode-seg" role="group" aria-label="编辑器模式（编舞/音乐，快捷键 M）">
        <button id="ui-mode-stage" class="seg-btn active" aria-pressed="true"
          title="编舞模式（默认）：舞台编辑 + 队形块区/块时长栏齐全。按 M 切到音乐模式"><span class="seg-full">编舞</span><span class="seg-short">编</span></button>
        <button id="ui-mode-music" class="seg-btn" aria-pressed="false"
          title="音乐模式：隐藏队形块区与块时长栏，专注音频剪辑；舞台保留画面但收窄，tag/尺规/播放头保留。按 M 切回；播放中暂停后可切换"><span class="seg-full">音乐</span><span class="seg-short">乐</span></button>
      </div>
    </header>

    <div id="editor-main">
      <!-- 左：队形列表 -->
      <aside id="left-panel">
        <div class="panel-head">队形 <span id="formation-count" class="dim"></span></div>
        <div id="formation-list"></div>
        <div class="panel-foot">
          <button id="btn-add-formation" class="btn primary small">＋ 新队形</button>
          <button id="btn-del-formation" class="btn small">删除</button>
        </div>
      </aside>

      <!-- 中：舞台 -->
      <div id="stage-col">
        <div id="stage-tools">
          <button id="btn-edit-mode" class="btn small toggled-on" title="开启：舞台可拖动编辑；关闭：查看模式（舞台随时间轴播放头联动）"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="pencil" aria-hidden="true" style="vertical-align:-2px"><path d="M4 20l1.2-4.2L16.6 4.4a2 2 0 0 1 2.9 2.9L8.2 18.7 4 20z"/><path d="M13.6 7.4l3 3"/></svg> 编辑</button>
          <button id="btn-multi" class="btn small" title="多选模式（触摸端多选入口）：开启后点按舞者=追加选择"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon="menu" aria-hidden="true" style="vertical-align:-2px"><path d="M4 7h16M4 12h16M4 17h16"/></svg> 多选</button>
          <span class="vsep"></span>
          <select id="gen-kind" title="队形生成器">
            <option value="">生成队形…</option>
            <option value="rows">多横排</option>
            <option value="line">一字横排</option>
            <option value="columns">纵列</option>
            <option value="circle">圆形</option>
            <option value="arc">弧形</option>
            <option value="v">V 形</option>
            <option value="diagonal">斜线</option>
            <option value="diamond">菱形</option>
          </select>
          <select id="gen-unit" title="编队粒度">

  _teardown(td) {

// 纯拍位标记不改播放逻辑）。道内交互独立分区：单点旗=预备跳转、拖旗=移动、×=删除、

    this.razor = false;        // 剃刀模式（R 开关；会话态）
    this.clipSel = new Set();  // 选中 clip id（单选/Ctrl 多选）
    this.timeSel = null;       // 时间选区 {start, end}（秒；空白拖拽/尺规 Shift 拖拽）

    this.hoverAudio = false;   // 悬停音频轨（S/R 快捷键作用域判定）

    }
    // 重叠自动交叉淡化：交叠中点菱形手柄。裁定③：computeOverlaps 不加轨过滤——跨轨重叠
    // 同样自动淡化（实现最简且听感合理）；菱形画在 ov.a 所在 lane。
    for (const ov of computeOverlaps(clips)) {
      const li = n > 1 ? Math.max(0, this.tracksOf(p).findIndex(t => t.id === trackOfClip(p, ov.a)?.id)) : 0;
      const mx = ((ov.start + ov.end) / 2) * pps;
      const my = this.laneTopOf(p, li) + 10;
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#e879f9';
      ctx.strokeStyle = 'rgba(232,121,249,.5)';
      ctx.lineWidth = 1;
      ctx.fillRect(-4, -4, 8, 8);
      ctx.strokeRect(-4, -4, 8, 8);
      ctx.restore();
    }
    ctx.restore();
  }
  drawClipBox(ctx, p, c, top, lh, pps) {
    const x0 = c.timelineStartSec * pps, x1 = clipEnd(c) * pps, w = x1 - x0;
    if (x1 <= 0 || x0 >= this.W) return;
    const pad = this.expanded ? 3 : 3;
    const y0 = top + pad, y1 = top + lh - pad;
    const color = c.color || CLIP_DEFAULT_COLOR;
    const selected = this.clipSel.has(c.id);
    const visX0 = Math.max(-2, x0), visX1 = Math.min(this.W + 2, x1);
    ctx.save();
    // 盒底
    ctx.fillStyle = hexA(color, c.muted ? .05 : .13);
    ctx.fillRect(visX0, y0, visX1 - visX0, y1 - y0);
    // 波形（按淡化包络收窄、随增益缩放；静音置灰）
    const env = this.hooks.audio?.assets?.get(c.assetId)?.env || null;
    const mid = (y0 + y1) / 2;
    const amp = (y1 - y0) / 2 - (this.expanded ? 6 : 4);
    const step = Math.max(1, Math.floor(this.W / 2400));
    ctx.fillStyle = hexA(color, c.muted ? .22 : .58);
    for (let x = Math.ceil(visX0); x < visX1; x += step) {
      const rel = (x - x0) / pps;
      const src = c.srcStartSec + rel;
      let v = env ? envAt(env, src) : .14;
      v *= Math.min(1.6, c.gain ?? 1) * fadeEnvAt(c, rel);
      const a = Math.max(1, v * amp);
      ctx.fillRect(x, mid - a, step, a * 2);
    }
    // 名牌
    const nm = (c.name || '音频') + (c.muted ? '（静音）' : '');
    if (w > 34) {
      ctx.fillStyle = c.muted ? 'rgba(148,163,184,.8)' : '#e2e8f0';
      ctx.font = '10px sans-serif'; ctx.textBaseline = 'top';
      const maxChars = Math.floor((w - 8) / 6.2);
      if (maxChars > 1) ctx.fillText(nm.slice(0, maxChars), x0 + 4, y0 + 2);
    }
    if (this.expanded) {
      // 增益包络横线（黄，中线）
      ctx.strokeStyle = 'rgba(250,204,21,.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x0 + 2, mid); ctx.lineTo(x1 - 2, mid); ctx.stroke();
      // 淡化把手（顶部方把手；auto 交叉淡化呈品红）
      const drawFh = (fx, isAuto) => {
        ctx.fillStyle = isAuto ? '#e879f9' : '#7dd3fc';
        ctx.fillRect(fx - 3.5, y0 - 1.5, 7, 7);
        ctx.strokeStyle = 'rgba(2,6,23,.6)'; ctx.lineWidth = 1;
        ctx.strokeRect(fx - 3.5, y0 - 1.5, 7, 7);
      };
      if ((c.fadeInSec || 0) > 0.005) drawFh(x0 + c.fadeInSec * pps, !!c.fadeInAuto);
      if ((c.fadeOutSec || 0) > 0.005) drawFh(x1 - c.fadeOutSec * pps, !!c.fadeOutAuto);
      // trim 缘（红括号光标区）
      const hotL = this.hoverClipEdge?.id === c.id && this.hoverClipEdge.part === 'trimL';
      const hotR = this.hoverClipEdge?.id === c.id && this.hoverClipEdge.part === 'trimR';
      ctx.fillStyle = hotL ? '#f43f5e' : 'rgba(244,63,94,.5)';
      ctx.fillRect(x0 - 1.5, y0, 3, y1 - y0);
      ctx.fillStyle = hotR ? '#f43f5e' : 'rgba(244,63,94,.5)';
      ctx.fillRect(x1 - 1.5, y0, 3, y1 - y0);
    }
    // 选中高亮描边
    if (selected) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.strokeRect(x0 - 1, y0 - 1, w + 2, y1 - y0 + 2);
    }
    ctx.restore();
  }

  drawRuler(ctx, p, h) {
    const pps = this.ppsOf(p);
    const rulerH = TL_RULER_H;
    ctx.save();
    ctx.fillStyle = '#131c31';
    ctx.fillRect(0, 0, this.W, rulerH);
    ctx.strokeStyle = '#243049'; ctx.fillStyle = '#8ea2bd';
    ctx.font = '10px sans-serif'; ctx.textBaseline = 'middle';
    if (this.rulerScale === 'sec') {
      // 秒刻度（决策⑥降级刻度）：NICE 秒族主刻度 + 1/5 细分短线；变速曲/无节拍音乐按秒对齐
      const step = niceSecStep(pps);
      ctx.beginPath();
      for (let k = 0; ; k++) {
        const x = k * step * pps;
        if (x > this.W) break;
        ctx.moveTo(x, rulerH - 8); ctx.lineTo(x, h);
        ctx.fillText(fmtSecLabel(k * step), x + 3, rulerH / 2);
      }
      const minor = step / 5;
      if (minor * pps >= 10) {
        for (let k = 0; ; k++) {
          const x = k * minor * pps;
          if (x > this.W) break;
          ctx.moveTo(x, rulerH); ctx.lineTo(x, rulerH + 6);
        }
      }
      ctx.stroke();
      ctx.restore();
      this.rulerH = rulerH;
      return;
    }
    const bpb = p.audio.beatsPerBar || 4;
    const spbV = spb(p);
    const pxPerBar = bpb * spbV * pps;
    const barStep = pxPerBar < 26 ? 8 : pxPerBar < 60 ? 4 : 1;
    const { totalBeats } = computeSegments(p);
    const totalBars = Math.ceil(beatToSec(p, totalBeats) / spbV / bpb) + 2;
    ctx.beginPath();
    for (let bar = 0; bar <= totalBars; bar += barStep) {
      const x = beatToSec(p, bar * bpb) * pps;
      ctx.moveTo(x, rulerH - 8); ctx.lineTo(x, h);
      if (pxPerBar * barStep > 30) ctx.fillText(String(bar + 1), x + 3, rulerH / 2);
    }
    // 8拍刻度（舞蹈计数）
    const pxPer8 = 8 * spbV * pps;
    if (pxPer8 > 44) {
      ctx.strokeStyle = 'rgba(56,189,248,.35)';
      ctx.beginPath();
      for (let c8 = 0; ; c8++) {
        const x = beatToSec(p, c8 * 8) * pps;
        if (x > this.W) break;
        ctx.moveTo(x, rulerH); ctx.lineTo(x, h);
        if (pxPer8 > 70) ctx.fillText(`${c8 + 1}个8拍`, x + 3, h - 8);
      }
      ctx.stroke();
    }
    ctx.stroke();
    ctx.restore();
    this.rulerH = rulerH;
  }
  // 旧整曲波形道已由 v3 常驻音频轨取代（drawWave 移除）：波形按 clip 画在音轨内（drawClipBox）。
  drawBlocks(ctx, p, h) {
    const { segments } = computeSegments(p);
    const pps = this.ppsOf(p);
    const spbV = spb(p);
    const top = this.blocksTopFor(), bh = 36; // v3：块区紧随音频轨（不再底部锚定）
    const selIdx = this.hooks.getIndex();
    ctx.save();
    ctx.font = '10px sans-serif'; ctx.textBaseline = 'middle';
    for (const s of segments) {
      const f = p.formations[s.i];
      if (!f) continue;
      const x0 = beatToSec(p, s.holdStart) * pps;
      const x1 = beatToSec(p, s.holdEnd) * pps;
      const selected = s.i === selIdx;
      const hovered = this.hoverSeg === s.i;
      const holdSec = ((s.holdEnd - s.holdStart) * spbV).toFixed(1).replace(/\.0$/, '');
      // 保持块
      ctx.fillStyle = (f.color || '#64748b') + (hovered ? '77' : '55');
      ctx.fillRect(x0, top, Math.max(2, x1 - x0), bh);
      ctx.lineWidth = selected ? 2 : 1;
      ctx.strokeStyle = selected ? '#38bdf8' : (f.color || '#64748b');
      ctx.strokeRect(x0, top, x1 - x0, bh);
      if (x1 - x0 > 34) {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(f.name.slice(0, Math.floor((x1 - x0) / 7)), x0 + 4, top + 9);
      }
      // 保持时长徽标（拍 + 秒）
      if (x1 - x0 > 40) {
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(`${Math.round(s.holdEnd - s.holdStart)}拍·${holdSec}s`, x0 + 4, top + bh - 9);
        ctx.font = '10px sans-serif';
      } else if (x1 - x0 > 8) {
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.fillText(`${Math.round(s.holdEnd - s.holdStart)}`, x0 + 2, top + bh - 9);
      }
      // 过渡块
      if (s.hasTravel) {
        const tx1 = beatToSec(p, s.travelEnd) * pps;
        const tw = Math.max(1, tx1 - x1);
        ctx.fillStyle = hovered ? 'rgba(56,189,248,.30)' : 'rgba(148,163,184,.25)';
        ctx.fillRect(x1, top, tw, bh);
        ctx.strokeStyle = 'rgba(148,163,184,.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x1, top, tw, bh);
        // 斜线纹理
        if (tw > 6 && bh > 10) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(x1, top, tw, bh); ctx.clip();
          ctx.strokeStyle = 'rgba(148,163,184,.28)';
          for (let gx = x1 - bh; gx < x1 + tw; gx += 7) {
            ctx.moveTo(gx, top + bh); ctx.lineTo(gx + bh, top);
          }
          ctx.stroke();
          ctx.restore();
        }
        const travelBeats = Math.round((s.travelEnd - s.holdEnd) * 10) / 10;
        const travelSec = ((s.travelEnd - s.holdEnd) * spbV).toFixed(1).replace(/\.0$/, '');
        const label = `过渡${travelBeats}拍·${travelSec}s`; // canvas 呈示纯文字（原 ↷ 前缀图标化不适用，icon-mapping §六）
        if (tw > label.length * 6 + 6) {
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText(label, x1 + 4, top + bh / 2);
        } else if (tw > 14) {
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText(travelBeats + '拍', x1 + 3, top + bh / 2);
        } else {
          // 太窄：标到块右侧外
          ctx.fillStyle = '#8ea2bd';
          ctx.fillText(travelBeats + '拍', tx1 + 3, top + bh / 2);
        }
        // 边缘把手（选中块或悬停时显示）
        if (selected || hovered) {
          this._drawGrip(ctx, x1, top, bh, 'hold');
          this._drawGrip(ctx, tx1, top, bh, 'travel');
        }
      }
      // 悬停高亮描边
      if (hovered && !selected) {
        ctx.strokeStyle = 'rgba(56,189,248,.8)';
        ctx.lineWidth = 1.5;
        const hx1 = s.hasTravel ? beatToSec(p, s.travelEnd) * pps : x1;
        ctx.strokeRect(x0, top, hx1 - x0, bh);
      }
    }
    ctx.restore();
    this.blocksTop = top; this.blocksH = bh;
  }
  _drawGrip(ctx, x, top, bh, kind) {
    ctx.save();
    ctx.fillStyle = kind === 'hold' ? '#38bdf8' : '#a78bfa';
    ctx.fillRect(x - 2, top - 2, 4, bh + 4);
    // 把手抓点
    ctx.fillRect(x - 5, top + bh / 2 - 7, 10, 14);
    ctx.restore();
  }
  // ---------- 时间轴标记 tag 道 ----------
  // 旗点=强调色系（主题蓝），细旗杆+旗面+名称胶囊；名称与前旗/后旗过近时只画旗点
  // （名称走 title 悬浮/点击跳转/双击改名可见）；悬停显 × 删除。播放头红色、块把手
  // 蓝/紫均在各自分区，视觉互不混淆。
  drawTags(ctx, p) {
    const tags = [...(p.timeline.tags || [])].sort((a, b) => a.beat - b.beat);
    const top = this.rulerH ?? 22;
    const pps = this.ppsOf(p);
    this._tagGeom = new Map();
    ctx.save();
    ctx.fillStyle = 'rgba(148,163,184,.07)';
    ctx.fillRect(0, top, this.W, TAG_LANE_H);
    ctx.strokeStyle = 'rgba(148,163,184,.22)';
    ctx.beginPath(); ctx.moveTo(0, top + TAG_LANE_H + .5); ctx.lineTo(this.W, top + TAG_LANE_H + .5); ctx.stroke();
    ctx.font = '10px sans-serif'; ctx.textBaseline = 'middle';
    const ACC = '#38bdf8';
    let lastEnd = -1e9; // 前一旗名称胶囊右缘（名称防重叠：贪心左→右）
    for (let k = 0; k < tags.length; k++) {
      const tag = tags[k];
      const x = Math.max(1, Math.min(this.W - 1, beatToSec(p, tag.beat) * pps));
      const nextX = k + 1 < tags.length ? Math.max(1, Math.min(this.W - 1, beatToSec(p, tags[k + 1].beat) * pps)) : this.W;
      const hovered = this.hoverTag === tag.id;
      // 旗杆 + 旗面
      ctx.strokeStyle = ACC; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, top + TAG_LANE_H - 1); ctx.lineTo(x, top + 3); ctx.stroke();
      ctx.fillStyle = hovered ? '#7dd3fc' : ACC;
      ctx.beginPath();
      ctx.moveTo(x + 1, top + 3); ctx.lineTo(x + 9, top + 6.5); ctx.lineTo(x + 1, top + 10);
      ctx.closePath(); ctx.fill();
      // 名称胶囊：距前旗名称太近（<20px）或被后旗顶住 → 只画旗点（名称走 title/跳转/改名可见）
      const nameW = ctx.measureText(tag.name).width;
      const maxW = Math.min(nextX - x - 14, this.W - x - 2);
      let delX = x + 11;
      if (nameW > 0 && x - lastEnd >= 20 && nameW <= maxW) {
        ctx.fillStyle = 'rgba(56,189,248,.16)';
        ctx.fillRect(x + 3, top + 2, nameW + 8, TAG_LANE_H - 5);
        ctx.fillStyle = '#dbeafe';
        ctx.fillText(tag.name, x + 7, top + TAG_LANE_H / 2 + .5);
        delX = x + nameW + 13;
        lastEnd = x + nameW + 10;
      } else {
        lastEnd = Math.max(lastEnd, x + 6);
      }
      // 悬停/点选 ×（拖拽中不显，防误删）：hover 或 active 保持可见——鼠标移向 × 时
      // 已离旗点 hover 区（× 在名称末端），靠几何命中维持 hover 不消失（见 _tagGeomHit）
      if ((hovered || this.activeTag === tag.id) && this.drag?.kind !== 'tag') {
        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('×', delX, top + TAG_LANE_H / 2 + .5);
        ctx.font = '10px sans-serif';
      }
      this._tagGeom.set(tag.id, { x, delX });
    }
    ctx.restore();
  }
  // ---------- 节奏划分轨（音乐模式专用呈示，§2.2.1；编舞 tag 道走 drawTags 不变） ----------
  // 段呈示 = 色块（4 色循环，tag.color 覆盖）+ 名称胶囊 + 段界强色线；旗点/×/单击跳转等
  // tag 交互沿用既有几何（IR-W1-4「现手势不变」）；首 tag 前的区间=未划分灰底。
  drawSegLane(ctx, p) {
    const H = SEG_LANE_H_MUSIC;
    const top = this.rulerH ?? TL_RULER_H;
    const pps = this.ppsOf(p);
    this._tagGeom = new Map();
    this._segGeom = [];
    const COLORS = MusicTimeline.SEG_COLORS;
    const { segs } = sectionSegmentsOf(p);
    ctx.save();
    ctx.fillStyle = 'rgba(148,163,184,.07)';
    ctx.fillRect(0, top, this.W, H);
    ctx.strokeStyle = 'rgba(148,163,184,.22)';
    ctx.beginPath(); ctx.moveTo(0, top + H + .5); ctx.lineTo(this.W, top + H + .5); ctx.stroke();
    ctx.font = '10px sans-serif'; ctx.textBaseline = 'middle';
    let lastEnd = -1e9; // 前一名称胶囊右缘（防重叠贪心）
    for (let k = 0; k < segs.length; k++) {
      const s = segs[k];
      const x0 = Math.max(0, beatToSec(p, s.start) * pps);
      const x1 = Math.min(this.W, beatToSec(p, s.end) * pps);
      if (x1 <= 0 || x0 >= this.W) { this._segGeom.push({ id: s.tag.id, x0, x1 }); continue; }
      const ci = ((s.tag.color ?? k) % COLORS.length + COLORS.length) % COLORS.length;
      const color = COLORS[ci];
      const hovered = this.hoverSegId === s.tag.id;
      const selected = this.selSegId === s.tag.id;
      // 色块
      ctx.fillStyle = hexA(color, hovered ? .30 : .16);
      ctx.fillRect(x0, top + 1, Math.max(1, x1 - x0), H - 2);
      // 选中段高亮描边
      if (selected) {
        ctx.strokeStyle = color; ctx.lineWidth = 1.5;
        ctx.strokeRect(x0 + .75, top + 1.75, Math.max(1, x1 - x0) - 1.5, H - 3.5);
        ctx.lineWidth = 1;
      }
      // 段界强色线（粗于普通拍线的 2px 竖线）+ 旗面（打点现旗，IR-W1-4）
      const bx = Math.max(1, Math.min(this.W - 1, x0));
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bx, top + 2); ctx.lineTo(bx, top + H - 2); ctx.stroke();
      ctx.fillStyle = hovered ? '#7dd3fc' : color;
      ctx.beginPath();
      ctx.moveTo(bx + 1, top + 3); ctx.lineTo(bx + 8, top + 6.5); ctx.lineTo(bx + 1, top + 10);
      ctx.closePath(); ctx.fill();
      ctx.lineWidth = 1;
      // 名称胶囊（放段内、旗右侧；空间不足/与前一胶囊过近 → 省略，名称走 title/跳转/改名可见）
      const name = s.tag.name;
      const nameW = ctx.measureText(name).width;
      const capX = bx + 10;
      let delX = bx + 11;
      if (nameW > 0 && capX - lastEnd >= 4 && capX + nameW + 8 <= x1 - 2 && capX < this.W - 2) {
        ctx.fillStyle = hexA(color, .22);
        ctx.fillRect(capX, top + H / 2 - 7, nameW + 8, 14);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(name, capX + 4, top + H / 2 + .5);
        delX = capX + nameW + 12;
        lastEnd = capX + nameW + 10;
      }
      // 悬停/点选 ×（拖拽中不显，防误删）——同 tag 道语义
      if ((hovered || this.activeTag === s.tag.id) && this.drag?.kind !== 'tag') {
        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('×', delX, top + H / 2 + .5);
        ctx.font = '10px sans-serif';
      }
      this._tagGeom.set(s.tag.id, { x: bx, delX });
      this._segGeom.push({ id: s.tag.id, x0, x1 });
    }
    ctx.restore();
  }
  // 段界拖拽的小节线吸附（§2.2.1 拖段边界）：拍位就近吸到 bpb 整数倍（容差=磁吸像素阈值）；
  // 磁吸关（S）时不吸。返回 [吸附后拍位, 是否吸附]。
  snapTagBeatToBar(beat) {
    const p = this.hooks.getProject();
    if (!p || !this.snapOn) return [beat, false];
    const bpb = p.audio.beatsPerBar || 4;
    const tolBeats = SNAP_TOL_PX / (this.ppsOf(p) * spb(p));
    const snapped = Math.round(beat / bpb) * bpb;
    return Math.abs(snapped - beat) <= tolBeats ? [Math.max(0, snapped), true] : [beat, false];
  }
  tagAt(x) { // 旗点命中（±9px，取最近）；y 分区由调用方判定
    const p = this.hooks.getProject();
    if (!p) return null;
    const pps = this.ppsOf(p);
    let best = null;
    for (const tag of p.timeline.tags || []) {
      const tx = beatToSec(p, tag.beat) * pps;
      const d = Math.abs(x - tx);
      if (d <= 9 && (!best || d < best.d)) best = { tag, x: tx, d };
    }
    return best;
  }
  _tagGeomHit(x, tol = 6) { // × 落笔几何命中 → tag id（× 在名称末端，与旗点位置解耦）
    for (const [id, g] of this._tagGeom) if (Math.abs(x - g.delX) <= tol) return id;
    return null;
  }
  inTagLane(y) { return y > (this.rulerH ?? TL_RULER_H) && y <= (this.rulerH ?? TL_RULER_H) + this.segLaneH(); }
  segAt(x) { // 段命中（音乐模式）：拍位落在哪个段区间 → 段（含段起点 tag）
    const p = this.hooks.getProject();
    if (!p) return null;
    const beat = this.xToBeat(x);
    const { segs } = sectionSegmentsOf(p);
    return segs.find(s => beat >= s.start && beat < s.end) || null;
  }
  _tagTitle(x, y) { // 原生 title：旗点=名称+拍位；×=删除
    if (!this.inTagLane(y)) { if (this.cv.title) this.cv.title = ''; return; }
    const p = this.hooks.getProject();
    const delId = this._tagGeomHit(x, 6);
    if (delId) {
      const t = tagById(p, delId);
      if (t) { this.cv.title = `删除标记「${t.name}」`; return; }
    }
    const hit = this.tagAt(x);
    if (hit) this.cv.title = this.mode === 'music'

    const p = this.hooks.getProject();

// ---------- 通用右键菜单（音频剪辑用；与 .unit-menu 同风格，fixed 定位跟光标） ----------
function showContextMenu(items, { x, y, id = '' } = {}) {
  // items: [{ label, fn, danger?, sep? }]；{ sep: true } 为分隔线
  closeContextMenu();
  const menu = h('div', { class: 'unit-menu', id: id || 'clip-ctx-menu' });
  for (const it of items) {
    if (it.sep) { menu.append(h('div', { style: 'border-top:1px solid var(--line);margin:2px 0' })); continue; }
    if (it.el) { menu.append(it.el); continue; }
    const b = h('button', { class: 'um-btn' }, it.label);
    if (it.danger) b.style.color = '#ef4444';
    b.addEventListener('click', () => { closeContextMenu(); it.fn?.(); });
    menu.append(b);
  }
  menu.style.position = 'fixed';
  menu.style.zIndex = '150';
  document.body.append(menu);
  const dismiss = ev => { if (!menu.contains(ev.target)) closeContextMenu(); };
  const keyClose = ev => { if (ev.key === 'Escape') closeContextMenu(); };
  document.addEventListener('pointerdown', dismiss, true);
  document.addEventListener('keydown', keyClose, true);
  ctxMenuCleanup = () => {
    menu.remove();
    document.removeEventListener('pointerdown', dismiss, true);
    document.removeEventListener('keydown', keyClose, true);
  };
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 4)) + 'px';
  menu.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 4)) + 'px';
}
let ctxMenuCleanup = null;
function closeContextMenu() {
  if (ctxMenuCleanup) { ctxMenuCleanup(); ctxMenuCleanup = null; }
}

function renderLibrary(container, { projects, onOpen, onNew, onDelete, onDuplicate }) {
  const grid = document.getElementById('library-grid');

  closeLibCardMenu(); // 重渲染（打开/复制/删除后）时收走残留菜单
  grid.innerHTML = '';
  empty.hidden = projects.length > 0;
  for (const p of projects) {
    const cv = h('canvas', { width: 440, height: Math.round(440 * p.stage.depthM / p.stage.widthM) });
    const f0 = p.formations[0];
    if (f0) drawScene(cv.getContext('2d'), { x: 0, y: 0, w: cv.width, h: cv.height }, p, f0.positions, { minimal: true, pad: 10, merges: f0.merges || [] });
    const card = h('div', { class: 'lib-card' },
      cv,
      h('div', { class: 'lc-body' },
        h('div', { class: 'lc-title' }, p.meta.title || '未命名'),
        h('div', { class: 'lc-meta' },
          h('span', {}, `${p.dancers.length}人 · ${p.formations.length}队形`),
          h('span', {}, fmtDate(p.meta.updatedAt))),
        h('div', { class: 'lc-meta' },
          ...(p.audio?.name ? [h('span', {}, iconEl('music'), ' ' + p.audio.name)] : [h('span', {}, '无音乐')]),
          h('button', { class: 'lc-del', title: '删除项目', 'aria-label': '删除项目', onclick: e => { e.stopPropagation(); onDelete(p); } }, iconEl('trash')))));

    });
    grid.append(card);
  }
}

function showNewProjectModal(onCreate) {
  const title = h('input', { type: 'text', value: '未命名队列舞', style: 'width:100%' });
  const PRESET_PAIRS = { std6: 6, merged6: 6, merged8: 8 }; // 预设 → 固定对数（custom 才可编辑）
  const preset = h('select', { style: 'width:160px' },
    h('option', { value: 'std6' }, '标准 · 6 对（独立）'),
    h('option', { value: 'merged6' }, '6 对 · 已组合'),
    h('option', { value: 'merged8' }, '8 对 · 已组合'),
    h('option', { value: 'custom' }, '自定义'));
  const pairs = h('input', { type: 'number', min: '0', max: '30', value: '6', style: 'width:80px' });
  const extraM = h('input', { type: 'number', min: '0', max: '30', value: '0', style: 'width:80px' });
  const extraF = h('input', { type: 'number', min: '0', max: '30', value: '0', style: 'width:80px' });
  const grouping = h('select', { style: 'width:120px' },
    h('option', { value: 'gender' }, '男士 / 女士'),
    h('option', { value: 'none' }, '不分组'));
  const applyPreset = () => {
    if (preset.value === 'custom') { pairs.disabled = false; return; }
    pairs.value = String(PRESET_PAIRS[preset.value] ?? 6);
    pairs.disabled = true;
  };
  preset.addEventListener('change', applyPreset);
  applyPreset(); // 默认 std6：对数=6 且不可编辑
  const body = h('div', {},
    h('div', { class: 'prop-row' }, h('label', {}, '项目名称'), title),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '初始方案'), preset),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '对数（男女各半）'), pairs),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '额外男舞者'), extraM),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '额外女舞者'), extraF),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '初始编组'), grouping),
    h('p', { class: 'dim', style: 'margin-top:10px' }, '先建好名单进入编辑器，之后可随时在「名册」中增删舞者、加入编组。「已组合」方案会把每对男女合并为一个单元建档，之后可随时拆开。'));
  const m = modal('新建项目', body, [
    h('button', { class: 'btn primary', onclick: () => {
      onCreate({
        title: title.value.trim() || '未命名队列舞',
        pairs: Math.max(0, +pairs.value || 0),
        extraM: Math.max(0, +extraM.value || 0),
        extraF: Math.max(0, +extraF.value || 0),
        grouping: grouping.value,
        presetMerged: preset.value === 'merged6' || preset.value === 'merged8',
      });
      m.close();
    } }, '创建'),
  ]);
  title.focus(); title.select();
}

      // 编组 chips：每枚可点 = 加入/移出该组（一名舞者可属多组）

          return h('button', { class: 'chip' + (inG ? ' chip-on' : ''), title: `${inG ? '移出' : '加入'}「${g.name}」`, onclick: () => {
            mutate(p => {

          tb),
        h('div', { style: 'display:flex;gap:6px;margin-top:8px' },
          h('button', { class: 'btn small', onclick: () => { mutate(p => { M.addDancer(p, `舞者${p.dancers.length + 1}`, 'X'); }, '添加舞者'); render(); } }, '＋ 单人'),

        !project.dancers.length ? h('div', { class: 'dim', style: 'margin-top:6px' }, '名单为空：点「＋ 单人」添加舞者。') : null,
        groups.length ? h('div', { class: 'dim', style: 'margin-top:8px' }, `编组：${groups.map(g => `${g.name}(${g.memberIds.length})`).join('、')}。点击每行编组芯片加入/移出，一名舞者可属多组。`) : null));
  };
  render();
  // 撤销/重做会替换 project 对象：引用变化时重渲染弹窗；关闭时退订
  let unsub = null;
  if (getProject) {
    let lastProj = getProject();
    unsub = subscribe(() => {
      const np = getProject();
      if (np && np !== lastProj) { lastProj = np; render(); }
    });
  }
  const m = modal('名册 · 舞者与编组', wrap, [], { onClose: () => unsub?.() });
  return m;
}

  // 本就直接发 unit 载荷；此处再按 ids[0] 是否在当前队形 merges 中兜底，保证
  // 「context+无 merge=仅删除 / context+有 merge=单元按钮组」与合并状态一致。
  const ctxMerge = payload.mode === 'context'
    ? (currentFormation()?.merges || []).find(x => x.a === payload.ids[0] || x.b === payload.ids[0]) || null
    : null;
  if (ctxMerge && payload.ids.length < 2) {
    payload.ids = [ctxMerge.a, ctxMerge.b]; // 补全另一成员 id：样式/拆开按钮的模型操作需要两人
    payload.style = ctxMerge.style;         // 当前样式高亮与 unit 菜单一致
  }
  if (payload.mode === 'merge') {
    const title = document.createElement('div');
    title.className = 'um-title';
    title.textContent = '合并为单元';
    el.append(title);
  } else if (payload.mode === 'multi') {
    const title = document.createElement('div');
    title.className = 'um-title';
    title.textContent = `所选 ${payload.ids.length} 人`;
    el.append(title);
  } else if (payload.mode === 'context' && !ctxMerge) {
    // 未合并舞者的上下文菜单（触摸/笔长按、鼠标右键共用）：仅「删除」
    const d = M.dancerById(store.getState().project, payload.ids[0]);
    const title = document.createElement('div');
    title.className = 'um-title';
    title.textContent = `舞者 · ${d ? d.name : '?'}`;
    el.append(title);
    el.append(mkDeleteBtn());
  } else {
    const title = document.createElement('div');
    title.className = 'um-title';
    title.textContent = '合并单元';
    el.append(title);
  }
  // 样式按钮（合并确认时点击即以该样式创建；单元操作时切换样式）
  const mkStyleBtn = sty => {
    const b = document.createElement('button');
    b.className = 'um-btn' + (payload.style === sty ? ' um-cur' : '');
    b.textContent = UNIT_STYLE_LABEL[sty] || sty;
    b.addEventListener('click', () => {
      if (payload.mode === 'merge') {
        store.mutate(p => {
          const f = p.formations[store.getState().formationIndex];
          if (!f) return;
          M.addMerge(f, payload.ids[0], payload.ids[1], sty);
          M.collapseUnit(f, payload.ids[0], payload.ids[1]);
        }, '合并单元');
      } else {
        store.mutate(q => { M.setMergeStyle(q.formations[store.getState().formationIndex], payload.ids[0], payload.ids[1], sty); }, '切换单元样式');
      }
      hideUnitMenu();
    });
    return b;
  };
  // 拆分按钮（即既有「拆开」入口，规格 #9：移除 merge 记录、两人原地保留）：
  // 按钮文案保持「拆开」——L2 仪器 page-l2 以文本匹配点击该按钮，改名留给 reviewer 同步
  const mkUntieBtn = () => {
    const untie = document.createElement('button');
    untie.className = 'um-btn';
    untie.innerHTML = iconHtml('razor') + ' 拆开'; // 图标化（决策⑤）：razor+文字，仪器按文本「拆开」匹配
    untie.addEventListener('click', () => {
      store.mutate(q => { M.removeMerge(q.formations[store.getState().formationIndex], payload.ids[0], payload.ids[1]); }, '拆开单元');
      // 拆开后两人成为独立舞者：清掉原单元选择，避免下一次拖动走组拖路径（拆开→各自拖动）
      store.setUI({ selection: store.getState().selection.filter(id => !payload.ids.includes(id)) });
      hideUnitMenu();
    });
    return untie;
  };
  // 多选菜单按钮（mode='multi'，round23 需求 1）：操作对象=整个 selection（N=展开单元后人数）。
  // 恰选 2 人且未合并 → 「合并为单元」（capsule 建单元，与面板按钮同语义）；
  // 涉及合并单元 → 「取消合并」（拆开所有涉及单元，成员原地保留，涉及成员移出选择防组拖残留）；
  // 「删除所选（N 人）」恒可用（替代单人「删除」）。样式按钮不在此出现——恰选一个单元时
  // 状态机已分流到既有单元浮窗（样式按钮唯一出现处）。
  const mkMultiMergeBtn = () => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.textContent = '合并为单元';
    b.addEventListener('click', () => {
      store.mutate(p => {
        const f = p.formations[store.getState().formationIndex];
        if (!f) return;
        M.addMerge(f, payload.ids[0], payload.ids[1], 'capsule');
        M.collapseUnit(f, payload.ids[0], payload.ids[1]);
      }, '合并单元');
      hideUnitMenu();
    });
    return b;
  };
  const mkMultiUntieBtn = involved => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.innerHTML = iconHtml('razor') + ' 取消合并';
    b.addEventListener('click', () => {
      store.mutate(p => {
        const f = p.formations[store.getState().formationIndex];
        for (const m of involved) M.removeMerge(f, m.a, m.b);
      }, '取消合并');
      const touched = new Set(involved.flatMap(m => [m.a, m.b]));
      store.setUI({ selection: store.getState().selection.filter(id => !touched.has(id)) });
      hideUnitMenu();
    });
    return b;
  };
  const mkMultiDeleteBtn = n => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.textContent = `删除所选（${n} 人）`;
    b.style.color = '#ef4444'; // 危险动作着色（同单人删除）
    b.addEventListener('click', () => {
      store.mutate(p => { for (const id of payload.ids) M.removeDancer(p, id); }, `删除所选（${n} 人）`);
      store.setUI({ selection: store.getState().selection.filter(id => !payload.ids.includes(id)) });
      hideUnitMenu();
    });
    return b;
  };
  // ---- SelectionMenu 群体项（round46·决策④）：与单人 .unit-menu 同骨架（.um-row/.um-btn），
  //      操作对象=整个 selection（单元原子展开后的 payload.ids）----
  // 朝向 ▸（观众/圆心复用 shapes.faceAll；「互相对齐」仅恰 2 人：各自面向对方）
  const mkFacingRow = ids => {
    const row = document.createElement('div');
    row.className = 'um-row';
    const mk = (label, target) => {
      const b = document.createElement('button');
      b.className = 'um-btn';
      b.textContent = label;
      b.title = target === 'eachOther' ? '两人各自面向对方' : '对所选全部舞者统一朝向';
      b.addEventListener('click', () => {
        store.mutate(p => {
          const f = p.formations[store.getState().formationIndex];
          if (!f) return;
          if (target === 'eachOther') {
            const [a, bb] = ids;
            const pa = f.positions[a], pb = f.positions[bb];
            if (pa && pb) { pa.facing = Math.round(shapes.angleTo(pa, pb)); pb.facing = Math.round(shapes.angleTo(pb, pa)); }
          } else {
            shapes.faceAll(f.positions, ids, target, { stage: p.stage });
          }
        }, target === 'eachOther' ? '互相对齐' : '统一朝向');
        hideUnitMenu();
      });
      return b;
    };
    row.append(h('span', { class: 'um-lab' }, '朝向'), mk('面向观众', 'audience'), mk('面向圆心', 'center'));
    if (ids.length === 2) row.append(mk('互相对齐', 'eachOther'));
    return row;
  };
  // 存为编组（与「＋ 存为编组」/Ctrl+N 自动命名路径同语义：createGroup，不覆盖既有组）
  const mkSaveGroupBtn = ids => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.textContent = `存为编组（${ids.length} 人）`;
    b.addEventListener('click', () => {
      let gname = '';
      store.mutate(p => { p.groups = p.groups || []; gname = M.createGroup(p, ids).name; }, '存为编组');
      toast(`已存为编组「${gname}」(${ids.length} 人)`);
      hideUnitMenu();
    });
    return b;
  };
  // 均布（N≥3）：纵/横双钮（模型语义 <3 人无效果，不呈示死入口；与工具栏「均布」同 shapes.distributeAxis）
  const mkDistributeRow = ids => {
    const row = document.createElement('div');
    row.className = 'um-row';
    const mk = (label, axis) => {
      const b = document.createElement('button');
      b.className = 'um-btn';
      b.textContent = label;
      b.title = axis === 'y' ? '按纵向（前后）等间距排开' : '按横向（左右）等间距排开';
      b.addEventListener('click', () => {
        store.mutate(p => {
          const f = p.formations[store.getState().formationIndex];
          shapes.distributeAxis(f.positions, ids, axis);
        }, '等间距');
        hideUnitMenu();
      });
      return b;
    };
    row.append(h('span', { class: 'um-lab' }, '均布'), mk('纵', 'y'), mk('横', 'x'));
    return row;
  };
  // 移出队形（=Del 键同语义：从当前队形清位，名册保留、可撤销）
  const mkRemoveBtn = ids => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.textContent = `移出队形（${ids.length} 人）`;
    b.title = '从当前队形清位（名册保留；Del 键同语义）';
    b.addEventListener('click', () => {
      store.mutate(p => {
        const f = p.formations[store.getState().formationIndex];
        for (const id of ids) delete f.positions[id];
      }, '移出队形');
      store.setUI({ selection: store.getState().selection.filter(id => !ids.includes(id)) });
      hideUnitMenu();
    });
    return b;
  };
  // 按钮区按 mode 分支（DEFECT-R-1 根因：原 else 同时覆盖 context 与 unit 两种 mode）：
  // merge → 样式×2；unit → 拆开+样式×2+删除（既有顺序不变）；context+有 merge → 样式×2+拆开+删除；
  // context+无 merge → 标题分支已加「删除」，此处不追加（N=1 特例：保持既有 ['删除','✕'] 构成，
  //   page-r R-02/R-04 仪器精确断言——SelectionMenu 群体项自 N≥2 起，见 selectionMenuSpec 注释）；
  // multi → SelectionMenu（决策④）：朝向▸ → 存为编组 → [合并为单元|取消合并] → [均布 纵/横] →
  //   移出队形 → 删除所选（N 人）。✕ 取消按钮在下方对所有形态统一追加。
  if (payload.mode === 'merge') {
    for (const sty of M.UNIT_STYLES) el.append(mkStyleBtn(sty));
  } else if (payload.mode === 'unit') {
    el.append(mkUntieBtn());
    for (const sty of M.UNIT_STYLES) el.append(mkStyleBtn(sty));
    el.append(mkDeleteBtn()); // 删除单元 = 两名成员一并从队形与名册移除
  } else if (payload.mode === 'multi') {
    const involved = (currentFormation()?.merges || []).filter(m => payload.ids.includes(m.a) || payload.ids.includes(m.b));
    el.append(mkFacingRow(payload.ids));
    el.append(mkSaveGroupBtn(payload.ids));
    if (payload.ids.length === 2 && !involved.length) el.append(mkMultiMergeBtn());
    if (involved.length) el.append(mkMultiUntieBtn(involved));
    if (payload.ids.length >= 3) el.append(mkDistributeRow(payload.ids));
    el.append(mkRemoveBtn(payload.ids));
    el.append(mkMultiDeleteBtn(payload.ids.length));
  } else if (ctxMerge) {
    for (const sty of M.UNIT_STYLES) el.append(mkStyleBtn(sty));
    el.append(mkUntieBtn());
    el.append(mkDeleteBtn());
  }
  const cancel = document.createElement('button');
  cancel.className = 'um-btn um-cancel';
  cancel.innerHTML = iconHtml('close'); // 图标化（决策⑤）：关闭钮呈 ✕ 图标，aria 语义供仪器/读屏
  cancel.setAttribute('aria-label', '关闭');
  cancel.title = '关闭';
  cancel.addEventListener('click', hideUnitMenu);
  el.append(cancel);
  wrap.append(el);
  unitMenuEl = el;
  // 定位并钳制在容器内
  const wr = wrap.getBoundingClientRect();
  el.style.left = Math.max(4, Math.min(payload.screen.x - 40, wr.width - el.offsetWidth - 4)) + 'px';
  el.style.top = Math.max(4, Math.min(payload.screen.y + 10, wr.height - el.offsetHeight - 4)) + 'px';
}

// ---------- history 哨兵（F-04 / UX-04） + 右键策略（F-08 / UX-08） ----------
// 哨兵：进编辑器 pushState 恰一条（决策机在 ui.js，node 可测）；popstate 在编辑器内发生
// =应用内回库（与点「‹ 项目库」完全同语义：stop+closeProject），再次返回才真正离开；
// 前进到哨兵=重开该项目；应用内回库时决策机弹掉哨兵 → 库⇄编辑器往返不堆积条目。
const sentinel = createHistorySentinel({
  push: () => history.pushState({ fs: 'editor', pid: store.getState().projectId }, ''),
  back: () => history.back(),
  state: () => history.state,
});
let sentinelView = null;
function trackViewForSentinel(view) {
  if (view === sentinelView) return;
  const prev = sentinelView;
  sentinelView = view;
  if (view === 'editor' && prev !== 'editor') sentinel.enter();
  else if (view === 'library' && prev === 'editor') sentinel.exitUi();
}
function wireHistory() {
  window.addEventListener('popstate', e => {
    const act = sentinel.onPop(e.state, store.getState().view);
    if (act.action === 'toLibrary') { player?.stop(); store.closeProject(); }
    else if (act.action === 'reopen' && act.pid) {
      store.openProject(act.pid).then(ok => { if (!ok) history.replaceState(null, ''); }); // 项目已被删：摘掉标记防卡死条目
    }
  });
}
// 右键策略：编辑器视图内统一拦截浏览器原生菜单（与画布自定义菜单同一防御面，
// 消除时间轴/播放条/面板的漏拦拼盘）；输入框/文本域/下拉与名册表格豁免（保留系统
// 粘贴/拼写菜单）。项目库视图不在此拦（卡片右键有自己的显性菜单，见 ui.js F-09）。
function wireContextMenu() {
  document.addEventListener('contextmenu', e => {
    if (store.getState().view !== 'editor') return;
    const t = e.target;
    if (t && t.closest && t.closest('input, textarea, select, .roster-table')) return;
    e.preventDefault();
  });
}

// ---------- Phase 4 · 深链导入（docs/choreo-skill-plan.md Phase 4，与 skill 线 publish.mjs 的契约） ----------
// 契约 URL：GET /apps/wuzhen/index.html?import=<encodeURIComponent(项目 JSON 的 URL)>
// 行为：boot（store init 完成后）解析 import 参数 → fetch（仅同源 http / 任意 https，见
// resolveImportUrl）→ JSON → M.validateProject → store.importProject（新建 id、标题加「（副本）」，
// 不覆盖既有项目）→ history.replaceState 剥掉 import 参数（防刷新重导入）→ toast「已导入项目 X」。
// 显式深链优先于 lastProject 自动恢复（深链在 init 之后执行、整体覆盖状态）；失败路径 toast 明确
// 错误并正常进应用既有视图，不 crash、无未捕获异常（本函数全部错误都在内部转成结果对象）。
// SW 侧配套：dist/sw.js 对导航请求 cache.match(..., {ignoreSearch:true}) + './' 回退——带 query
// 的深链在断网时也能打开（scripts/build-single.mjs swSource）。
// 纯函数 + 依赖注入（fetchImpl/validate/importProject/toast/replaceState），node 可测。
function parseImportParam(hrefOrSearch) {
  if (typeof hrefOrSearch !== 'string' || !hrefOrSearch) return null;
  const qi = hrefOrSearch.indexOf('?');
  if (qi === -1) return null;
  let search = hrefOrSearch.slice(qi);
  const hi = search.indexOf('#');
  if (hi !== -1) search = search.slice(0, hi); // hash 不属于 query 值
  try {
    const v = new URLSearchParams(search).get('import');
    return v && v.trim() ? v : null;
  } catch { return null; }
}
function stripImportParam(href) { // 只摘 import 参数，其余 query/hash 原样保留
  if (typeof href !== 'string' || !href) return href;
  const hi = href.indexOf('#');
  const hash = hi === -1 ? '' : href.slice(hi);
  const noHash = hi === -1 ? href : href.slice(0, hi);
  const qi = noHash.indexOf('?');
  if (qi === -1) return href;
  let sp;
  try { sp = new URLSearchParams(noHash.slice(qi)); } catch { return href; }
  if (!sp.has('import')) return href;
  sp.delete('import');
  const rest = sp.toString();
  let head = noHash.slice(0, qi);
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(head)) { // 绝对 URL → 同文档相对形态（pathname 起，replaceState 更稳）
    try { head = new URL(head).pathname; } catch {}
  }
  return head + (rest ? '?' + rest : '') + hash;
}
function resolveImportUrl(raw, baseUrl) { // 仅 https（任意 host）或 http 同源；其余拒绝
  try {
    const u = new URL(raw, baseUrl || undefined);
    if (u.protocol === 'https:') return u;
    if (u.protocol === 'http:') {
      const origin = (typeof location !== 'undefined' && location.origin) || (baseUrl ? new URL(baseUrl).origin : '');
      if (origin && u.origin === origin) return u;
    }
    return null;
  } catch { return null; }
}
async function runDeeplinkImport(deps) {
  const url = typeof deps.url === 'string' ? deps.url : '';
  const raw = parseImportParam(url);
  if (raw == null) return { status: 'none' };
  const cleaned = stripImportParam(url);
  const done = res => {
    try { deps.replaceState?.(cleaned); } catch {} // 成败都清参：刷新不再重导入/重报错
    if (res.status === 'error' && res.message) deps.toast?.(res.message);
    return res;
  };
  const u = resolveImportUrl(raw, deps.baseUrl || url);
  if (!u) return done({ status: 'error', reason: 'scheme', message: '深链导入失败：项目文件地址仅支持同源或 https' });
  let resp;
  try { resp = await deps.fetchImpl(u.href, { redirect: 'follow' }); }
  catch (e) { return done({ status: 'error', reason: 'network', message: `深链导入失败：无法获取项目文件（${e?.message || '网络异常'}）` }); }
  if (!resp.ok) return done({ status: 'error', reason: 'http', httpStatus: resp.status, message: `深链导入失败：项目文件无法获取（HTTP ${resp.status}）` });
  let json;
  try { json = JSON.parse(await resp.text()); }
  catch { return done({ status: 'error', reason: 'parse', message: '深链导入失败：文件不是合法 JSON' }); }
  // v2 项目文件可内嵌音乐：v3 多资产（media.assets[i].dataBase64）+ 旧单音频（audio.dataBase64）。
  // validateProject 会剥离内嵌字段，先还原为 Blob，导入后回填。
  let audioBlob = null;
  const assetBlobs = [];
  try {
    for (const a of (json?.media?.assets || [])) {
      if (a && a.dataBase64) {
        const bin = atob(String(a.dataBase64));
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        assetBlobs.push({ id: typeof a.id === 'string' ? a.id : null, name: String(a.name || 'audio'), blob: new Blob([bytes], { type: a.dataFormat || 'audio/mpeg' }) });
        delete a.dataBase64;
        delete a.dataFormat;
      }
    }
    if (json && json.audio && json.audio.dataBase64) {
      const bin = atob(String(json.audio.dataBase64));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      audioBlob = new Blob([bytes], { type: json.audio.dataFormat || 'audio/mpeg' });
      delete json.audio.dataBase64;
      delete json.audio.dataFormat;
    }
  } catch { audioBlob = audioBlob || null; }
  const r = deps.validate(json);
  if (!r.ok) return done({ status: 'error', reason: 'validate', errors: r.errors, message: `深链导入失败：${r.errors[0] || '项目校验未通过'}` });
  deps.importProject(r.project);
  if (assetBlobs.length) {
    try { await deps.onAssets?.(assetBlobs, r.project); } catch {}
  }
  if (audioBlob) { try { await deps.onAudio?.(audioBlob); } catch {} }
  const title = r.project.meta.title || '导入项目';
  const restored = assetBlobs.length ? true : !!audioBlob;
  deps.toast?.(`已导入项目：${title}${restored ? '（音乐已恢复）' : ''}`);
  return done({ status: 'imported', title, hasAudio: restored, project: r.project });
}
async function wireDeeplinkImport() {
  try {
    await runDeeplinkImport({
      url: location.href,
      baseUrl: location.href,
      fetchImpl: (u, o) => fetch(u, o),
      validate: M.validateProject,
      importProject: p => { player?.stop(); store.importProject(p); },
      onAssets: assetBlobs => restoreProjectAudio(assetBlobs, null), // v3 多资产内嵌回填（id 保持）
      onAudio: async blob => { // 与「导入项目文件…」同语义：内嵌音乐回填到新项目 id
        await restoreProjectAudio([], blob);
      },
      toast,
      replaceState: cleaned => history.replaceState(null, '', cleaned),
    });
  } catch (e) {
    console.error('深链导入异常', e);
    toast('深链导入失败：应用内部错误');
  }
}

// ---------- 启动 ----------
// E2E 就绪信号（确定性完成信号，替代 boot 盲等）：boot 全流程（store init + lastProject 恢复
// + 深链 + 首帧渲染 + 订阅挂载）完成后 resolve；消费方重复读取返回同一 Promise；

function buildPlayer() {
  player = new Player({
    audio,
    getProject: () => store.getState().project,
    onTick: t => {
      const proj0 = store.getState().project;

      if (!player.countin) $('pb-pos').textContent = proj0 ? M.beatLabel(proj0, t.beat) : '—';
      const f = store.getState().project?.formations[t.formationIndex];
      $('pb-formation').textContent = f ? `${t.formationIndex + 1}. ${f.name}` : '';
      // 真实播放中高亮跟随节拍；切帧预览/seek 不抢占用户选择的队形
      if (player.playing && !player.previewing && store.getState().formationIndex !== t.formationIndex) {

      }
      stageView?.requestDraw();

      drawMusicPreview(); // W1：preview 栏随播放头同步（formationIndex 高亮 + 当前块信息，IR-W1-5）

      if (reason === 'audio') toast('音乐已结束');

    },

// ---- v3：时间选区临时循环 / clip 循环预览 ----
function applyTimeSelLoop(range) {
  if (!player) return;
  const p = store.getState().project;
  if (!p) return;
  if (range && range.end - range.start > 0.05) {
    player.setLoop(true, Math.max(0, M.secToBeat(p, range.start)), Math.max(0, M.secToBeat(p, range.end)));
  } else if ($('pb-loop')?.checked) updateLoop();
  else player.setLoop(false, 0, 0);
}
function previewClip(clip) {
  if (!clip) return;
  player.pause();
  const p = store.getState().project;
  if (!p) return;
  const b0 = Math.max(0, M.secToBeat(p, clip.timelineStartSec));
  const b1 = Math.max(b0 + 0.01, M.secToBeat(p, clipEnd(clip)));
  player.setLoop(true, b0, b1);
  player.play(b0, { countIn: false });
  toast(`循环预览「${clip.name || '音频剪辑'}」——停止后恢复循环设置`);
}

// 手动切换队形帧：更新选中；若开启切帧预览，播放一段纯舞台 UI 动画（不经播放引擎、不动播放头/时间线）
function switchFormation(i) {
  player.pause(); // 无条件暂停（同时取消进行中的数拍入场）
  const s = store.getState();
  const changed = i !== s.formationIndex;
  // DEFECT-L2-2：getState() 是活引用，setUI 会原地覆盖 formationIndex——动画端点必须
  // 在 setUI 前暂存（from=切换前帧、to=目标帧，前后切换双向皆然），否则 from===to。
  const fromF = s.project?.formations[s.formationIndex] || null;
  const toF = s.project?.formations[i] || null;
  const { previewOnSwitch: previewOn, editMode } = s;
  store.setUI({ formationIndex: i, selection: [] });
  if (!editMode && player.beat > 0.001) player.seekFormation(i); // 查看模式：切换帧时播放头跟随所选队形
  if (changed && previewOn) {
    // 双向过渡动画：从切换前的帧插值到目标帧（此前只有向后切才播动画）
    stageView.startPositionsPreview(fromF, toF, 700);
  }
}
async function addFormation(after = null) {
  player.pause();
  const s = store.getState();
  const idx = after ?? s.formationIndex;
  const prevPos = M.clone(s.project.formations[idx]?.positions || {});
  store.mutate(p => { M.createFormationFrom(p, idx); }, '新队形');
  const ni = store.getState().formationIndex + 1;
  store.setUI({ formationIndex: ni, selection: [] });
  if (s.previewOnSwitch && ni > 0) {
    // 新帧动效：从上一帧流动到新帧（动线靠插入中间帧表达）
    const pf = store.getState().project;
    stageView.startPositionsPreview(pf.formations[ni - 1] || pf.formations[ni], pf.formations[ni], 700);
  }
}
function deleteFormation() {
  player.pause(); // 停掉进行中的预览/播放，避免 _stopAt 指向已删除的段
  const s = store.getState();
  if (s.project.formations.length <= 1) { toast('至少保留一个队形'); return; }
  store.mutate(p => { M.deleteFormation(p, s.formationIndex); }, '删除队形');
  store.setUI({ formationIndex: Math.max(0, Math.min(s.formationIndex, s.project.formations.length - 1)), selection: [] });
}
