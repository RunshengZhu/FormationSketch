/* Formation Studio · 移动优先 + 桌面断点 · 深浅双主题 */
:root{ /* 浅色（默认） */
  --bg:#f1f5f9; --bg2:#ffffff; --bg3:#e2e8f0; --line:#cbd5e1;
  --fg:#1e293b; --dim:#64748b; --acc:#0284c7; --acc2:#0284c7;
  --m:#3b82f6; --f:#ec4899; --x:#10b981; --danger:#dc2626;
  --toast-bg:#ffffffd9; --stage-chrome:#dfe6ee;
  --rad:8px; --tb-h:48px; --pb-h:44px;
}
[data-theme="dark"]{
  --bg:#0f172a; --bg2:#1e293b; --bg3:#273449; --line:#334155;
  --fg:#e2e8f0; --dim:#94a3b8; --acc:#38bdf8; --acc2:#0ea5e9;
  --danger:#ef4444;
  --toast-bg:#0b1220ee; --stage-chrome:#0b1220;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* F-03（UX-03）：根滚动器禁用 overscroll 效应——y 向堵 Chrome Android 顶部下拉刷新（PTR=整页重载），
   x 向连带堵触控板/边缘横滑到底的历史导航（M-4）。应用无页面级滚动需求，内部滚容器
   （#formation-list/#props-page/#tl-scroll/弹窗）的自身滚动不受影响。 */
html{overscroll-behavior:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;overflow:hidden}
#app,.view{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
/* F-06（UX-06）：按钮/chip/tab 类禁用浏览器双击缩放（manipulation 保留平移/双指缩放 a11y），
   快速连点 ＋/−、移动 Tab、fi-chip 等不再有双击缩放误触面 */
button,.btn,.ptab,#mobile-tabs button,.fi-chip,.es-chip,.um-btn{touch-action:manipulation}
input,select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input:focus,select:focus{outline:1px solid var(--acc)}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.dim{color:var(--dim);font-size:12px}
.spacer{flex:1}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
[hidden]{display:none !important}

/* ---- 通用控件 ---- */
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:var(--rad);padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg3)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.round{border-radius:50%;width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn.toggled-on{background:var(--bg3);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.ctl{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;white-space:nowrap}
.rot-ctl{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px}
.rot-ctl input[type=range]{width:90px;padding:0}
.dropdown{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad);min-width:200px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:4px}
.dd-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px}
.dd-menu button:hover{background:var(--bg3)}

/* ---- 项目库 ---- */
#library-view{display:flex;flex-direction:column;overflow:auto}
.offline-note{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 16px;font-size:12.5px;color:var(--dim);background:var(--bg3);border-bottom:1px solid var(--line)}
.offline-note-x{border:0;background:none;color:var(--dim);font-size:16px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.offline-note-x:hover{color:var(--fg);background:var(--bg2)}
.lib-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;background:var(--bg);z-index:5}
.lib-brand{font-size:20px;font-weight:700}
.lib-sub{font-size:13px;color:var(--dim);font-weight:400;margin-left:6px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:6px 20px 30px}
.lib-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.lib-card:hover{border-color:var(--acc)}
.lib-card canvas{display:block;width:100%;background:#f8fafc}
.lib-card .lc-body{padding:10px 12px}
.lib-card .lc-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-card .lc-meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px}
.lib-card .lc-del{background:none;border:0;color:var(--dim);padding:2px 4px}
.lib-card .lc-del:hover{color:var(--danger)}
.lib-empty{padding:80px 20px;text-align:center;color:var(--dim)}
.lib-empty-icon{font-size:44px;margin-bottom:8px}

/* ---- 编辑器布局（移动优先） ---- */
#editor-view{display:flex;flex-direction:column}
#topbar{height:var(--tb-h);display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.title-input{background:transparent;border:1px solid transparent;font-weight:600;max-width:280px;min-width:60px}
.title-input:hover,.title-input:focus{background:var(--bg3);border-color:var(--line)}
#editor-main{flex:1;display:flex;min-height:0;position:relative}
#left-panel{display:none;flex-direction:column;width:180px;border-right:1px solid var(--line);background:var(--bg2);flex:none;min-height:0}
.panel-head{padding:10px 12px 6px;font-weight:600;font-size:13px}
.panel-foot{padding:8px;border-top:1px solid var(--line);display:flex;gap:6px}
#formation-list{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:6px}
.f-chip{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px;cursor:pointer;position:relative}
.f-chip.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.f-chip canvas{display:block;width:100%;border-radius:4px;background:#f8fafc}
.f-chip .fc-name{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:12px}
.f-chip .fc-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-chip .fc-bar{color:var(--dim);font-size:11px}
.f-chip .fc-drag{cursor:grab;color:var(--dim)}

/* round23 需求 3：桌面队形列表放大版——chip 铺满 180px 面板，层次（选中/悬停/拖拽把手中态）与主题一致 */
.es-chip{flex:none;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px;cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s}
.es-chip:hover{border-color:var(--acc)}
.es-chip:active{cursor:grabbing}
.es-chip.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 2px 8px rgba(56,189,248,.18)}
.es-chip.active .es-name{color:var(--acc);font-weight:600}
.es-chip.dragging{opacity:.45;border-style:dashed}
/* F-10（UX-10）：触摸长按拖拽排序——lift=拿起态（抬升投影），tshift=让位预览的平移过渡
   （位移本体由 JS 内联 transform 写入；被拿起的 chip 不加 tshift，跟随手指零延迟） */
.es-chip.lift{z-index:6;opacity:.95;border-color:var(--acc);box-shadow:0 10px 24px rgba(0,0,0,.5);cursor:grabbing}
.es-chip.tshift{transition:transform .13s ease-out}
.es-chip canvas{display:block;margin:0 auto;border-radius:4px;background:#f8fafc}
.es-chip .es-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;color:var(--fg)}

#stage-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage-tools{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;flex:none}
#stage-wrap{flex:1;position:relative;min-height:0;overflow:hidden;background:#0b1220}
#stage-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#countin-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:var(--acc);text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}

/* F-11（UX-11/16）：iOS 长按 loupe/文本放大镜与 Android 长按呼出显式抑制；
   编辑面禁文本选择（拖拽跨面零泄露、双击面板不再误选文字），输入控件显式豁免（保留拖选/复制） */
#stage-canvas,#stage-wrap{-webkit-touch-callout:none}
#editor-view{user-select:none;-webkit-user-select:none}
#editor-view input,#editor-view textarea,#editor-view select{user-select:text;-webkit-user-select:text}

#right-panel{display:none;flex-direction:column;width:250px;border-left:1px solid var(--line);background:var(--bg2);flex:none;min-height:0}
.panel-tabs{display:flex;border-bottom:1px solid var(--line)}
.ptab{flex:1;background:none;border:0;padding:9px;color:var(--dim);border-bottom:2px solid transparent}
.ptab.active{color:var(--fg);border-bottom-color:var(--acc)}
.props-page{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.prop-group{border:1px solid var(--line);border-radius:var(--rad);padding:10px;display:flex;flex-direction:column;gap:8px}
.prop-group>.pg-title{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.prop-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.prop-row label{color:var(--dim);font-size:13px;flex:none}
.prop-row input[type=number]{width:70px}
.prop-row input[type=text]{width:100%}
.prop-row input[type=color]{padding:0;width:34px;height:26px}
textarea.note{width:100%;min-height:54px;resize:vertical;background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px}

/* ---- 底部播放条/时间线 ---- */
#bottom-area{border-top:1px solid var(--line);background:var(--bg2);flex:none}
#playbar{height:var(--pb-h);display:flex;align-items:center;gap:8px;padding:0 10px}
#pb-pos{min-width:52px;text-align:center}
#timeline-area{border-top:1px solid var(--line)}
#block-ctl{display:flex;align-items:center;gap:10px;padding:4px 10px;border-bottom:1px dashed var(--bg3);flex-wrap:wrap}
#block-ctl .bc-label{font-size:12px;color:var(--acc);font-weight:600}
#block-ctl .bc-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#block-ctl .bc-val{min-width:70px;text-align:center;display:inline-block;background:var(--bg3);border-radius:6px;padding:2px 6px}
#block-ctl .btn.step{padding:0 9px;line-height:20px;font-size:14px}
#music-strip{display:flex;flex-direction:column}
#audio-disc{border-bottom:1px solid var(--line)}
#audio-disc summary{cursor:pointer;list-style:none;padding:6px 10px;color:var(--dim);font-size:12px;user-select:none}
#audio-disc summary::-webkit-details-marker{display:none}
#audio-disc summary::before{content:'▸ ';}
#audio-disc[open] summary::before{content:'▾ ';}
#audio-panel{display:flex;align-items:center;gap:8px;padding:7px 10px;flex-wrap:wrap}
/* 校准子行（嵌套折叠 details）：默认收起，主行保持对齐编辑动线；展开后独占一行铺开 */
#calib-disc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:100%}
#calib-disc summary{cursor:pointer;list-style:none;color:var(--dim);font-size:12px;user-select:none;white-space:nowrap}
#calib-disc summary::-webkit-details-marker{display:none}
#calib-disc summary::before{content:'▸ ';}
#calib-disc[open] summary::before{content:'▾ ';}
#calib-panel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#tl-scroll{overflow-x:auto;height:150px;position:relative}
#tl-inner{position:relative;height:100%}
#tl-canvas,#tl-overlay{position:absolute;top:0;left:0;height:100%}
/* F-02（UX-02）：时间轴画布禁浏览器手势接管——pan-x 会让块边缘横向拖拽仍被滚动接管
   （横拖主导轴判定），none 才能让 scrub/块拖在触摸端可用；容器横滚改由滚轮/按钮/缩放承担 */
#tl-canvas{touch-action:none}
#tl-overlay{pointer-events:none}

/* ---- 移动端队形索引条 ---- */
#formation-index{display:none}
@media (max-width:1023.5px){
  /* round23 需求 3：索引条重设计——当前帧高亮强化、缩略图按 dpr 清晰呈示、＋/－ 直达；
     水平滚动保留原生惯性（容器未设 touch-action 约束，fi-chip 的 manipulation 亦不阻断 pan-x） */
  #formation-index{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #formation-index::-webkit-scrollbar{display:none}
  .fi-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 5px;transition:border-color .12s,background .12s,box-shadow .12s}
  .fi-chip canvas{display:block;border-radius:5px;background:#f8fafc}
  .fi-num{font-size:11px;font-weight:700;line-height:1;color:var(--dim);font-variant-numeric:tabular-nums}
  .fi-label{max-width:72px;font-size:10px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fi-chip.active{border-color:var(--acc);background:var(--bg3);box-shadow:0 0 0 2px var(--acc),0 2px 10px rgba(56,189,248,.35)}
  .fi-chip.active .fi-num,.fi-chip.active .fi-label{color:var(--acc)}
  .fi-btn{flex:none;width:40px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--acc);font-size:18px;font-weight:600}
  .fi-btn:active{background:var(--bg3)}
  .fi-btn.fi-danger{color:var(--danger)}
}
body[data-mtab="formations"] #formation-index{display:none}
/* 移动端工具收纳：次级工具默认隐藏，点 ⋯ 展开 */
@media (max-width:1023.5px){
  #stage-tools{flex-wrap:nowrap;overflow-x:auto}
}

/* ---- 移动端 Tab ---- */
#mobile-tabs{display:flex;border-top:1px solid var(--line);background:var(--bg2);flex:none}
#mobile-tabs button{flex:1;background:none;border:0;padding:11px 0;color:var(--dim);font-size:13px}
#mobile-tabs button.active{color:var(--acc);font-weight:600}
body[data-mtab="formations"] #left-panel,
body[data-mtab="more"] #right-panel{display:flex;position:absolute;inset:var(--tb-h) 0 0 0;z-index:40;background:var(--bg);width:auto}
body[data-mtab="formations"] #tl-scroll{display:none}

/* ---- 桌面 ---- */
@media (min-width:1024px){
  #mobile-tabs{display:none}
  #left-panel,#right-panel{display:flex !important;position:static;width:180px}
  #right-panel{width:250px}
  #left-panel{width:180px}
  #stage-tools{flex-wrap:nowrap;overflow-x:auto}
}

/* ---- 名册弹窗 ---- */
.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.66);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 12px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.roster-table{width:100%;border-collapse:collapse;font-size:13px}
.roster-table th{color:var(--dim);text-align:left;font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
.roster-table td{padding:3px 6px;border-bottom:1px solid var(--bg3)}
.roster-table input[type=text]{width:100%}
.roster-table select{padding:2px 4px}

/* ---- 编组（RTS 式选择辅助） ---- */
.grp-row{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.grp-row:hover{border-color:var(--acc)}
.grp-row .grp-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.grp-row .grp-ops{display:flex;gap:4px;flex:none}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--dim);white-space:nowrap}
.chip:hover{border-color:var(--acc)}
.chip.chip-on{border-color:var(--acc);color:var(--acc);font-weight:600}
.roster-groups{max-width:190px}
.roster-groups .chip{margin:1px 2px 1px 0}

/* ---- 说明书（manual 页签 + 移动端全屏覆盖层） ---- */
/* 页签：独立 .mtab（不计入 .ptab——E2E 仪器断言既有四页签数量），视觉与 .ptab 平齐；
   5 个页签挤 250px 面板：收窄横向内边距 + .mtab 缩字号防换行裁切 */
.panel-tabs .ptab{padding:9px 0}
.mtab{flex:1.35;background:none;border:0;padding:9px 0;color:var(--dim);border-bottom:2px solid transparent;font-size:11.5px;white-space:nowrap}
.mtab.active{color:var(--fg);border-bottom-color:var(--acc)}
.manual{display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.55}
.manual .man-head .man-ver{display:inline-block;font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.manual .man-head .man-intro{margin:0;color:var(--fg)}
.manual .man-scene{border:1px solid var(--line);border-radius:var(--rad);padding:10px;display:flex;flex-direction:column;gap:6px}
.manual h3{margin:0;font-size:13.5px;color:var(--acc)}
.manual .man-role{margin:0;color:var(--dim);font-size:12px}
.manual .man-steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.manual .man-steps li::marker{color:var(--acc);font-weight:600}
.manual .man-figs{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.manual .man-fig{flex:1 1 110px;min-width:100px;max-width:100%;margin:0}
.manual .man-fig img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg3)}
.manual .man-fig figcaption{font-size:11px;color:var(--dim);margin-top:3px}
.manual .man-table{width:100%;border-collapse:collapse;font-size:11.5px}
.manual .man-table th{color:var(--dim);text-align:left;font-weight:600;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.manual .man-table td{padding:4px;border-bottom:1px solid var(--bg3);vertical-align:top}
.manual .man-table td:first-child{white-space:nowrap;color:var(--dim)}
.manual .man-keys td:first-child{font-variant-numeric:tabular-nums}
.manual .man-note{margin:0;color:var(--dim);font-size:11.5px}
.manual .man-limits{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.manual .man-limits li::marker{color:var(--danger)}
/* 移动端「更多」入口 + 全屏覆盖层 */
.manual-entry{display:none}
#manual-overlay{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column}
.manual-ov-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
.manual-ov-title{font-weight:700}
.manual-ov-body{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
@media (max-width:1023.5px){
  body[data-mtab="more"] .manual-entry{display:block;width:100%;padding:11px 12px;background:var(--bg2);border:0;border-bottom:1px solid var(--line);color:var(--acc);font-weight:600;text-align:left}
}

/* ---- Toast ---- */
#toasts{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--toast-bg);border:1px solid var(--line);border-radius:10px;padding:9px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:toast-in .18s ease-out}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- 移动端紧凑化 ---- */
@media (max-width:1023.5px){
  .hide-mobile{display:none !important}
}
@media (max-width:1023.5px){
  #topbar{gap:4px;padding:0 6px}
  /* DEFECT-L2-3：375px 顶栏放不下版本徽标（~90px），是页面级横向溢出的根源
     （#btn-export right=405>375）；移动端隐藏后其余控件可全部收入视口。
     桌面端（≥1024px）不受影响，G1 门禁的可见版本徽标断言在 1280 宽下照常通过。 */
  #build-tag{display:none}
  .title-input{flex:1 1 40px;min-width:0;width:0;text-align:center;font-size:13px}
  .btn.small{padding:6px 10px} /* 触摸目标 */
  #playbar{gap:5px;padding:0 6px;overflow-x:auto} /* DEFECT-L2-3：375px 下播放条固定内容右缘超宽（节拍器已移出至音乐面板，规则保留防回归），收敛为内部滚动（同 #stage-tools 模式） */
  #pb-formation{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #stage-tools{gap:4px;padding:4px 6px;flex-wrap:nowrap;overflow-x:auto}
  .rot-ctl input[type=range]{width:64px}
  .lc-del{padding:8px}
  #tl-scroll{height:120px}
}

/* ---- 打印页 ---- */
@media print{
  body>*{display:none !important}
}
.print-page{page-break-after:always;text-align:center}
.print-page img{max-width:100%}
.print-page h2{margin:6px 0}
.print-page .p-meta{color:#334155;font-size:13px;margin-bottom:8px;white-space:pre-line}

/* ---- 单元浮窗（合并确认/单元操作） ---- */
.unit-menu{position:absolute;z-index:50;background:var(--bg2);border:1px solid var(--acc);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:150px}
.unit-menu .um-title{font-size:12px;color:var(--dim);font-weight:600}
.unit-menu .um-row{display:flex;gap:4px}
.unit-menu .um-btn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--fg);white-space:nowrap}
.unit-menu .um-btn:hover{border-color:var(--acc);color:var(--acc)}
.unit-menu .um-btn.um-cur{border-color:var(--acc);color:var(--acc);font-weight:600}
.unit-menu .um-btn.um-cancel{border-color:var(--line);color:var(--dim)}

.build-tag{font-size:10px;color:var(--dim);opacity:.7;margin-left:8px;user-select:none}

</style>
</head>
<body>
<div id="app">

  <!-- ===== 项目库视图 ===== -->
  <section id="library-view" class="view" hidden>
    <div id="offline-note" class="offline-note" hidden>
      <span>离线版：项目数据保存在本浏览器（配乐不保留）</span>
      <button id="offline-note-close" class="offline-note-x" aria-label="关闭提示" title="关闭提示">×</button>
    </div>
    <header class="lib-header">
      <div class="lib-brand">舞阵 <span class="lib-sub">WuZhen · 队形编排</span></div>
      <button id="btn-new-project" class="btn primary">＋ 新建项目</button>
    </header>
    <div id="library-grid" class="lib-grid"></div>
    <div id="library-empty" class="lib-empty" hidden>
      <div class="lib-empty-icon">💃</div>

    </div>
  </section>

  <!-- ===== 编辑器视图 ===== -->
  <section id="editor-view" class="view" hidden>
    <header id="topbar">
      <button id="btn-back" class="btn ghost" title="返回项目库">‹ 项目库</button><span id="build-tag" class="build-tag"></span>
      <input id="proj-title" class="title-input" spellcheck="false" title="项目名称">
      <span class="spacer"></span>
      <button id="btn-theme" class="btn ghost" title="切换深色/浅色主题">🌙</button>
      <button id="btn-roster" class="btn ghost" title="舞者与编组名单">名册</button>
      <button id="btn-undo" class="btn ghost" title="撤销 (Ctrl+Z)">↺</button>
      <button id="btn-redo" class="btn ghost" title="重做 (Ctrl+Shift+Z)">↻</button>
      <div class="dropdown" id="export-dd">
        <button id="btn-export" class="btn ghost">导出 ▾</button>
        <div class="dd-menu" hidden>
          <button id="exp-png">当前队形 PNG</button>
          <button id="exp-print">打印 / PDF（全部队形）</button>
          <button id="exp-json-audio">导出项目文件（含音乐）</button>
          <button id="exp-json">导出项目文件（不含音乐）</button>
          <button id="imp-json">导入项目文件…</button>
        </div>
      </div>
    </header>

    <div id="editor-main">
      <!-- 左：队形列表 -->
      <aside id="left-panel">
        <div class="panel-head">队形 <span id="formation-count" class="dim"></span></div>
        <div id="formation-list"></div>
        <div class="panel-foot">
          <button id="btn-add-formation" class="btn primary small">＋ 新队形</button>
          <button id="btn-del-formation" class="btn small">删除</button>
        </div>
      </aside>

      <!-- 中：舞台 -->
      <div id="stage-col">
        <div id="stage-tools">
          <button id="btn-edit-mode" class="btn small toggled-on" title="开启：舞台可拖动编辑；关闭：查看模式（舞台随时间轴播放头联动）">✏ 编辑</button>
          <button id="btn-multi" class="btn small" title="多选模式（触摸端多选入口）：开启后点按舞者=追加选择">☰ 多选</button>
          <span class="vsep"></span>
          <select id="gen-kind" title="队形生成器">
            <option value="">生成队形…</option>
            <option value="rows">多横排</option>
            <option value="line">一字横排</option>
            <option value="columns">纵列</option>
            <option value="circle">圆形</option>
            <option value="arc">弧形</option>
            <option value="v">V 形</option>
            <option value="diagonal">斜线</option>
            <option value="diamond">菱形</option>
          </select>
          <select id="gen-unit" title="编队粒度">
            <option value="dancer">单人</option>
            <option value="men">仅男士</option>
            <option value="women">仅女士</option>
          </select>
          <span class="vsep"></span>
          <button id="btn-mirror-h" class="btn small ghost" title="水平镜像">⇋</button>
          <button id="btn-mirror-v" class="btn small ghost" title="垂直镜像">⇅</button>
          <label class="rot-ctl" title="整体旋转">⟳<input id="rot-slider" type="range" min="-180" max="180" value="0"><span id="rot-val">0°</span></label>
          <button id="btn-distribute" class="btn small ghost" title="所选舞者等间距(竖排间距)">均布</button>
          <button id="btn-swap" class="btn small ghost" title="单元换位（需恰好选中 2 个单元：合并单元或单人）">换位</button>
          <span class="vsep"></span>
          <button id="btn-merge-create" class="btn small ghost" title="将所选两名舞者合并为一个呈示单元（需选中2人）">合并为单元</button>
          <button id="btn-merge-cancel" class="btn small ghost" title="取消所选舞者所在合并单元（两人原地保留）">取消合并</button>
          <span class="vsep"></span>
          <select id="face-target" title="统一朝向">
            <option value="">朝向…</option>
            <option value="audience">面向观众</option>
            <option value="center">面向圆心</option>
          </select>
          <span class="spacer"></span>
          <button id="btn-ghost" class="btn small ghost toggled-on" title="显示前后队形 Ghost">幽灵</button>
          <button id="btn-paths" class="btn small ghost toggled-on" title="显示移动路径">路径</button>
          <button id="btn-switch-anim" class="btn small ghost toggled-on" title="切换队形帧时播放约0.7秒的快速过渡动画（纯界面效果，与时间轴时长无关）">切帧预览</button>
          <button id="btn-fit" class="btn small ghost" title="视图复位">⤢</button>
        </div>
        <div id="formation-index"></div>
        <div id="stage-wrap">
          <canvas id="stage-canvas" title="空白拖动=框选 ｜ 中键拖动或空格+左键拖动=平移（触控板/无中键鼠标无法产生中键时，请用空格+拖动） ｜ 触屏·笔长按空白=框选 ｜ 横向滚轮/触控板横滑=水平平移 ｜ Safari 提示：Cmd+1..9 编组快捷键被浏览器保留，请用右侧编组选项卡"></canvas>
          <div id="countin-overlay" hidden></div>

      </div>

      <!-- 右：属性 -->
      <aside id="right-panel">
        <button id="btn-manual-open" class="manual-entry" title="打开使用说明书（全屏阅读）">📖 使用说明书</button>
        <div class="panel-tabs">
          <button class="ptab active" data-tab="formation">队形</button>
          <button class="ptab" data-tab="stage">舞台</button>

    <!-- 底部：播放条 + 时间线 -->

        <button id="pb-prev" class="btn ghost" title="上一队形">⏮</button>

        <span id="pb-formation" class="dim"></span>
        <span class="spacer"></span>
        <label class="ctl" title="播放速度">速度
          <select id="pb-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        </label>
        <label class="ctl" title="循环当前队形段"><input type="checkbox" id="pb-loop">循环</label>
        <!-- 节拍器已移至「🎵 音乐与节拍」主行（id=pb-metro 不变，接线与仪器兼容） -->
      </div>
      <div id="timeline-area">
        <div id="block-ctl">
          <span class="bc-label">块时长</span>
          <span id="bc-name" class="bc-name dim">—</span>
          <span class="vsep"></span>
          <span class="ctl">保持
            <button id="bc-hold-minus" class="btn small step" title="−1拍">−</button>
            <span id="bc-hold" class="mono bc-val">16拍</span>
            <button id="bc-hold-plus" class="btn small step" title="＋1拍">＋</button>
          </span>
          <span class="ctl" id="bc-travel-wrap">过渡
            <button id="bc-travel-minus" class="btn small step" title="−1拍">−</button>
            <span id="bc-travel" class="mono bc-val">8拍</span>
            <button id="bc-travel-plus" class="btn small step" title="＋1拍">＋</button>
          </span>
          <span id="bc-sec" class="dim hide-mobile"></span>
          <span class="spacer"></span>
          <span class="dim hide-mobile">拖动块边缘可连续调节（自动吸附节拍）</span>
        </div>
        <div id="music-strip">
          <details id="audio-disc" open>
            <summary title="展开/收起音乐设置">🎵 音乐与节拍</summary>
            <div id="audio-panel">
              <!-- 主行（常驻，服务对齐编辑）：载入/更换音乐、BPM、首拍+对齐、节拍器；缩放服务时间线查看 -->
              <button id="btn-load-audio" class="btn small">载入音乐…</button>

              <span id="audio-name" class="dim">未载入音乐</span>
              <span class="vsep"></span>
              <label class="ctl">BPM <input id="bpm-input" type="number" min="30" max="300" step="1" style="width:56px"></label>
              <label class="ctl">首拍 <input id="offset-input" type="number" min="0" step="0.01" style="width:64px">s</label>
              <button id="btn-align-playhead" class="btn small" title="把当前队形块的起点对齐到播放头所在时间戳（自动调整前一段过渡时长）">⇤ 对齐到播放头</button>
              <label class="ctl" title="节拍器（播放时每拍一声，小节首拍高音）"><input type="checkbox" id="pb-metro">节拍器</label>
              <span class="spacer"></span>
              <button id="tl-zoom-out" class="btn small" title="缩小时间线">－</button>
              <button id="tl-zoom-in" class="btn small" title="放大时间线">＋</button>
              <button id="tl-zoom-fit" class="btn small" title="适应宽度">⤢</button>
              <!-- 校准子行（默认收起）：低频校准工具收进折叠，主行保持对齐编辑动线最短 -->
              <details id="calib-disc">
                <summary title="展开/收起校准工具（点拍 / 小节 / 数拍入场 / 试听 / 连续时长）">校准</summary>
                <div id="calib-panel">
                  <button id="btn-tap" class="btn small" title="连点 3 次起算，取最近 8 次平均（停 2.5s 重新起算）">点拍</button>
                  <label class="ctl">小节 <select id="bpb-select"><option value="4">4拍</option><option value="3">3拍</option><option value="2">2拍</option><option value="6">6拍</option></select></label>
                  <label class="ctl">数拍入场 <input id="countin-input" type="number" min="0" max="32" style="width:44px"></label>
                  <button id="btn-offset-test" class="btn small" title="从首拍前2秒播放，检查对齐">试听</button>
                  <label class="ctl" title="开：改某块保持时长后续块顺延；关：压缩自身过渡、后续块不动"><input type="checkbox" id="ripple-check" checked>连续时长</label>
                </div>
              </details>
            </div>
          </details>
          <div id="tl-scroll"><div id="tl-inner">
            <canvas id="tl-canvas"></canvas>
            <canvas id="tl-overlay"></canvas>
          </div></div>
        </div>
      </div>
    </div>

    <!-- 移动端底部 Tab -->
    <nav id="mobile-tabs">
      <button data-mtab="formations">队形</button>
      <button data-mtab="stage" class="active">舞台</button>
      <button data-mtab="more">更多</button>
    </nav>
  </section>

  <!-- 说明书全屏覆盖层（移动端「更多」入口打开；桌面与页签复用同一 renderManual 内容） -->
  <div id="manual-overlay" hidden>
    <header class="manual-ov-head">
      <span class="manual-ov-title">📖 使用说明书</span>
      <button id="btn-manual-close" class="btn small">完成 ✕</button>
    </header>
    <div id="manual-overlay-body" class="manual-ov-body"></div>
  </div>

  <!-- 弹窗与提示 -->
  <div id="modal-root" hidden></div>
  <div id="toasts"></div>
</div>
<script>
/* Formation Studio 单文件版 —— 由 scripts/build-single.mjs 生成，勿手改
   深链契约（Phase 4）：/apps/wuzhen/index.html?import=<encodeURIComponent(项目 JSON 的 URL)>
   打开即导入（同源或 https；新建副本 id 不覆盖既有项目；query 用后即清）。
   由 runDeeplinkImport（main 模块）实现，publish.mjs 按此形态产出深链。 */
window.FS = window.FS || {};

/* ===== module: model ===== */
FS.model = FS.model || {};
FS.model = FS.model || {};
(function(){
'use strict';

// 数据模型与时间轴计算 —— 纯逻辑，无 DOM 依赖（可在 Node 中单测）
// 约定：坐标单位米，原点舞台左上，+x 右 +y 下；角度 0=上(−y)、顺时针、0..359

const DEFAULT_BPM = 120;
const ROLE_COLOR = { M: '#3b82f6', F: '#ec4899', X: '#10b981' };
const ROLE_NAME = { M: '男', F: '女', X: '其他' };

let _uidCounter = 0;
function uid(prefix = 'id') {
  _uidCounter = (_uidCounter + 1) % 1e6;
  return `${prefix}_${Date.now().toString(36)}${_uidCounter.toString(36)}${Math.random().toString(36).slice(2, 6)}`;
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

// ---------- 创建 ----------
function addDancer(project, name, role = 'X', short = '') {
  const d = { id: uid('d'), name, short: short || nextShort(project, role), role, color: ROLE_COLOR[role] || ROLE_COLOR.X };
  project.dancers.push(d);
  for (const f of project.formations) ensureDancerInFormation(project, f, d.id);
  return d;
}
function nextShort(project, role) {
  const used = new Set(project.dancers.map(d => d.short));
  let n = 1;
  while (used.has(String(n))) n++;
  return String(n);
}
// createProject：pairs=「对数」（M/F 交替生成的数量语义，无任何绑定）；grouping=预定义编组方案
//   'gender'（默认）→ 建「男士」「女士」两组；'none' → 不建组。
// presetMerged=true → 初始化预设「已组合」：开场队形对每对 addMerge(…,'capsule') 并
//   collapseUnit 收拢到各对默认点位的中点（保持双横排布局节奏），建档即成 pairs 个合并单元；
//   两人间距 0 ≤ 合并阈值，呈示为胶囊；拖动/拆开走既有单元原子语义。旧项目载入不受影响。
function createProject({ title = '未命名队列舞', pairs = 6, extraM = 0, extraF = 0, grouping = 'gender', presetMerged = false } = {}) {
  const project = {
    version: 1,
    meta: { title, team: '', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
    stage: { widthM: 12, depthM: 16, audience: 'bottom', gridM: 0.5, snap: true, backstageM: 2, bgImage: null },
    audio: { name: '', durationSec: 0, bpm: DEFAULT_BPM, beatsPerBar: 4, firstBeatSec: 0 },
    settings: { labelMode: 'no' }, // 项目级显示设置：'no'=编号序号(1..N) | 'short'=简称 | 'name'=姓名
    dancers: [], groups: [], formations: [],
    timeline: { blocks: [], countInBeats: 8, metronome: false, playSpeed: 1 },
  };
  for (let i = 1; i <= pairs; i++) {
    addDancer(project, `M${i}`, 'M', String(i));
    addDancer(project, `F${i}`, 'F', String(i));
  }
  for (let i = 1; i <= extraM; i++) addDancer(project, `M${pairs + i}`, 'M');
  for (let i = 1; i <= extraF; i++) addDancer(project, `F${pairs + i}`, 'F');
  if (grouping === 'gender') {
    const men = project.dancers.filter(d => d.role === 'M').map(d => d.id);
    const women = project.dancers.filter(d => d.role === 'F').map(d => d.id);
    if (men.length) project.groups.push({ id: uid('g'), name: '男士', memberIds: men });
    if (women.length) project.groups.push({ id: uid('g'), name: '女士', memberIds: women });
  }
  // 初始队形：双横排
  const f = { id: uid('f'), name: '开场队形', color: '#64748b', note: '', positions: {} };
  project.formations.push(f);
  genDefaultRows(project, f);
  if (presetMerged) applyPresetMerged(project, f, pairs);
  syncTimeline(project);
  return project;
}
// 「已组合」预设后处理：M_i×F_i 两两合并为 capsule 单元并收拢（位置=各对的默认队形点位中点）。
// 收拢后间距 0 ≤ 合并阈值 0.8m → 呈示为胶囊徽标；数据形态与手动 merge 完全一致（帧级 merges）。
function applyPresetMerged(project, f, pairs) {
  const byName = n => project.dancers.find(d => d.name === n);
  for (let i = 1; i <= pairs; i++) {
    const m = byName(`M${i}`), w = byName(`F${i}`);
    if (!m || !w) continue;
    if (addMerge(f, m.id, w.id, 'capsule')) collapseUnit(f, m.id, w.id);
  }
}
function genDefaultRows(project, f) {
  const ids = orderedDancers(project);
  const { widthM: W, depthM: H } = project.stage;
  const n = ids.length, rows = n <= 4 ? 1 : 2, m = 1.5;
  const per = Math.ceil(n / rows);
  const spacing = per > 1 ? (W - 2 * m) / (per - 1) : 0;
  const face = faceAudience(project.stage);
  ids.forEach((id, i) => {
    const r = Math.floor(i / per), c = i % per;
    const rowCount = Math.min(per, n - r * per);
    const off = (per - rowCount) * spacing / 2;
    f.positions[id] = { x: m + off + c * spacing, y: H / 2 + (r - (rows - 1) / 2) * 1.6, facing: face };
  });
}

// ---------- 舞者 / 编组 ----------
function dancerById(project, id) { return project.dancers.find(d => d.id === id) || null; }
function orderedDancers(project) { return project.dancers.map(d => d.id); }
function removeDancer(project, dancerId) {
  project.dancers = project.dancers.filter(d => d.id !== dancerId);
  // 编组成员联动清理（删除组≠删除舞者；反之删舞者需清引用）
  for (const g of project.groups || []) g.memberIds = (g.memberIds || []).filter(id => id !== dancerId);
  for (const f of project.formations) {
    delete f.positions[dancerId];
    // 帧内合并单元引用一并清理（保证 positions 键 === dancers id、merges 不悬挂）
    if (f.merges) {
      f.merges = f.merges.filter(m => m.a !== dancerId && m.b !== dancerId);
      if (!f.merges.length) delete f.merges;
    }
  }
}

// ---------- RTS 式编组（project.groups：纯选择辅助，可与合并交叉叠加，不改变渲染/数据语义） ----------
function groupById(project, groupId) { return (project.groups || []).find(g => g.id === groupId) || null; }
function nextGroupName(project) {
  const used = new Set((project.groups || []).map(g => g.name));
  let n = 1;
  while (used.has(`组${n}`)) n++;
  return `组${n}`;
}
function createGroup(project, memberIds = [], name = '') {
  const g = { id: uid('g'), name: name || nextGroupName(project), memberIds: [...memberIds] };
  project.groups = project.groups || [];
  project.groups.push(g);
  return g;
}
function removeGroup(project, groupId) {
  project.groups = (project.groups || []).filter(g => g.id !== groupId);
}
function renameGroup(project, groupId, name) {
  const n = String(name ?? '').trim().slice(0, 40);
  if (!n) return;
  const g = groupById(project, groupId);
  if (g) g.name = n;
}
function setGroupMembers(project, groupId, memberIds) {
  const g = groupById(project, groupId);
  if (g) g.memberIds = [...new Set(memberIds)];
}
// 组选择的单元原子展开：成员若在合并单元中，展开为整单元两人
function expandUnits(formation, ids) {
  const out = [];
  const seen = new Set();
  for (const id of ids) {
    const m = formation && (formation.merges || []).find(x => x.a === id || x.b === id);
    for (const u of (m ? [m.a, m.b] : [id])) {
      if (!seen.has(u)) { seen.add(u); out.push(u); }
    }
  }
  return out;
}
// 从更早的队形顺延缺失舞者的位置（查不到则放舞台中心附近）
function carryPositionsForward(project, index) {
  const f = project.formations[index];
  if (!f) return;
  const { widthM, depthM } = project.stage;

  // 'no'=编号序号(1..N) | 'short'=简称 | 'name'=姓名（缺失回退简称→序号），长名截断省略。
  const ordinalOf = new Map(project.dancers.map((d, i) => [d.id, i + 1]));
  const labelOf = id => {
    const d = dancerById(id);
    if (!d) return '?';
    return truncateLabel(dancerLabel(project, d, ordinalOf.get(id) || 0));
  };
  function drawOne(id, p, px, py, rr, sel) {
    const d = dancerById(id); if (!d) return;
    // 朝向指示（圆内指针）
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate((p.facing || 0) * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(0, -rr * 0.55); ctx.lineTo(rr * 0.42, rr * 0.38); ctx.lineTo(-rr * 0.42, rr * 0.38);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2);
    ctx.fillStyle = d.color || '#64748b'; ctx.fill();
    ctx.lineWidth = sel ? Math.max(2.5, s * 0.09) : Math.max(1, s * 0.04);
    ctx.strokeStyle = sel ? '#0ea5e9' : 'rgba(15,23,42,.55)'; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${Math.max(8, rr * 0.95)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(labelOf(id), px, py + rr * 0.05);
  };
  function rrPath(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  };
  // 合并单元符号：capsule=圆角矩形（左右各色+编号）/ single=单编号圆+虚线外环
  function drawUnitSymbol(style, idA, idB, a, b, sel, alpha) {
    const cx = (X(a.x) + X(b.x)) / 2, cy = (Y(a.y) + Y(b.y)) / 2;
    const dA = dancerById(idA), dB = dancerById(idB);
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    if (style === 'single') {
      // 单编号：只画一个与单舞者同尺寸的圆（编号取成员中序号较小者，随 labelMode 呈示）；
      // 叠加虚线外环（主题强调色）——虚线环已足够区分于单人，×2 角标已移除
      const acc = dark ? '#38bdf8' : '#0284c7';
      const ord = v => ordinalOf.get(v?.id) ?? Number.MAX_SAFE_INTEGER;
      const dd = [dA, dB].filter(Boolean).sort((x, y) => ord(x) - ord(y) || String(x.short).localeCompare(String(y.short)))[0] || dA;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = dd?.color || '#64748b'; ctx.fill();
      ctx.lineWidth = sel ? Math.max(2.5, s * 0.09) : Math.max(1, s * 0.04);
      ctx.strokeStyle = sel ? '#0ea5e9' : 'rgba(15,23,42,.55)'; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${Math.max(8, r * 0.95)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(dd ? labelOf(dd.id) : '?', cx, cy + r * 0.05);
      // 虚线外环（与内圆留出间隙）
      ctx.beginPath(); ctx.arc(cx, cy, r * 1.45, 0, Math.PI * 2);
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = Math.max(1.2, s * 0.05);
      ctx.strokeStyle = acc; ctx.stroke();
      ctx.setLineDash([]);
    } else { // capsule 圆角矩形
      const w = r * 3.4, hh = r * 1.5;
      const x0 = cx - w / 2, y0 = cy - hh / 2, rad = hh * 0.45;
      ctx.save();
      rrPath(x0, y0, w, hh, rad); ctx.clip();
      ctx.fillStyle = dA?.color || '#64748b'; ctx.fillRect(x0, y0, w / 2, hh);
      ctx.fillStyle = dB?.color || '#94a3b8'; ctx.fillRect(x0 + w / 2, y0, w / 2, hh);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(cx - 1, y0, 2, hh); // 中缝
      ctx.restore();
      rrPath(x0, y0, w, hh, rad);
      ctx.lineWidth = sel ? Math.max(3, s * 0.1) : 2;
      ctx.strokeStyle = sel ? '#0ea5e9' : (dark ? '#f8fafc' : '#334155');
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${Math.max(8, hh * 0.62)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(labelOf(idA), cx - w * 0.25, cy + hh * 0.02);
      ctx.fillText(labelOf(idB), cx + w * 0.25, cy + hh * 0.02);
    }
    ctx.restore();
  };
  function drawBond(a, b, alpha = 1) {
    ctx.save();
    ctx.strokeStyle = `rgba(56,189,248,${0.45 * alpha})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(X(a.x), Y(a.y)); ctx.lineTo(X(b.x), Y(b.y));
    ctx.stroke();
    ctx.restore();
  };

  // 合并单元（帧级 merges）：接近=合并符号，分离=两圆+虚线（"拉伸的合并"）
  for (const m of opts.merges || []) {
    const a = positions[m.a], b = positions[m.b];
    if (!a || !b) continue;
    const sel = inSel(m.a) || inSel(m.b);
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d <= MERGE_DIST) {
      drawUnitSymbol(m.style, m.a, m.b, a, b, sel);
    } else {
      drawBond(a, b);
      drawOne(m.a, a, X(a.x), Y(a.y), r, inSel(m.a));
      drawOne(m.b, b, X(b.x), Y(b.y), r, inSel(m.b));
    }
  }
  // 未合并舞者（单圆）
  const mergedIds = new Set((opts.merges || []).flatMap(m => [m.a, m.b]));
  for (const [id, p] of Object.entries(positions)) {
    if (mergedIds.has(id)) continue;
    drawOne(id, p, X(p.x), Y(p.y), r, inSel(id));
  }
  return view;
}

// ---------- 交互视图 ----------
class StageView {
  constructor(canvas, ctx2d, getScene, hooks) {
    this.canvas = canvas;
    this.ctx = ctx2d;
    this.getScene = getScene;     // () => {project, positions, formation, selection:Set, showGhost, showPaths, playbackPos, readOnly}
    this.hooks = hooks;           // {select(ids,{add}), mutateLive(fn), commit(label), onStageClick()}
    this.view = null;
    this.box = null;
    this.boxOrigin = null; // 长按框选起点标记（触摸/笔；桌面鼠标框选为 null）
    this._spaceHeld = false;   // 空格（平移修饰键）按住状态，由 main.js 键盘接线驱动
    this._spaceGesture = false; // 本次按住空格期间是否发生过指针手势
    this.gesture = createGestureMachine(this._makeGestureHost());
    this._bind();
    this._ro = new ResizeObserver(() => this.requestDraw());
    this._ro.observe(canvas.parentElement);
  }

  // ---- 坐标换算 ----
  toStage(px, py) {
    const rect = this.canvas.getBoundingClientRect();
    const v = this.view;
    return { x: (px - rect.left - v.ox) / v.scale, y: (py - rect.top - v.oy) / v.scale };
  }
  ensureView() {
    const rect = this.canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const W = rect.width, H = rect.height;
    if (this.canvas.width !== Math.round(W * dpr) || this.canvas.height !== Math.round(H * dpr)) {
      this.canvas.width = Math.round(W * dpr); this.canvas.height = Math.round(H * dpr);
      this.view = null;
    }
    const scene = this.getScene();
    const fit = fitView(W, H, scene.project.stage, 16);
    if (!this.view) this.view = fit;
    else {
      const min = fit.scale * 0.5, max = fit.scale * 8;
      this.view.scale = Math.min(max, Math.max(min, this.view.scale));
    }
    return { W, H, dpr };
  }
  requestDraw() {
    // 同步重绘：画布元素少开销低，且不受 rAF/定时器节流影响
    this.draw();
  }

  // ---- 切帧动效（纯舞台 UI 动画：不经过播放引擎、不动播放头/时间线） ----
  startPositionsPreview(fromFormation, toFormation, durationMs = 700) {
    if (!fromFormation || !toFormation) return;
    this.anim = {
      from: fromFormation.positions, to: toFormation.positions,
      t0: performance.now(), dur: Math.max(200, durationMs),
    };
    this.gesture?.reset(); // 动效打断进行中的手势
    this.box = null;
    this.boxOrigin = null;
    this._animTick();
  }
  _animTick() {
    if (!this.anim) return;
    const elapsed = performance.now() - this.anim.t0;
    if (elapsed >= this.anim.dur) {
      this.anim = null;
      this.draw();
      this.hooks.onSwitchAnimEnd?.();
      return;
    }
    this.draw();
    setTimeout(() => this._animTick(), 16);
  }
  resetView() { this.view = null; this.requestDraw(); }
  zoomAt(cx, cy, factor) {
    this.ensureView();
    const rect = this.canvas.getBoundingClientRect();
    const px = cx - rect.left, py = cy - rect.top;
    const sx = (px - this.view.ox) / this.view.scale, sy = (py - this.view.oy) / this.view.scale;
    this.view.scale *= factor;
    this.view.ox = px - sx * this.view.scale;
    this.view.oy = py - sy * this.view.scale;
    this.clampPan();
    this.requestDraw();
  }
  // 平移软钳制：舞台始终保留 ≥80px 可见
  clampPan() {
    const scene = this.getScene();
    if (!scene?.project || !this.view) return;
    const rect = this.canvas.getBoundingClientRect();
    const b = stageBounds(scene.project.stage);
    const s = this.view.scale, W = rect.width, H = rect.height, m = 80;
    this.view.ox = Math.min(W - m - b.x0 * s, Math.max(m - b.x1 * s, this.view.ox));
    this.view.oy = Math.min(H - m - b.y0 * s, Math.max(m - b.y1 * s, this.view.oy));
  }

  draw() {
    const scene = this.getScene();
    if (!scene?.project) return;
    // DEFECT-M-1 同源守卫：画布隐藏（rect 0×0，如 boot 中编辑器尚未显示）时不绘制，
    // 防止把 fitView 的兜底 scale 写进 this.view 污染首次可见绘制
    const probeRect = this.canvas.getBoundingClientRect();
    if (probeRect.width < 1 || probeRect.height < 1) return;
    const { W, H, dpr } = this.ensureView();
    const ctx = this.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = (typeof document !== 'undefined' && document.documentElement.dataset.theme === 'light') ? '#dfe6ee' : '#0b1220';
    ctx.fillRect(0, 0, W, H);
    const project = scene.project;
    // 切帧动效期间：插值位置优先（不影响编辑数据，仅绘制）
    let animPos = null;
    if (this.anim) {
      const t = easeInOut(Math.min(1, (performance.now() - this.anim.t0) / this.anim.dur));
      animPos = {};
      const ids = new Set([...Object.keys(this.anim.from), ...Object.keys(this.anim.to)]);
      for (const id of ids) {
        const a = this.anim.from[id] || this.anim.to[id], b = this.anim.to[id] || this.anim.from[id];
        if (a && b) animPos[id] = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, facing: lerpAngle(a.facing || 0, b.facing || 0, t) };
      }
    }
    const positions = scene.playbackPos || animPos || scene.formation?.positions || {};

    // ghost / paths
    let ghost = null, nextPositions = null;
    if (!scene.playbackPos && !scene.readOnly) {
      const i = scene.formationIndex;
      if (scene.showGhost) {
        ghost = [];
        if (i > 0) ghost.push(project.formations[i - 1]);
        if (i < project.formations.length - 1) ghost.push(project.formations[i + 1]);
        if (!ghost.length) ghost = null;
      }
      if (scene.showPaths && i < project.formations.length - 1) nextPositions = project.formations[i + 1].positions;
    }
    // 使用当前视图（缩放/平移状态），不被 fitView 每帧重置
    this.view = drawScene(ctx, { x: 0, y: 0, w: W, h: H }, project, positions, {
      view: this.view,
      ghost, nextPositions,
      merges: scene.merges || [],
      selection: scene.selection,
      showGrid: scene.showGrid,
      theme: scene.theme,
      pad: 16,
      onImageLoad: () => this.requestDraw(),
    });

    // 框选矩形（画布内像素坐标）
    if (this.box) {
      const { x0, y0, x1, y1 } = this.box;
      ctx.save();
      ctx.fillStyle = 'rgba(56,189,248,.12)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      const x = Math.min(x0, x1), y = Math.min(y0, y1);
      ctx.fillRect(x, y, Math.abs(x1 - x0), Math.abs(y1 - y0));
      ctx.strokeRect(x, y, Math.abs(x1 - x0), Math.abs(y1 - y0));
      ctx.restore();
      // 长按框选起点标记：小圆点+细虚线环（触摸/笔长按触发的轻量反馈；零尺寸矩形阶段的可见主体）
      if (this.boxOrigin) {
        ctx.save();
        ctx.fillStyle = 'rgba(56,189,248,.95)';
        ctx.strokeStyle = 'rgba(56,189,248,.6)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(this.boxOrigin.x, this.boxOrigin.y, 7, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(this.boxOrigin.x, this.boxOrigin.y, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    // 朝向把手（恰好选中一名舞者且非播放）
    this.handlePx = null;
    if (scene.facingHandle && scene.singleSelected && scene.selection?.size >= 1 && !scene.playbackPos && !scene.readOnly) {
      const id = [...scene.selection][0];
      const p = positions[id];
      if (p) {
        const v = this.view;
        const rect = this.canvas.getBoundingClientRect();
        const fr = (p.facing || 0) * Math.PI / 180;
        const hx = v.ox + (p.x + Math.sin(fr) * 0.9) * v.scale;
        const hy = v.oy + (p.y - Math.cos(fr) * 0.9) * v.scale;
        this.handlePx = { x: hx + rect.left, y: hy + rect.top, px: hx, py: hy };
        ctx.save();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(v.ox + p.x * v.scale, v.oy + p.y * v.scale);
        ctx.lineTo(hx, hy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8'; ctx.fill();
        ctx.restore();
      }
    }
  }

  // ---- 命中 ----
  // 始终按单个舞者命中（返回被点中的那一个 id）；合并单元的原子展开（整单元选择/拖拽）
  // 由 gesture.js 状态机基于 merges 完成
  // 重合时优先命中后绘制的（视觉上层）
  hitDancer(sx, sy) {
    const scene = this.getScene();
    const positions = scene.playbackPos || scene.formation?.positions || {};
    const entries = Object.entries(positions);
    let best = null, bd = Infinity;
    for (let i = entries.length - 1; i >= 0; i--) {
      const [id, p] = entries[i];
      const d = Math.hypot(p.x - sx, p.y - sy);
      if (d < DANCER_R * 1.35 && d < bd) { bd = d; best = id; }
    }
    return best;
  }
  hitHandle(px, py) {
    if (!this.handlePx) return false;
    return Math.hypot(px - this.handlePx.x, py - this.handlePx.y) < 16;
  }

  // ---- 手势：委托 gesture.js 纯状态机；本类只做坐标换算、命令执行与渲染 ----
  _makeGestureHost() {
    return {
      // 查询
      readOnly: () => !!this.getScene().readOnly,
      hitHandle: (px, py) => this.hitHandle(px, py),
      hitDancer: (x, y) => this.hitDancer(x, y),
      toStage: (px, py) => this.toStage(px, py),
      selection: () => [...(this.getScene().selection || [])],
      multiSelect: () => !!this.getScene().multiSelect,
      formation: () => this.getScene().formation,
      fmtIndex: () => this.getScene().formationIndex,
      now: () => performance.now(),
      stage: () => this.getScene().project.stage,
      // 命令
      select: (ids, opts) => this.hooks.select(ids, opts || {}),
      applyPositions: map => this.hooks.mutateLive(p => {
        const f = p.formations[this.getScene().formationIndex];
        for (const [id, v] of Object.entries(map)) {
          const q = f.positions[id];
          if (q) Object.assign(q, v);
        }
      }),
      rollback: map => this.hooks.mutateLive(p => {
        const f = p.formations[this.getScene().formationIndex];
        for (const [id, v] of Object.entries(map)) {
          const q = f.positions[id];
          if (q) { q.x = v.x; q.y = v.y; }
        }
      }),
      commit: label => this.hooks.commit(label),
      showMenu: payload => {
        // .unit-menu 是 #stage-wrap 内的 absolute 定位：必须给容器相对坐标（客户坐标会双重偏移）
        const rect = this.canvas.getBoundingClientRect();
        const wrap = this.canvas.parentElement?.getBoundingClientRect();
        const dx = wrap ? rect.left - wrap.left : 0, dy = wrap ? rect.top - wrap.top : 0;
        const v = this.view;
        const at = payload.at || { x: 0, y: 0 };
        this.hooks.showUnitMenu({ ...payload, screen: { x: dx + v.ox + at.x * v.scale, y: dy + v.oy + at.y * v.scale } });
      },
      hideMenu: () => this.hooks.hideUnitMenu?.(),
      box: (rect, opts = {}) => {
        if (!rect) { this.box = null; this.boxOrigin = null; this.requestDraw(); return; }
        const r = this.canvas.getBoundingClientRect(); // client px → 画布内像素（渲染用）
        this.box = { x0: rect.x0 - r.left, y0: rect.y0 - r.top, x1: rect.x1 - r.left, y1: rect.y1 - r.top };
        // 长按框选（触摸/笔）起点反馈：opts.origin=在锚点画低调标记（桌面鼠标框选不画，视觉不变）
        this.boxOrigin = opts.origin ? { x: rect.x0 - r.left, y: rect.y0 - r.top } : null;
        this.requestDraw();
      },
      panBy: (dx, dy) => {
        this.ensureView();
        this.view.ox += dx; this.view.oy += dy;
        this.clampPan();
        this.requestDraw();
      },
      zoomAt: (cx, cy, f) => this.zoomAt(cx, cy, f),
      requestDraw: () => this.requestDraw(),
    };
  }

  _bind() {
    const cv = this.canvas;
    // 事件翻译：button=按下键位（1=中键）、space=空格按住状态（main.js 键盘接线跟踪，
    // 经事件对象传给手势机——手势机保持纯函数、不读 DOM）
    const ev = e => ({ pointerId: e.pointerId, px: e.clientX, py: e.clientY, shift: e.shiftKey, touch: e.pointerType !== 'mouse', button: e.button, space: this._spaceHeld });
    cv.addEventListener('pointerdown', e => {
      if (e.button === 1) e.preventDefault(); // 中键按下：防浏览器自动滚动
      if (this._spaceHeld) this._spaceGesture = true; // 本次按住空格期间发生了指针手势
      try { cv.setPointerCapture(e.pointerId); } catch {} // 合成事件/已释放指针时可能抛错
      this.gesture.down(ev(e));
    });
    cv.addEventListener('pointermove', e => this.gesture.move(ev(e)));
    cv.addEventListener('pointerup', e => this.gesture.up(ev(e)));
    cv.addEventListener('pointercancel', () => this.gesture.cancel());
    // 右键上下文菜单：拦掉浏览器默认菜单；命中舞者且手势机 IDLE 时弹出
    // （合并=单元菜单/未合并=删除菜单，与触摸长按共用同一浮窗与关闭路径）
    cv.addEventListener('contextmenu', e => {
      e.preventDefault();
      this.gesture.contextMenu({ px: e.clientX, py: e.clientY });
    });
    // 中键的兼容鼠标事件默认行为（自动滚动）同样拦掉
    cv.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
    cv.addEventListener('wheel', e => {
      // F-07（UX-07）：一律 preventDefault（阻断触控板双指横滑触发的历史导航）。
      // 横向主导（触控板双指横滑；Shift+滚轮在 Chrome 换轴后也以 deltaX 到达）=舞台水平平移；
      // 纵向/捏合（ctrl+wheel）维持缩放语义不变。
      e.preventDefault();
      if (!e.ctrlKey && !e.metaKey && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        this.panView(-e.deltaX, 0);
        return;
      }
      this.zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012));
    }, { passive: false });
  }
  // 平移（像素）：wheel 横滑等桌面输入通道用（触摸/指针手势经手势机 host.panBy 走同一钳制）
  panView(dx, dy) {
    this.ensureView();
    this.view.ox += dx; this.view.oy += dy;
    this.clampPan();
    this.requestDraw();
  }

    const pps = this.ppsOf(p);

    const hits = [];
    for (const s of segments) {
      const hx = beatToSec(p, s.holdEnd) * pps;
      const tx = beatToSec(p, s.travelEnd) * pps;
      if (s.hasTravel && Math.abs(x - hx) < tol) hits.push({ kind: 'hold', seg: s });

      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const edges = this.edgeHits(x);
      this.cv.style.cursor = edges.length ? 'ew-resize' : 'default';

      for (const hit of edges) hoverSeg = hit.seg.i;
      if (hoverSeg === null && y >= (this.blocksTop ?? 0) && y <= (this.blocksTop ?? 0) + (this.blocksH ?? 0)) {
        const p = this.hooks.getProject();
        if (p) {
          const beat = this.xToBeat(x);
          for (const s of computeSegments(p).segments) {

          }
        }
      }
      if (this.hoverSeg !== hoverSeg) { this.hoverSeg = hoverSeg; this.render(); }

    }
    const p = this.hooks.getProject();
    const r = this.cv.getBoundingClientRect();
    const x = e.clientX - r.left;
    const spbV = spb(p);
    const minBeats = 0.5;
    if (drag.kind === 'scrub') {

      return;
    }
    let beat = this.xToBeat(x);
    // 吸附到整拍
    beat = Math.round(beat);
    this.hooks.mutate(proj => {
      const blk = proj.timeline.blocks[drag.seg.i];
      const next = proj.timeline.blocks[drag.seg.i + 1];
      if (drag.kind === 'hold') {
        const newHold = Math.max(minBeats, beat - drag.seg.holdStart);
        if (this.hooks.ripple()) {
          blk.holdBeats = newHold;
        } else {
          const d = newHold - (drag.seg.holdEnd - drag.seg.holdStart);
          blk.holdBeats = newHold;
          blk.travelBeats = Math.max(0, blk.travelBeats - d); // 压缩自身过渡，后续块不动
        }
      } else if (drag.kind === 'travel' && next) {

  }
  _up() {
    if (this.drag && (this.drag.kind === 'hold' || this.drag.kind === 'travel')) {

    }
    this.drag = null;
  }
}

// 语义（与「‹ 项目库」按钮严格一致）：进编辑器压入恰一条哨兵条目；浏览器后退到哨兵
// → 应用内回库（等价点「‹ 项目库」），再次返回才真正离开；应用内回库（按钮路径）时
// 主动弹掉哨兵并吞掉随之而来的 popstate；前进到哨兵（曾后退过）=重开该项目；

    exitUi() { if (marked()) { suppress++; io.back(); } }, // 应用内回库（按钮路径）：弹掉哨兵条目
    onPop(st, view) {

      if (view === 'editor' && !(st && st.fs === 'editor')) return { action: 'toLibrary' };
      if (view === 'library' && st && st.fs === 'editor') return { action: 'reopen', pid: st.pid };

    card.addEventListener('click', () => onOpen(p));
    card.addEventListener('contextmenu', e => {
      e.preventDefault(); // 原生菜单不再静默复制：隐藏手势并入显式菜单（左键打开不变）
      showLibCardMenu(e.clientX, e.clientY, p, { onOpen, onDuplicate, onDelete });
    });
    grid.append(card);
  }
}

// ---------- 新建项目向导 ----------
// 「初始方案」预设：std6=现状默认（6 对独立）；merged6/merged8=建档即两两合并为胶囊单元
// （经 opts.presetMerged 走 store/M 既有合并数据形态，拖动/拆开语义不变）；custom=保持既有
// 能力（「对数」可编辑）。「对数」输入可用性随预设切换：仅自定义可编辑；「初始编组」
// gender/none 照旧适用于所有预设。
function showNewProjectModal(onCreate) {
  const title = h('input', { type: 'text', value: '未命名队列舞', style: 'width:100%' });
  const PRESET_PAIRS = { std6: 6, merged6: 6, merged8: 8 }; // 预设 → 固定对数（custom 才可编辑）
  const preset = h('select', { style: 'width:160px' },
    h('option', { value: 'std6' }, '标准 · 6 对（独立）'),
    h('option', { value: 'merged6' }, '6 对 · 已组合'),
    h('option', { value: 'merged8' }, '8 对 · 已组合'),
    h('option', { value: 'custom' }, '自定义'));
  const pairs = h('input', { type: 'number', min: '0', max: '30', value: '6', style: 'width:80px' });
  const extraM = h('input', { type: 'number', min: '0', max: '30', value: '0', style: 'width:80px' });
  const extraF = h('input', { type: 'number', min: '0', max: '30', value: '0', style: 'width:80px' });
  const grouping = h('select', { style: 'width:120px' },
    h('option', { value: 'gender' }, '男士 / 女士'),
    h('option', { value: 'none' }, '不分组'));
  const applyPreset = () => {
    if (preset.value === 'custom') { pairs.disabled = false; return; }
    pairs.value = String(PRESET_PAIRS[preset.value] ?? 6);
    pairs.disabled = true;
  };
  preset.addEventListener('change', applyPreset);
  applyPreset(); // 默认 std6：对数=6 且不可编辑
  const body = h('div', {},
    h('div', { class: 'prop-row' }, h('label', {}, '项目名称'), title),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '初始方案'), preset),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '对数（男女各半）'), pairs),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '额外男舞者'), extraM),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '额外女舞者'), extraF),
    h('div', { class: 'prop-row', style: 'margin-top:8px' }, h('label', {}, '初始编组'), grouping),
    h('p', { class: 'dim', style: 'margin-top:10px' }, '先建好名单进入编辑器，之后可随时在「名册」中增删舞者、加入编组。「已组合」方案会把每对男女合并为一个单元建档，之后可随时拆开。'));
  const m = modal('新建项目', body, [
    h('button', { class: 'btn primary', onclick: () => {
      onCreate({
        title: title.value.trim() || '未命名队列舞',
        pairs: Math.max(0, +pairs.value || 0),
        extraM: Math.max(0, +extraM.value || 0),
        extraF: Math.max(0, +extraF.value || 0),
        grouping: grouping.value,
        presetMerged: preset.value === 'merged6' || preset.value === 'merged8',
      });
      m.close();
    } }, '创建'),
  ]);
  title.focus(); title.select();
}

// ---------- 名册弹窗（v3：普通表格 + 重编号码 + 编组 chips，无舞对概念） ----------
function showRosterModal({ mutate, toast: t, getProject }) {
  const wrap = h('div', {});
  const render = () => {
    const project = getProject(); // 每次实时取，撤销/重做后引用不会失效
    wrap.innerHTML = '';
    const groups = project.groups || [];
    const tb = h('tbody', {});
    project.dancers.forEach(d => {
      const roleSel = h('select', { onchange: () => mutate(p => { const dd = p.dancers.find(x => x.id === d.id); dd.role = roleSel.value; dd.color = { M: '#3b82f6', F: '#ec4899', X: '#10b981' }[roleSel.value]; }, '修改舞者') },
        ...Object.entries(ROLE_NAME).map(([v, n]) => h('option', { value: v, ...(d.role === v ? { selected: true } : {}) }, n)));
      const nameInp = h('input', { type: 'text', value: d.name, onchange: () => mutate(p => { p.dancers.find(x => x.id === d.id).name = nameInp.value; }, '重命名舞者') });
      const shortInp = h('input', { type: 'text', value: d.short, maxlength: '3', style: 'width:44px', onchange: () => mutate(p => { p.dancers.find(x => x.id === d.id).short = shortInp.value; }, '修改简称') });
      // 颜色可编辑（round23 需求 2 补全）：取色器即改即存；改角色仍会重置为角色默认色（既有语义）
      const colorInp = h('input', { type: 'color', value: d.color || '#64748b', title: '舞者颜色', style: 'width:34px;height:26px;padding:0;border:none;background:none', onchange: () => mutate(p => { p.dancers.find(x => x.id === d.id).color = colorInp.value; }, '修改颜色') });
      // 编组 chips：每枚可点 = 加入/移出该组（一名舞者可属多组）
      const groupCell = h('td', { class: 'roster-groups' },
        ...groups.map(g => {
          const inG = (g.memberIds || []).includes(d.id);
          return h('button', { class: 'chip' + (inG ? ' chip-on' : ''), title: `${inG ? '移出' : '加入'}「${g.name}」`, onclick: () => {
            mutate(p => {
              const g2 = (p.groups || []).find(x => x.id === g.id);
              if (!g2) return;
              if (inG) g2.memberIds = g2.memberIds.filter(x => x !== d.id);
              else g2.memberIds.push(d.id);
            }, inG ? '移出编组' : '加入编组');
            render();
          } }, g.name);
        }),
        groups.length ? null : h('span', { class: 'dim' }, '—'));
      tb.append(h('tr', {},
        h('td', {}, nameInp), h('td', {}, shortInp), h('td', {}, roleSel),
        h('td', {}, colorInp),
        groupCell,
        h('td', {}, h('button', { class: 'btn small danger', onclick: () => {
          if (!confirm(`删除舞者「${d.name}」？（将从所有队形移除）`)) return;
          mutate(p => {
            M.removeDancer(p, d.id);
          }, '删除舞者');
          render();
        } }, '删除'))));
    });
    wrap.append(
      h('div', { class: 'prop-group' },
        h('div', { class: 'pg-title' }, `舞者（${project.dancers.length}）`),
        h('table', { class: 'roster-table' },
          h('thead', {}, h('tr', {}, h('th', {}, '姓名'), h('th', {}, '简称'), h('th', {}, '角色'), h('th', {}, '颜色'), h('th', {}, '编组'), h('th', {}, ''))),
          tb),
        h('div', { style: 'display:flex;gap:6px;margin-top:8px' },
          h('button', { class: 'btn small', onclick: () => { mutate(p => { M.addDancer(p, `舞者${p.dancers.length + 1}`, 'X'); }, '添加舞者'); render(); } }, '＋ 单人'),
          h('button', { class: 'btn small', title: '按名册当前列表顺序重编（第 n 人 = n）', onclick: () => { mutate(p => { M.renumberShorts(p); }, '重编号码'); render(); } }, '重编号码')),
        !project.dancers.length ? h('div', { class: 'dim', style: 'margin-top:6px' }, '名单为空：点「＋ 单人」添加舞者。') : null,
        groups.length ? h('div', { class: 'dim', style: 'margin-top:8px' }, `编组：${groups.map(g => `${g.name}(${g.memberIds.length})`).join('、')}。点击每行编组芯片加入/移出，一名舞者可属多组。`) : null));
  };
  render();
  // 撤销/重做会替换 project 对象：引用变化时重渲染弹窗；关闭时退订
  let unsub = null;
  if (getProject) {
    let lastProj = getProject();
    unsub = subscribe(() => {
      const np = getProject();
      if (np && np !== lastProj) { lastProj = np; render(); }
    });
  }
  const m = modal('名册 · 舞者与编组', wrap, [], { onClose: () => unsub?.() });
  return m;
}

    const title = document.createElement('div');
    title.className = 'um-title';
    title.textContent = `所选 ${payload.ids.length} 人`;
    el.append(title);
  } else if (payload.mode === 'context' && !ctxMerge) {
    // 未合并舞者的上下文菜单（触摸/笔长按、鼠标右键共用）：仅「删除」
    const d = M.dancerById(store.getState().project, payload.ids[0]);
    const title = document.createElement('div');
    title.className = 'um-title';
    title.textContent = `舞者 · ${d ? d.name : '?'}`;
    el.append(title);
    el.append(mkDeleteBtn());
  } else {
    const title = document.createElement('div');
    title.className = 'um-title';
    title.textContent = '合并单元';
    el.append(title);
  }
  // 样式按钮（合并确认时点击即以该样式创建；单元操作时切换样式）
  const mkStyleBtn = sty => {
    const b = document.createElement('button');
    b.className = 'um-btn' + (payload.style === sty ? ' um-cur' : '');
    b.textContent = UNIT_STYLE_LABEL[sty] || sty;
    b.addEventListener('click', () => {
      if (payload.mode === 'merge') {
        store.mutate(p => {
          const f = p.formations[store.getState().formationIndex];
          if (!f) return;
          M.addMerge(f, payload.ids[0], payload.ids[1], sty);
          M.collapseUnit(f, payload.ids[0], payload.ids[1]);
        }, '合并单元');
      } else {
        store.mutate(q => { M.setMergeStyle(q.formations[store.getState().formationIndex], payload.ids[0], payload.ids[1], sty); }, '切换单元样式');
      }
      hideUnitMenu();
    });
    return b;
  };
  // 拆分按钮（即既有「拆开」入口，规格 #9：移除 merge 记录、两人原地保留）：
  // 按钮文案保持「拆开」——L2 仪器 page-l2 以文本匹配点击该按钮，改名留给 reviewer 同步
  const mkUntieBtn = () => {
    const untie = document.createElement('button');
    untie.className = 'um-btn';
    untie.textContent = '✂ 拆开';
    untie.addEventListener('click', () => {
      store.mutate(q => { M.removeMerge(q.formations[store.getState().formationIndex], payload.ids[0], payload.ids[1]); }, '拆开单元');
      // 拆开后两人成为独立舞者：清掉原单元选择，避免下一次拖动走组拖路径（拆开→各自拖动）
      store.setUI({ selection: store.getState().selection.filter(id => !payload.ids.includes(id)) });
      hideUnitMenu();
    });
    return untie;
  };
  // 多选菜单按钮（mode='multi'，round23 需求 1）：操作对象=整个 selection（N=展开单元后人数）。
  // 恰选 2 人且未合并 → 「合并为单元」（capsule 建单元，与面板按钮同语义）；
  // 涉及合并单元 → 「取消合并」（拆开所有涉及单元，成员原地保留，涉及成员移出选择防组拖残留）；
  // 「删除所选（N 人）」恒可用（替代单人「删除」）。样式按钮不在此出现——恰选一个单元时
  // 状态机已分流到既有单元浮窗（样式按钮唯一出现处）。
  const mkMultiMergeBtn = () => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.textContent = '合并为单元';
    b.addEventListener('click', () => {
      store.mutate(p => {
        const f = p.formations[store.getState().formationIndex];
        if (!f) return;
        M.addMerge(f, payload.ids[0], payload.ids[1], 'capsule');
        M.collapseUnit(f, payload.ids[0], payload.ids[1]);
      }, '合并单元');
      hideUnitMenu();
    });
    return b;
  };
  const mkMultiUntieBtn = involved => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.textContent = '✂ 取消合并';
    b.addEventListener('click', () => {
      store.mutate(p => {
        const f = p.formations[store.getState().formationIndex];
        for (const m of involved) M.removeMerge(f, m.a, m.b);
      }, '取消合并');
      const touched = new Set(involved.flatMap(m => [m.a, m.b]));
      store.setUI({ selection: store.getState().selection.filter(id => !touched.has(id)) });
      hideUnitMenu();
    });
    return b;
  };
  const mkMultiDeleteBtn = n => {
    const b = document.createElement('button');
    b.className = 'um-btn';
    b.textContent = `删除所选（${n} 人）`;
    b.style.color = '#ef4444'; // 危险动作着色（同单人删除）
    b.addEventListener('click', () => {
      store.mutate(p => { for (const id of payload.ids) M.removeDancer(p, id); }, `删除所选（${n} 人）`);
      store.setUI({ selection: store.getState().selection.filter(id => !payload.ids.includes(id)) });
      hideUnitMenu();
    });
    return b;
  };
  // 按钮区按 mode 分支（DEFECT-R-1 根因：原 else 同时覆盖 context 与 unit 两种 mode）：
  // merge → 样式×2；unit → 拆开+样式×2+删除（既有顺序不变）；context+有 merge → 样式×2+拆开+删除；
  // context+无 merge → 标题分支已加「删除」，此处不追加；multi → 合并/取消合并（按态）+删除所选（N 人）。
  // ✕ 取消按钮在下方对所有形态统一追加。
  if (payload.mode === 'merge') {
    for (const sty of M.UNIT_STYLES) el.append(mkStyleBtn(sty));
  } else if (payload.mode === 'unit') {
    el.append(mkUntieBtn());
    for (const sty of M.UNIT_STYLES) el.append(mkStyleBtn(sty));
    el.append(mkDeleteBtn()); // 删除单元 = 两名成员一并从队形与名册移除
  } else if (payload.mode === 'multi') {
    const involved = (currentFormation()?.merges || []).filter(m => payload.ids.includes(m.a) || payload.ids.includes(m.b));
    if (payload.ids.length === 2 && !involved.length) el.append(mkMultiMergeBtn());
    if (involved.length) el.append(mkMultiUntieBtn(involved));
    el.append(mkMultiDeleteBtn(payload.ids.length));
  } else if (ctxMerge) {
    for (const sty of M.UNIT_STYLES) el.append(mkStyleBtn(sty));
    el.append(mkUntieBtn());
    el.append(mkDeleteBtn());
  }
  const cancel = document.createElement('button');
  cancel.className = 'um-btn um-cancel';
  cancel.textContent = '✕';
  cancel.addEventListener('click', hideUnitMenu);
  el.append(cancel);
  wrap.append(el);
  unitMenuEl = el;
  // 定位并钳制在容器内
  const wr = wrap.getBoundingClientRect();
  el.style.left = Math.max(4, Math.min(payload.screen.x - 40, wr.width - el.offsetWidth - 4)) + 'px';
  el.style.top = Math.max(4, Math.min(payload.screen.y + 10, wr.height - el.offsetHeight - 4)) + 'px';
}

// ---------- history 哨兵（F-04 / UX-04） + 右键策略（F-08 / UX-08） ----------
// 哨兵：进编辑器 pushState 恰一条（决策机在 ui.js，node 可测）；popstate 在编辑器内发生
// =应用内回库（与点「‹ 项目库」完全同语义：stop+closeProject），再次返回才真正离开；
// 前进到哨兵=重开该项目；应用内回库时决策机弹掉哨兵 → 库⇄编辑器往返不堆积条目。
const sentinel = createHistorySentinel({
  push: () => history.pushState({ fs: 'editor', pid: store.getState().projectId }, ''),
  back: () => history.back(),
  state: () => history.state,
});
let sentinelView = null;
function trackViewForSentinel(view) {
  if (view === sentinelView) return;
  const prev = sentinelView;
  sentinelView = view;
  if (view === 'editor' && prev !== 'editor') sentinel.enter();
  else if (view === 'library' && prev === 'editor') sentinel.exitUi();
}
function wireHistory() {
  window.addEventListener('popstate', e => {
    const act = sentinel.onPop(e.state, store.getState().view);
    if (act.action === 'toLibrary') { player?.stop(); store.closeProject(); }
    else if (act.action === 'reopen' && act.pid) {
      store.openProject(act.pid).then(ok => { if (!ok) history.replaceState(null, ''); }); // 项目已被删：摘掉标记防卡死条目
    }
  });
}
// 右键策略：编辑器视图内统一拦截浏览器原生菜单（与画布自定义菜单同一防御面，
// 消除时间轴/播放条/面板的漏拦拼盘）；输入框/文本域/下拉与名册表格豁免（保留系统
// 粘贴/拼写菜单）。项目库视图不在此拦（卡片右键有自己的显性菜单，见 ui.js F-09）。
function wireContextMenu() {
  document.addEventListener('contextmenu', e => {
    if (store.getState().view !== 'editor') return;
    const t = e.target;
    if (t && t.closest && t.closest('input, textarea, select, .roster-table')) return;
    e.preventDefault();
  });
}

// ---------- Phase 4 · 深链导入（docs/choreo-skill-plan.md Phase 4，与 skill 线 publish.mjs 的契约） ----------
// 契约 URL：GET /apps/wuzhen/index.html?import=<encodeURIComponent(项目 JSON 的 URL)>
// 行为：boot（store init 完成后）解析 import 参数 → fetch（仅同源 http / 任意 https，见
// resolveImportUrl）→ JSON → M.validateProject → store.importProject（新建 id、标题加「（副本）」，
// 不覆盖既有项目）→ history.replaceState 剥掉 import 参数（防刷新重导入）→ toast「已导入项目 X」。
// 显式深链优先于 lastProject 自动恢复（深链在 init 之后执行、整体覆盖状态）；失败路径 toast 明确
// 错误并正常进应用既有视图，不 crash、无未捕获异常（本函数全部错误都在内部转成结果对象）。
// SW 侧配套：dist/sw.js 对导航请求 cache.match(..., {ignoreSearch:true}) + './' 回退——带 query
// 的深链在断网时也能打开（scripts/build-single.mjs swSource）。
// 纯函数 + 依赖注入（fetchImpl/validate/importProject/toast/replaceState），node 可测。
function parseImportParam(hrefOrSearch) {
  if (typeof hrefOrSearch !== 'string' || !hrefOrSearch) return null;
  const qi = hrefOrSearch.indexOf('?');
  if (qi === -1) return null;
  let search = hrefOrSearch.slice(qi);
  const hi = search.indexOf('#');
  if (hi !== -1) search = search.slice(0, hi); // hash 不属于 query 值
  try {
    const v = new URLSearchParams(search).get('import');
    return v && v.trim() ? v : null;
  } catch { return null; }
}
function stripImportParam(href) { // 只摘 import 参数，其余 query/hash 原样保留
  if (typeof href !== 'string' || !href) return href;
  const hi = href.indexOf('#');
  const hash = hi === -1 ? '' : href.slice(hi);
  const noHash = hi === -1 ? href : href.slice(0, hi);
  const qi = noHash.indexOf('?');
  if (qi === -1) return href;
  let sp;
  try { sp = new URLSearchParams(noHash.slice(qi)); } catch { return href; }
  if (!sp.has('import')) return href;
  sp.delete('import');
  const rest = sp.toString();
  let head = noHash.slice(0, qi);
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(head)) { // 绝对 URL → 同文档相对形态（pathname 起，replaceState 更稳）
    try { head = new URL(head).pathname; } catch {}
  }
  return head + (rest ? '?' + rest : '') + hash;
}
function resolveImportUrl(raw, baseUrl) { // 仅 https（任意 host）或 http 同源；其余拒绝
  try {
    const u = new URL(raw, baseUrl || undefined);
    if (u.protocol === 'https:') return u;
    if (u.protocol === 'http:') {
      const origin = (typeof location !== 'undefined' && location.origin) || (baseUrl ? new URL(baseUrl).origin : '');
      if (origin && u.origin === origin) return u;
    }
    return null;
  } catch { return null; }
}
async function runDeeplinkImport(deps) {
  const url = typeof deps.url === 'string' ? deps.url : '';
  const raw = parseImportParam(url);
  if (raw == null) return { status: 'none' };
  const cleaned = stripImportParam(url);
  const done = res => {
    try { deps.replaceState?.(cleaned); } catch {} // 成败都清参：刷新不再重导入/重报错
    if (res.status === 'error' && res.message) deps.toast?.(res.message);
    return res;
  };
  const u = resolveImportUrl(raw, deps.baseUrl || url);
  if (!u) return done({ status: 'error', reason: 'scheme', message: '深链导入失败：项目文件地址仅支持同源或 https' });
  let resp;
  try { resp = await deps.fetchImpl(u.href, { redirect: 'follow' }); }
  catch (e) { return done({ status: 'error', reason: 'network', message: `深链导入失败：无法获取项目文件（${e?.message || '网络异常'}）` }); }
  if (!resp.ok) return done({ status: 'error', reason: 'http', httpStatus: resp.status, message: `深链导入失败：项目文件无法获取（HTTP ${resp.status}）` });
  let json;
  try { json = JSON.parse(await resp.text()); }
  catch { return done({ status: 'error', reason: 'parse', message: '深链导入失败：文件不是合法 JSON' }); }
  // v2 项目文件可内嵌音乐（dataBase64）：validateProject 会剥离该字段，先还原为 Blob，导入后回填
  let audioBlob = null;
  try {
    if (json && json.audio && json.audio.dataBase64) {
      const bin = atob(String(json.audio.dataBase64));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      audioBlob = new Blob([bytes], { type: json.audio.dataFormat || 'audio/mpeg' });
      delete json.audio.dataBase64;
      delete json.audio.dataFormat;
    }
  } catch { audioBlob = null; }
  const r = deps.validate(json);
  if (!r.ok) return done({ status: 'error', reason: 'validate', errors: r.errors, message: `深链导入失败：${r.errors[0] || '项目校验未通过'}` });
  deps.importProject(r.project);
  if (audioBlob) { try { await deps.onAudio?.(audioBlob); } catch {} }
  const title = r.project.meta.title || '导入项目';
  deps.toast?.(`已导入项目：${title}${audioBlob ? '（音乐已恢复）' : ''}`);
  return done({ status: 'imported', title, hasAudio: !!audioBlob, project: r.project });
}
async function wireDeeplinkImport() {
  try {
    await runDeeplinkImport({
      url: location.href,
      baseUrl: location.href,
      fetchImpl: (u, o) => fetch(u, o),
      validate: M.validateProject,
      importProject: p => { player?.stop(); store.importProject(p); },
      onAudio: async blob => { // 与「导入项目文件…」同语义：内嵌音乐回填到新项目 id
        await store.storage.putAudio(store.getState().projectId, blob);
        // DEFECT-R26-3 同源：下载版存储往返不可用，直接回填会话音频（在线通道行为不变）
        await audio.loadBlob(blob, store.getState().project?.audio?.name || blob.name || '').catch(() => {});
      },
      toast,
      replaceState: cleaned => history.replaceState(null, '', cleaned),
    });
  } catch (e) {
    console.error('深链导入异常', e);
    toast('深链导入失败：应用内部错误');
  }
}

// ---------- 启动 ----------
async function boot() {
  buildStage();
  buildPlayer();
  buildStrips();
  wireTopbar();
  wireStageTools();
  wirePlaybar();
  wireAudioPanel();
  wireMobileTabs();
  wireManual();
  wireLibrary();
  wireOfflineNote();
  wireKeyboard();
  wireHistory();
  wireContextMenu();
  try {
    applyTheme(store.getState().theme);
    await store.init(localStorage.getItem('fs.lastProject') || undefined);
  } catch (e) {
    console.error('初始化失败', e);
    toast('本地存储不可用，已进入空项目库');
    store.setUI({ view: 'library' });
  }
  await restoreAudio(); // 自动恢复上次项目时同步恢复音频
  await wireDeeplinkImport(); // Phase 4 深链：在 init 之后执行 → 显式 import 参数优先于 lastProject 自动恢复
  render(store.getState());
  store.subscribe(render);
}
function buildStage() {
  const cv = $('stage-canvas');
  stageView = new StageView(cv, cv.getContext('2d'), stageScene, {
    select: selectIds,
    mutateLive: fn => store.mutate(fn, null),
    commit: commitWithThumbs,
    showUnitMenu: showUnitMenu,
    hideUnitMenu: hideUnitMenu,
  });
  new ResizeObserver(() => stageView.requestDraw()).observe($('stage-wrap'));
}
// 提交历史并刷新队形缩略图
function commitWithThumbs(label) {
  store.commit(label);
  leftStrip?.drawThumbs();
}
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'light' ? '#f1f5f9' : '#0f172a';
}
function buildPlayer() {
  player = new Player({
    audio,
    getProject: () => store.getState().project,
    onTick: t => {
      const proj0 = store.getState().project;
      // 任务#20：数拍期播放头呈「入场」（beatLabel 会把负拍钳成 1.1，这里不覆写 onCountin 的呈示）
      if (!player.countin) $('pb-pos').textContent = proj0 ? M.beatLabel(proj0, t.beat) : '—';
      const f = store.getState().project?.formations[t.formationIndex];
      $('pb-formation').textContent = f ? `${t.formationIndex + 1}. ${f.name}` : '';
      // 真实播放中高亮跟随节拍；切帧预览/seek 不抢占用户选择的队形
      if (player.playing && !player.previewing && store.getState().formationIndex !== t.formationIndex) {
        store.setUI({ formationIndex: t.formationIndex });
        if (document.getElementById('pb-loop').checked) updateLoop();
      }
      stageView?.requestDraw();
      musicTl?.drawPlayhead();
    },
    onPreviewEnd: () => {
      // 预览结束回到编辑视图：播放头归零，舞台显示当前所选队形
      player.seekBeat(0);
      stageView?.requestDraw();
      musicTl?.drawPlayhead();
    },
    onStateChange: ({ playing, reason }) => {
      $('pb-play').textContent = playing ? '⏸' : '▶';
      if (!playing) renderUndoButtons();
      // 任务#7（报告#8）：音频先于时间轴自然结束——一次性 toast，播放头停在音频末拍
      if (reason === 'audio') toast('音乐已结束');
      updateMusicLock(); // 任务#2：播放/暂停切换即刷新 BPM/首拍锁
    },
    onCountin: n => {
      const ov = $('countin-overlay');
      if (n > 0) {
        ov.hidden = false; ov.textContent = n;
        // 任务#20（P3 cosmetic）：数拍期播放头显示「入场」、播放键呈 ⏸（可点击=取消倒计）
        $('pb-pos').textContent = '入场';
        $('pb-play').textContent = '⏸';
      } else {
        ov.hidden = true;
        $('pb-play').textContent = player.playing ? '⏸' : '▶';
      }

    },
  });
}
function buildStrips() {
  const hooks = {
    getProject: () => store.getState().project,
    getIndex: () => store.getState().formationIndex,
    select: i => switchFormation(i),
    add: () => addFormation(),
    duplicate: i => addFormation(i),
    delete: () => deleteFormation(),
    move: (from, to) => { player.pause(); store.mutate(p => M.moveFormation(p, from, to), '调整队形顺序'); },
  };
